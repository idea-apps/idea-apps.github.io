<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Warstwy (wariant 75)</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:18px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display",Helvetica,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;background:#0b0b12}
.brand{position:fixed;left:4vw;top:24px;z-index:30;font-weight:800;font-size:20px;letter-spacing:-.03em}
.brand small{display:block;font-weight:500;font-size:13px;opacity:.7}
.tabs{position:fixed;top:78px;left:50%;transform:translateX(-50%);z-index:20;display:flex;gap:6px;padding:6px;background:rgba(255,255,255,.1);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.22);border-radius:99px;max-width:94vw;overflow-x:auto}
.tabs button{all:unset;cursor:pointer;display:flex;align-items:center;gap:8px;padding:6px 16px 6px 6px;border-radius:99px;font-weight:700;font-size:14.5px;white-space:nowrap;transition:.35s}
.tabs button .ico,.tabs button .ico-fallback{width:32px;height:32px;border-radius:50%;object-fit:cover;display:grid;place-items:center;font:800 14px sans-serif;color:#fff}
.tabs button:hover{background:rgba(255,255,255,.14)}
.tabs button.on{background:#fff;color:#14141c}
.scene{position:fixed;inset:0;z-index:5;display:grid;place-items:center;perspective:1600px;padding-top:70px}
.card{position:relative;width:min(1080px,92vw);height:min(540px,64vh);margin-top:30px;transform-style:preserve-3d;transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s ease-out}
.card.sw{animation:cs .9s cubic-bezier(.3,.9,.3,1)}
@keyframes cs{0%{opacity:0;transform:rotateY(-40deg) translateZ(-200px) scale(.9)}100%{opacity:1}}
.L{position:absolute;inset:0;border-radius:40px}
.bg{background:var(--g);box-shadow:0 60px 100px -30px rgba(0,0,0,.7),inset 0 0 0 1.5px rgba(255,255,255,.28);overflow:hidden;transform:translateZ(0)}
.bg::before{content:"";position:absolute;width:70%;aspect-ratio:1;right:-10%;top:-30%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.38),transparent 65%)}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,rgba(255,255,255,.12) 50%,transparent 60%);transform:translateX(calc(var(--mx,0)*60%));transition:transform .2s}
.wm{position:absolute;right:2%;bottom:-18%;font:900 clamp(320px,36vw,560px)/1 sans-serif;letter-spacing:-.1em;color:rgba(255,255,255,.12);transform:translateZ(30px) translate(calc(var(--mx,0)*-30px),calc(var(--my,0)*-20px))}
.txt{position:absolute;left:0;top:0;bottom:0;width:58%;padding:44px 46px;display:flex;flex-direction:column;justify-content:center;transform:translateZ(80px)}
.txt small{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.txt h1{font-size:clamp(54px,7.4vw,120px);line-height:.86;letter-spacing:-.075em;font-weight:900;margin:8px 0 14px;margin-left:-.04em}
.txt .t{font-size:clamp(19px,2vw,28px);font-weight:700;letter-spacing:-.025em;line-height:1.2;max-width:15em;margin-bottom:12px}
.txt .w{opacity:.88;margin-bottom:18px;font-size:16px}
.btn{all:unset;cursor:pointer;display:inline-flex;gap:10px;background:#fff;color:#14141c;font-weight:800;padding:13px 24px;border-radius:99px;font-size:16px;transition:.25s}
.btn:hover{transform:translateY(-2px)}
.btn.g{background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.4);margin-left:8px;text-decoration:none}
.phw{position:absolute;right:7%;top:50%;height:92%;aspect-ratio:9/19.5;transform:translateY(-50%) translateZ(140px) translate(calc(var(--mx,0)*18px),calc(var(--my,0)*14px)) rotate(4deg)}
.ph{width:100%;height:100%;border-radius:44px;overflow:hidden;background:#000;box-shadow:0 0 0 8px #0a0a0e,0 0 0 10px rgba(255,255,255,.2),0 50px 80px -10px rgba(0,0,0,.65)}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top}
.ph .fb{width:100%;height:100%;display:grid;place-items:center;font:900 160px sans-serif;color:#fff;background:linear-gradient(160deg,rgba(255,255,255,.25),rgba(0,0,0,.35))}
.ic{position:absolute;right:31%;bottom:2%;width:96px;height:96px;border-radius:25%;object-fit:cover;display:grid;place-items:center;font:800 46px sans-serif;color:#fff;box-shadow:0 26px 50px rgba(0,0,0,.5);transform:translateZ(200px) translate(calc(var(--mx,0)*30px),calc(var(--my,0)*24px)) rotate(-8deg);overflow:hidden}
.ic img{width:100%;height:100%;object-fit:cover}
.hint{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);font-size:14px;opacity:.7;z-index:20}
@media(max-width:900px){.txt{width:100%;padding:30px 28px}.phw{display:none}.ic{display:none}.txt h1{font-size:15vw}.card{height:62vh}}
</style>
</head>
<body>
<div class="brand">ideaapps<small>Marcin Polak · iOS · tvOS · AI</small></div>
<div class="tabs" id="tabs"></div>
<main class="scene"><div class="card" id="card"></div></main>
<div class="hint">porusz myszką: karta ma głębię · strzałki zmieniają aplikację</div>
<script src="data.js"></script><script src="fx.js"></script><script src="ui.js"></script>
<script>
const {projects}=IDEA;
const $=s=>document.querySelector(s);
const au=IDEA.fx.aurora();
$('#tabs').innerHTML=projects.map((p,i)=>`<button data-i="${i}">${IDEA.iconHTML(p,'')}${p.name}</button>`).join('');
let cur=-1;
function select(i){if(i===cur)return;cur=i;const p=projects[i];const pa=au.set(p.color);
 document.querySelectorAll('.tabs button').forEach((b,k)=>b.classList.toggle('on',k===i));
 const c=$('#card');c.classList.remove('sw');void c.offsetWidth;c.classList.add('sw');
 c.innerHTML=`<div class="L bg" style="--g:linear-gradient(140deg,${pa.a},${pa.c} 70%,${pa.deep})"><div class="wm">${p.name[0]}</div></div>
 <div class="L txt"><small>${p.cat} · ${p.platforms.split(' · ')[0]}</small><h1>${p.name}</h1><div class="t">${p.tag}</div><div class="w">Dla: ${p.who}</div><div><button class="btn" id="more">Szczegóły →</button><a class="btn g" href="${p.url}" target="_blank" rel="noopener">App Store ↗</a></div></div>
 <div class="phw"><div class="ph">${p.shot&&p.id!=='boxes'?`<img src="${p.shot}" alt="">`:`<div class="fb">${p.name[0]}</div>`}</div></div>
 <div class="ic" style="background:${p.icon?'transparent':p.color}">${p.icon?`<img src="${p.icon}" alt="">`:p.name[0]}</div>`;
 $('#more').onclick=()=>IDEA.ui.app(p)}
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b)select(+b.dataset.i)});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')select((cur+1)%projects.length);if(e.key==='ArrowLeft')select((cur-1+projects.length)%projects.length)});
addEventListener('pointermove',e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;const c=$('#card');c.style.setProperty('--ry',(x*14)+'deg');c.style.setProperty('--rx',(-y*10)+'deg');c.style.setProperty('--mx',x*2);c.style.setProperty('--my',y*2)});
addEventListener('pointerleave',()=>{const c=$('#card');c.style.setProperty('--ry','0deg');c.style.setProperty('--rx','0deg')});
IDEA.ui.bar(null,'top');select(0);
</script>
</body>
</html>
