<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ideaapps — Stories (wariant 32)</title>
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#0a0a0c;color:#fff;font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,sans-serif;display:grid;place-items:center;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
.bgb{position:fixed;inset:0;z-index:0;background:var(--c,#222);filter:blur(90px) brightness(.55) saturate(1.3);opacity:.9;transition:background .6s}
.side{position:fixed;top:50%;transform:translateY(-50%);z-index:1;max-width:min(24vw,300px);font-size:15px;color:rgba(255,255,255,.7)}
.side.l{left:4vw}.side.r{right:4vw;text-align:right}
.side b{display:block;color:#fff;font-size:22px;letter-spacing:-.03em;margin-bottom:6px}
.side kbd{border:1px solid rgba(255,255,255,.35);border-radius:6px;padding:1px 8px;font:13px monospace}
.dev{position:relative;z-index:2;height:min(100vh,940px);aspect-ratio:9/16;max-width:100vw;background:#111;border-radius:26px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.6)}
@media(max-width:560px){.dev{height:100dvh;width:100vw;aspect-ratio:auto;border-radius:0}.side{display:none}}
.bars{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:4px;z-index:20}
.bars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.3);overflow:hidden}
.bars i b{display:block;height:100%;width:0;background:#fff}
.bars i.done b{width:100%}
.bars i.run b{animation:fill var(--d,6s) linear forwards}
.paused .bars i.run b{animation-play-state:paused}
@keyframes fill{to{width:100%}}
.head{position:absolute;top:26px;left:14px;right:14px;z-index:20;display:flex;align-items:center;gap:10px;font-weight:700;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.head .ico,.head .ico-fallback{width:32px;height:32px;border-radius:50%;object-fit:cover;display:grid;place-items:center;font:700 15px sans-serif;border:2px solid #fff;background:#333}
.head span{opacity:.7;font-weight:500}
.head .av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#ffb347,#ff5f6d);display:grid;place-items:center;font-weight:800;border:2px solid #fff}
.st{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .3s;padding:96px 26px 120px;display:flex;flex-direction:column;justify-content:flex-end;background:var(--c)}
.st.on{opacity:1;pointer-events:auto}
.st h2{font-size:clamp(46px,9.5vh,88px);line-height:.92;letter-spacing:-.06em;font-weight:800;margin-bottom:12px;position:relative;z-index:3}
.st p{font-size:clamp(16px,2.2vh,21px);line-height:1.3;opacity:.92;max-width:22em;position:relative;z-index:3;text-shadow:0 1px 10px rgba(0,0,0,.25)}
.st .cat{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85;margin-bottom:10px;position:relative;z-index:3}
.st .art{position:absolute;top:16%;left:50%;width:56%;margin-left:-28%;border-radius:30px;box-shadow:0 30px 70px rgba(0,0,0,.5);transform:rotate(-4deg) translateY(30px);opacity:0;transition:.7s cubic-bezier(.2,.9,.2,1) .1s;z-index:2}
.st.on .art{transform:rotate(-4deg);opacity:1}
.st .art2{position:absolute;top:24%;left:50%;width:48%;margin-left:6%;border-radius:26px;box-shadow:0 30px 60px rgba(0,0,0,.45);transform:rotate(7deg) translateY(40px);opacity:0;transition:.8s cubic-bezier(.2,.9,.2,1) .25s;z-index:1}
.st.on .art2{transform:rotate(7deg);opacity:1}
.st .bigi{position:absolute;top:18%;left:50%;width:46%;margin-left:-23%;aspect-ratio:1;border-radius:23%;object-fit:cover;display:grid;place-items:center;font:800 25vh/1 sans-serif;color:#fff;box-shadow:0 30px 70px rgba(0,0,0,.45);z-index:2;transform:scale(.7) rotate(-8deg);opacity:0;transition:.7s cubic-bezier(.3,1.4,.4,1)}
.st.on .bigi{transform:rotate(-6deg);opacity:1}
.st .bigi.ico-fallback{font-size:min(14vh,90px)}
.cta{position:absolute;left:0;right:0;bottom:24px;z-index:25;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;font-size:14px}
.cta a{background:#fff;color:#111;padding:12px 28px;border-radius:99px;margin-top:6px;pointer-events:auto;text-decoration:none}
.cta small{opacity:.75;font-weight:500}
.tap{position:absolute;top:0;bottom:90px;width:34%;z-index:15}
.tap.l{left:0}.tap.r{right:0;width:66%}
.svl{display:grid;gap:14px;position:relative;z-index:3;margin-top:8px}
.svl div{background:rgba(255,255,255,.14);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-radius:18px;padding:14px 16px;border:1px solid rgba(255,255,255,.2)}
.svl b{display:block;font-size:19px;letter-spacing:-.02em}.svl span{font-size:14px;opacity:.88}
.mailb{display:inline-block;position:relative;z-index:30;margin-top:18px;background:#fff;color:#111;font-weight:800;padding:14px 24px;border-radius:99px;text-decoration:none;font-size:clamp(14px,2.2vh,19px);overflow-wrap:anywhere}
.num{font-size:clamp(70px,16vh,140px);font-weight:800;letter-spacing:-.07em;line-height:.85}
</style>
</head>
<body>
<div class="bgb" id="bgb"></div>
<div class="side l"><b>Marcin Polak</b>iOS, tvOS i AI. Ponad 10 lat. Osiem aplikacji w App Store.</div>
<div class="side r"><b>Jak oglądać?</b>Klik w prawo: dalej<br>Klik w lewo: wstecz<br>Przytrzymaj: pauza<br><kbd>←</kbd> <kbd>→</kbd> <kbd>spacja</kbd></div>
<div class="dev" id="dev"><div class="bars" id="bars"></div><div class="head" id="head"></div><div id="sts"></div><div class="tap l" id="tl"></div><div class="tap r" id="tr"></div></div>
<script src="data.js"></script>
<script>
const {projects,services,email}=IDEA;
const $=s=>document.querySelector(s);
const deep=c=>`color-mix(in srgb,${c} 80%,#000)`;
const S=[];
S.push({c:'#2a2e55',who:'ideaapps',av:true,d:5,html:`<div class="cat">Cześć!</div><h2>Jestem<br>Marcin.</h2><p>Robię aplikacje na iPhone’a, iPada, Maca i Apple TV. Ponad dziesięć lat. Przeglądaj dalej, żeby zobaczyć, co zrobiłem.</p>`});
S.push({c:'#1f6f54',who:'ideaapps',av:true,d:5,html:`<div class="num">8</div><h2>aplikacji w App Store.</h2><p>Każdą zaprojektowałem, napisałem i wydałem sam.</p>`});
projects.forEach(p=>S.push({c:deep(p.color),who:p.name,p,d:7,html:`${p.shot&&p.id!=='boxes'?`<img class="art" src="${p.shot}" alt="">${p.shot2?`<img class="art2" src="${p.shot2}" alt="">`:''}`:IDEA.iconHTML(p,'bigi')}<div class="cat">${p.cat}</div><h2>${p.name}</h2><p>${p.tag}. ${p.desc}</p>`,cta:{t:'Zobacz w App Store',u:p.url,s:p.platforms}}));
S.push({c:'#3c3f4b',who:'ideaapps',av:true,d:9,html:`<div class="cat">Usługi</div><h2>Co mogę zbudować.</h2><div class="svl">${services.map(s=>`<div><b>${s.t}</b><span>${s.d}</span></div>`).join('')}</div>`});
S.push({c:'#b8431f',who:'ideaapps',av:true,d:0,html:`<div class="cat">Kontakt</div><h2>Masz pomysł?</h2><p>Opisz go w kilku zdaniach. Odpowiem i powiem szczerze, jak to widzę.</p><a class="mailb" href="mailto:${email}">${email}</a>`});
$('#sts').innerHTML=S.map((s,i)=>`<div class="st" style="--c:${s.c}" data-i="${i}">${s.html}${s.cta?`<div class="cta"><small>${s.cta.s}</small><a href="${s.cta.u}" target="_blank" rel="noopener">${s.cta.t} ↑</a></div>`:''}</div>`).join('');
$('#bars').innerHTML=S.map(()=>'<i><b></b></i>').join('');
let cur=-1,t=null;
function go(i){if(i<0)i=0;if(i>=S.length){i=S.length-1}
 cur=i;const s=S[i];$('#bgb').style.setProperty('--c',s.c);
 document.querySelectorAll('.st').forEach((e,k)=>e.classList.toggle('on',k===i));
 document.querySelectorAll('#bars i').forEach((b,k)=>{b.className=k<i?'done':'';if(k===i&&s.d){b.style.setProperty('--d',s.d+'s');void b.offsetWidth;b.className='run'}});
 $('#head').innerHTML=(s.av?'<span class="av">M</span>':IDEA.iconHTML(s.p,''))+`<b>${s.who}</b><span>${i+1}/${S.length}</span>`;
 clearTimeout(t);if(s.d)t=setTimeout(()=>go(i+1),s.d*1000)}
let pt=null,holdT=null,held=false,start=0,left=0;
function pause(){$('#dev').classList.add('paused');clearTimeout(t);left=Math.max(300,S[cur].d*1000-(performance.now()-start))}
function resume(){$('#dev').classList.remove('paused');if(S[cur].d)t=setTimeout(()=>go(cur+1),left)}
const origGo=go;go=function(i){start=performance.now();origGo(i)};
['tl','tr'].forEach(id=>{const el=$('#'+id);
 el.addEventListener('pointerdown',()=>{held=false;holdT=setTimeout(()=>{held=true;pause()},220)});
 el.addEventListener('pointerup',()=>{clearTimeout(holdT);if(held){resume();return}go(cur+(id==='tr'?1:-1))});
 el.addEventListener('pointerleave',()=>{clearTimeout(holdT);if(held){held=false;resume()}})});
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();go(cur+1)}if(e.key==='ArrowLeft')go(cur-1)});
go(0);
</script>
</body>
</html>
