<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Lot ikony (wariant 74)</title>
<style>
:root{--c:#2d3a8c}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:18px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display",Helvetica,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;background:var(--c)}
#flood{position:fixed;inset:0;z-index:2;clip-path:circle(0 at 50% 50%);pointer-events:none}
.bgs{position:fixed;inset:0;z-index:1;background:radial-gradient(70% 90% at 80% 30%,rgba(255,255,255,.22),transparent 65%),radial-gradient(60% 60% at 0% 100%,rgba(0,0,0,.35),transparent 70%);pointer-events:none}
.brand{position:fixed;left:4vw;top:24px;z-index:30;font-weight:800;font-size:20px;letter-spacing:-.03em}
.brand small{display:block;font-weight:500;font-size:13px;opacity:.75}
.hero{position:fixed;inset:0;z-index:5;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);align-items:center;padding:60px 5vw 190px}
.hl{display:flex;flex-direction:column;gap:16px}
#hic{width:132px;height:132px;border-radius:25%;object-fit:cover;display:grid;place-items:center;font:800 62px sans-serif;color:#fff;box-shadow:0 26px 50px rgba(0,0,0,.45);overflow:hidden}
#hic img{width:100%;height:100%;object-fit:cover}
.tx{transition:opacity .35s,transform .5s cubic-bezier(.2,.9,.2,1)}
.tx.sw{opacity:0;transform:translateY(18px)}
.tx small{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.tx h1{font-size:clamp(54px,9vw,160px);line-height:.86;letter-spacing:-.075em;font-weight:900;margin:8px 0 14px;margin-left:-.04em}
.tx .t{font-size:clamp(20px,2.4vw,32px);font-weight:700;letter-spacing:-.03em;line-height:1.2;max-width:17em;margin-bottom:14px}
.tx ul{list-style:none;padding:0;margin:0 0 20px;max-width:30em}
.tx li{padding:8px 0 8px 28px;border-bottom:1px solid rgba(255,255,255,.22);position:relative;font-size:17px}
.tx li::before{content:"✓";position:absolute;left:0;top:8px;font-weight:800}
.btn{all:unset;cursor:pointer;display:inline-flex;gap:10px;background:#fff;color:#14141c;font-weight:800;padding:14px 26px;border-radius:99px;font-size:16px;transition:.25s}
.btn:hover{transform:translateY(-2px)}
.btn.g{background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.4);margin-left:8px;text-decoration:none}
.vis{display:grid;place-items:center;height:100%;perspective:1400px}
.ph{height:min(68vh,660px);aspect-ratio:9/19.5;border-radius:48px;overflow:hidden;background:#000;box-shadow:0 0 0 9px #0a0a0e,0 0 0 11px rgba(255,255,255,.2),0 60px 100px -20px rgba(0,0,0,.65);transform:rotateY(-14deg) rotateX(4deg) rotate(-2deg);transition:transform .8s cubic-bezier(.2,.9,.2,1),opacity .4s}
.ph.sw{opacity:0;transform:rotateY(-30deg) rotateX(8deg) rotate(-6deg) translateY(40px)}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top}
.ph .fb{width:100%;height:100%;display:grid;place-items:center;font:900 min(24vh,200px) sans-serif;color:#fff;background:linear-gradient(160deg,rgba(255,255,255,.25),rgba(0,0,0,.35))}
.tray{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 5vw 26px}
.tray .cap{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.75;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:12px}
.tile{all:unset;cursor:pointer;background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.22);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px;padding:14px 10px 12px;text-align:center;transition:.35s cubic-bezier(.3,1.4,.5,1);display:block}
.tile:hover{transform:translateY(-6px);background:rgba(255,255,255,.2)}
.tile.on{background:#fff;color:#14141c;transform:translateY(-8px)}
.tile .ico,.tile .ico-fallback{width:clamp(44px,5vw,66px);height:clamp(44px,5vw,66px);border-radius:23%;object-fit:cover;display:grid;place-items:center;font:800 26px sans-serif;color:#fff;margin:0 auto 8px;box-shadow:0 8px 16px rgba(0,0,0,.3)}
.tile.on .ico,.tile.on .ico-fallback{visibility:hidden}
.tile b{display:block;font-size:13.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.flyer{position:fixed;z-index:50;border-radius:23%;object-fit:cover;box-shadow:0 30px 60px rgba(0,0,0,.5);display:grid;place-items:center;font:800 40px sans-serif;color:#fff;overflow:hidden;transition:all .8s cubic-bezier(.5,0,.2,1)}
.flyer img{width:100%;height:100%;object-fit:cover}
@media(max-width:900px){.hero{grid-template-columns:1fr;padding:80px 6vw 200px}.vis{display:none}.grid{grid-template-columns:repeat(4,1fr)}.tray{padding-bottom:70px}}
</style>
</head>
<body>
<div id="flood"></div><div class="bgs"></div>
<div class="brand">ideaapps<small>Marcin Polak · iOS · tvOS · AI</small></div>
<main class="hero"><div class="hl"><div id="hic"></div><div class="tx" id="tx"></div></div><div class="vis" id="vis"></div></main>
<div class="tray"><div class="cap">Wybierz aplikację</div><div class="grid" id="grid"></div></div>
<script src="data.js"></script><script src="ui.js"></script>
<script>
const {projects}=IDEA;
const $=s=>document.querySelector(s);
const deep=c=>`color-mix(in srgb,${c} 78%,#0b0b12)`;
$('#grid').innerHTML=projects.map((p,i)=>`<button class="tile" data-i="${i}">${IDEA.iconHTML(p,'')}<b>${p.name}</b></button>`).join('');
const icon=(p)=>p.icon?`<img src="${p.icon}" alt="">`:p.name[0];
let cur=-1,busy=false;
function fill(i){const p=projects[i];cur=i;
 $('#hic').style.background=p.icon?'transparent':p.color;$('#hic').innerHTML=icon(p);
 const t=$('#tx');t.innerHTML=`<small>${p.cat} · ${p.platforms}</small><h1>${p.name}</h1><div class="t">${p.tag}</div><ul>${(p.feats||[]).slice(0,3).map(f=>`<li>${f}</li>`).join('')}</ul><button class="btn" id="more">Szczegóły →</button><a class="btn g" href="${p.url}" target="_blank" rel="noopener">App Store ↗</a>`;
 $('#more').onclick=()=>IDEA.ui.app(p);
 $('#vis').innerHTML=`<div class="ph">${p.shot&&p.id!=='boxes'?`<img src="${p.shot}" alt="">`:`<div class="fb">${p.name[0]}</div>`}</div>`;
 document.querySelectorAll('.tile').forEach((b,k)=>b.classList.toggle('on',k===i))}
function go(i,tile){if(busy||i===cur)return;busy=true;const p=projects[i];
 const old=$('#tx');old.classList.add('sw');const ph=document.querySelector('.ph');ph&&ph.classList.add('sw');
 const f=$('#flood');const tr=tile.getBoundingClientRect();const x=tr.left+tr.width/2,y=tr.top+tr.height/2;
 f.style.background=`radial-gradient(70% 90% at 80% 30%,rgba(255,255,255,.22),transparent 65%),${deep(p.color)}`;
 f.style.transition='none';f.style.clipPath=`circle(0px at ${x}px ${y}px)`;f.getBoundingClientRect();
 f.style.transition='clip-path .95s cubic-bezier(.65,0,.2,1)';f.style.clipPath=`circle(${Math.hypot(innerWidth,innerHeight)*1.05}px at ${x}px ${y}px)`;
 // flying icon
 const ic=tile.querySelector('.ico,.ico-fallback');const ir=ic.getBoundingClientRect();const hr=$('#hic').getBoundingClientRect();
 const fl=document.createElement('div');fl.className='flyer';fl.style.cssText=`left:${ir.left}px;top:${ir.top}px;width:${ir.width}px;height:${ir.height}px;background:${p.icon?'transparent':p.color}`;fl.innerHTML=icon(p);document.body.appendChild(fl);
 $('#hic').style.opacity=0;fl.getBoundingClientRect();
 fl.style.left=hr.left+'px';fl.style.top=hr.top+'px';fl.style.width=hr.width+'px';fl.style.height=hr.height+'px';
 setTimeout(()=>{fill(i);$('#hic').style.opacity=1;const t=$('#tx');t.classList.add('sw');requestAnimationFrame(()=>requestAnimationFrame(()=>t.classList.remove('sw')))},520);
 setTimeout(()=>{fl.remove();document.documentElement.style.setProperty('--c',deep(p.color));f.style.transition='none';f.style.clipPath=`circle(0px at ${x}px ${y}px)`;busy=false},1000)}
$('#grid').addEventListener('click',e=>{const t=e.target.closest('.tile');if(t)go(+t.dataset.i,t)});
addEventListener('keydown',e=>{const tiles=[...document.querySelectorAll('.tile')];if(e.key==='ArrowRight')go((cur+1)%projects.length,tiles[(cur+1)%projects.length]);if(e.key==='ArrowLeft'){const n=(cur-1+projects.length)%projects.length;go(n,tiles[n])}});
document.documentElement.style.setProperty('--c',deep(projects[0].color));fill(0);
IDEA.ui.bar(null,'top');
</script>
</body>
</html>
