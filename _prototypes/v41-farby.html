<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Farby (wariant 41)</title>
<style>
:root{--bg:#f4f1ea;--ink:#111}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);font:18px/1.5 -apple-system,"SF Pro Text",Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
#flood{position:fixed;inset:0;z-index:3;pointer-events:none;clip-path:circle(0 at 50% 50%);transition:clip-path .85s cubic-bezier(.65,0,.2,1)}
.app{position:relative;z-index:4;height:100%;display:grid;grid-template-columns:230px 1fr}
.sw{display:flex;flex-direction:column;border-right:1.5px solid color-mix(in srgb,var(--ink) 25%,transparent);overflow:auto;background:transparent}
.sw .brand{padding:22px 20px 14px;font-weight:800;font-size:19px;letter-spacing:-.03em}
.sw .brand small{display:block;font-weight:500;font-size:12px;opacity:.65;letter-spacing:0;margin-top:2px}
.chip{position:relative;flex:1 1 0;min-height:56px;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;padding:10px 16px;font-size:14px;font-weight:700;transition:flex .5s cubic-bezier(.3,.8,.2,1),padding .3s;background:var(--c);color:var(--tc);overflow:hidden}
.chip small{font:500 11.5px "SF Mono",ui-monospace,monospace;opacity:.8}
.chip:hover{flex-grow:1.8}
.chip.on{flex-grow:2.8}
.chip.on::after{content:"●";position:absolute;right:14px;top:12px;font-size:10px}
.main{position:relative;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:3vw;padding:5vh 5vw;min-width:0}
.t{transition:opacity .35s .35s,transform .5s .35s}
.main.sw0 .t,.main.sw0 .v{opacity:0;transform:translateY(20px);transition:none}
.t small{font:600 13px "SF Mono",ui-monospace,monospace;letter-spacing:.06em;opacity:.7}
.t h1{font-size:clamp(56px,10.5vw,190px);line-height:.82;letter-spacing:-.08em;font-weight:800;margin:10px 0 18px;margin-left:-.04em}
.t p{font-size:clamp(17px,1.5vw,22px);line-height:1.4;max-width:28em;margin-bottom:20px}
.t .m{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.t .m span{font-size:13.5px;font-weight:600;padding:5px 14px;border-radius:99px;border:1.5px solid currentColor}
.btn{display:inline-block;background:var(--ink);color:var(--bg);font-weight:700;padding:14px 26px;border-radius:99px;transition:.2s}
.btn:hover{transform:scale(1.05)}
.svl{display:grid;gap:0;margin-bottom:20px;max-width:540px}
.svl div{padding:12px 0;border-top:1.5px solid currentColor}.svl b{display:block;font-size:20px;letter-spacing:-.02em}.svl span{font-size:15px;opacity:.8}
.v{display:flex;justify-content:center;gap:22px;align-items:center;transition:opacity .35s .45s,transform .6s .45s;height:100%;max-height:78vh}
.v img{height:min(74vh,720px);aspect-ratio:9/19.5;object-fit:cover;object-position:top;border-radius:38px;box-shadow:0 40px 70px -14px rgba(0,0,0,.4),0 0 0 6px rgba(0,0,0,.85)}
.v img:nth-child(2){height:min(64vh,620px);opacity:.92;margin-top:10vh;transform:rotate(4deg)}
.v img:first-child{transform:rotate(-3deg)}
.v .big{font:800 min(40vh,380px)/1 sans-serif;letter-spacing:-.08em;opacity:.9}
.v .ico,.v .ico-fallback{width:min(34vh,300px);aspect-ratio:1;border-radius:23%;object-fit:cover;display:grid;place-items:center;font:800 min(16vh,140px) sans-serif;color:#fff;box-shadow:0 40px 70px -14px rgba(0,0,0,.45);transform:rotate(-5deg)}
@media(max-width:860px){html,body{overflow:auto}.app{grid-template-columns:1fr;height:auto;min-height:100%}.sw{flex-direction:row;overflow-x:auto;border:0;position:sticky;top:0;z-index:5}.sw .brand{display:none}.chip{flex:0 0 96px;min-height:64px}.chip:hover,.chip.on{flex-grow:0}.main{grid-template-columns:1fr;padding:30px 22px 60px}.v{max-height:none}.v img{height:360px}.v img:nth-child(2){display:none}}
</style>
</head>
<body>
<div id="flood"></div>
<div class="app"><aside class="sw" id="sw"></aside><main class="main" id="main"><div class="t" id="t"></div><div class="v" id="v"></div></main></div>
<script src="data.js"></script>
<script>
const {projects,services,email}=IDEA;
const $=s=>document.querySelector(s);
const lum=h=>{const n=parseInt(h.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255;return (.299*r+.587*g+.114*b)/255};
const ink=c=>lum(c)>.58?'#111':'#fff';
const items=[...projects.map(p=>({id:p.id,name:p.name,c:p.color,p})),{id:'uslugi',name:'Usługi',c:'#111111'},{id:'kontakt',name:'Kontakt',c:'#f4f1ea'}];
$('#sw').innerHTML=`<div class="brand">ideaapps<small>Marcin Polak · iOS · tvOS · AI</small></div>`+items.map(i=>`<div class="chip" data-id="${i.id}" style="--c:${i.c};--tc:${ink(i.c)}">${i.name}<small>${i.c.toUpperCase()}</small></div>`).join('');
function content(it){
 if(it.p){const p=it.p;return {t:`<small>${p.cat} · ${p.platforms}</small><h1>${p.name}</h1><p><b>${p.tag}.</b> ${p.desc}</p><div class="m"><span>${p.platforms.split(' · ')[0]}</span><span>${p.cat}</span></div><a class="btn" href="${p.url}" target="_blank" rel="noopener">Zobacz w App Store ↗</a>`,
  v:p.shot&&p.id!=='boxes'?`<img src="${p.shot}" alt="">${p.shot2?`<img src="${p.shot2}" alt="">`:''}`:IDEA.iconHTML(p,'')}}
 if(it.id==='uslugi')return {t:`<small>Usługi</small><h1>Co zbuduję.</h1><div class="svl">${services.map(s=>`<div><b>${s.t}</b><span>${s.d}</span></div>`).join('')}</div>`,v:`<div class="big">4</div>`};
 return {t:`<small>Kontakt</small><h1>Masz pomysł?</h1><p>Opisz w kilku zdaniach, co chcesz zbudować. Odpowiem i powiem szczerze, jak to widzę. Ponad 10 lat iOS i tvOS.</p><a class="btn" href="mailto:${email}">${email}</a>`,v:`<div class="big">@</div>`}}
let cur=null,busy=false;
function apply(it){const c=content(it);$('#t').innerHTML=c.t;$('#v').innerHTML=c.v;
 document.documentElement.style.setProperty('--bg',it.c);document.documentElement.style.setProperty('--ink',ink(it.c));
 document.querySelectorAll('.chip').forEach(e=>e.classList.toggle('on',e.dataset.id===it.id));cur=it.id}
function go(it,x,y){if(busy||cur===it.id)return;busy=true;const f=$('#flood');
 f.style.background=it.c;f.style.transition='none';f.style.clipPath=`circle(0px at ${x}px ${y}px)`;f.getBoundingClientRect();
 const m=$('#main');m.classList.add('sw0');
 f.style.transition='';f.style.clipPath=`circle(${Math.hypot(innerWidth,innerHeight)}px at ${x}px ${y}px)`;
 setTimeout(()=>{apply(it);f.style.transition='none';f.style.clipPath=`circle(0px at ${x}px ${y}px)`;m.classList.remove('sw0');busy=false},860)}
$('#sw').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;const r=c.getBoundingClientRect();go(items.find(i=>i.id===c.dataset.id),r.left+r.width/2,r.top+r.height/2)});
addEventListener('keydown',e=>{const i=items.findIndex(x=>x.id===cur);let n=null;if(e.key==='ArrowDown'||e.key==='ArrowRight')n=items[Math.min(items.length-1,i+1)];if(e.key==='ArrowUp'||e.key==='ArrowLeft')n=items[Math.max(0,i-1)];if(n)go(n,115,innerHeight/2)});
apply(items[0]);
</script>
</body>
</html>
