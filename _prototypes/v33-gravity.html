<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Grawitacja (wariant 33)</title>
<style>
:root{--bg:#f1efe9;--ink:#141414;--soft:#6b6a64}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:18px/1.5 -apple-system,"SF Pro Text",Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:20px 4vw;z-index:30;font-weight:700}
.nav span a{margin-left:24px;font-weight:500;color:var(--soft)}.nav span a:hover{color:var(--ink)}
.play{position:relative;height:100vh;min-height:620px;overflow:hidden;touch-action:none;background:linear-gradient(#f1efe9,#e7e3d8)}
.play .txt{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none;padding:0 5vw 10vh}
.play h1{font-size:clamp(46px,9.4vw,160px);line-height:.88;letter-spacing:-.07em;font-weight:800}
.play h1 em{font-style:normal;color:#ff5a36}
.play .sub{font-size:clamp(16px,1.6vw,22px);color:var(--soft);margin-top:20px;max-width:30em}
.ball{position:absolute;left:0;top:0;border-radius:23%;display:grid;place-items:center;cursor:grab;will-change:transform;box-shadow:0 10px 24px -6px rgba(0,0,0,.4);overflow:hidden;font:800 40px sans-serif;color:#fff;user-select:none;touch-action:none}
.ball:active{cursor:grabbing}
.ball img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.hint{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-size:14px;color:var(--soft);z-index:5;display:flex;gap:10px;align-items:center;pointer-events:none}
.hint i{width:8px;height:8px;border-radius:50%;background:#ff5a36;animation:b 1.4s infinite}@keyframes b{50%{transform:scale(1.8);opacity:.4}}
#sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,110%);width:min(560px,100vw);background:#fff;border-radius:30px 30px 0 0;box-shadow:0 -20px 60px rgba(0,0,0,.25);z-index:40;transition:transform .5s cubic-bezier(.2,.9,.2,1);padding:12px 26px 30px}
#sheet.on{transform:translate(-50%,0)}
#sheet .gr{width:44px;height:5px;border-radius:5px;background:#d8d5cc;margin:0 auto 18px}
#sheet .top{display:flex;gap:16px;align-items:center;margin-bottom:12px}
#sheet .top .ico,#sheet .top .ico-fallback{width:72px;height:72px;border-radius:22%;object-fit:cover;display:grid;place-items:center;font:800 34px sans-serif;color:#fff;flex:none}
#sheet h3{font-size:30px;letter-spacing:-.04em;line-height:1}#sheet small{color:var(--soft)}
#sheet p{color:#3b3a36;margin-bottom:16px}
#sheet .b{display:inline-block;background:var(--ink);color:#fff;font-weight:700;padding:12px 24px;border-radius:99px}
#sheet .x{position:absolute;top:14px;right:18px;font-size:26px;cursor:pointer;color:var(--soft);background:none;border:0}
.sec{padding:14vh 5vw 4vh}
.sec h2{font-size:clamp(40px,7vw,110px);line-height:.9;letter-spacing:-.065em;font-weight:800;margin-bottom:5vh}
.sv{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink)}
.sv div{padding:20px 20px 40px 0}.sv b{display:block;font-size:24px;letter-spacing:-.03em;line-height:1.1;margin-bottom:8px}.sv span{color:var(--soft);font-size:16px}
.end{background:var(--ink);color:#fff;border-radius:40px 40px 0 0;padding:12vh 5vw 5vh;margin-top:12vh}
.end h2{font-size:clamp(44px,9vw,150px);line-height:.88;letter-spacing:-.07em;font-weight:800}
.end a{display:inline-block;margin-top:5vh;font-size:clamp(20px,4.2vw,64px);letter-spacing:-.05em;font-weight:700;border-bottom:3px solid #ff5a36;overflow-wrap:anywhere}
.end .f{display:flex;justify-content:space-between;margin-top:9vh;font-size:14px;opacity:.55}
@media(max-width:800px){.sv{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="nav"><b>ideaapps</b><span><a href="#uslugi">Usługi</a><a href="#kontakt">Kontakt</a></span></div>
<section class="play" id="play"><div class="txt"><div><h1>Osiem aplikacji.<br><em>Złap którąś.</em></h1><p class="sub" style="margin:20px auto 0">Marcin Polak, iOS i tvOS od ponad 10 lat. Przeciągaj ikony, rzucaj nimi, klikaj po szczegóły.</p></div></div>
<div class="hint"><i></i>przeciągnij i rzuć · kliknij, żeby zobaczyć aplikację</div></section>
<section class="sec" id="uslugi"><h2>Co mogę<br>zbudować.</h2><div class="sv" id="sv"></div></section>
<footer class="end" id="kontakt"><h2>Masz pomysł?<br>Rzuć go tutaj.</h2><a id="mail" href="#"></a><div class="f"><span>© 2026 ideaapps</span><span>Swift · SwiftUI · tvOS · AI</span></div></footer>
<div id="sheet"><button class="x" id="x">×</button><div class="gr"></div><div id="sc"></div></div>
<script src="data.js"></script>
<script>
const {projects,services,email}=IDEA;
const $=s=>document.querySelector(s);
$('#mail').href='mailto:'+email;$('#mail').textContent=email;
$('#sv').innerHTML=services.map(s=>`<div><b>${s.t}</b><span>${s.d}</span></div>`).join('');
const play=$('#play');let W=play.clientWidth,H=play.clientHeight;
const R=()=>Math.max(34,Math.min(56,W/16));
const balls=projects.map((p,i)=>{const r=R();const el=document.createElement('div');el.className='ball';el.style.cssText=`width:${r*2}px;height:${r*2}px;background:${p.color}`;
 el.innerHTML=p.icon?`<img src="${p.icon}" alt="${p.name}" draggable="false">`:p.name[0];play.appendChild(el);
 return {el,p,r,x:W*.15+Math.random()*W*.7,y:-80-i*90,vx:(Math.random()-.5)*6,vy:0,drag:false}});
function resize(){W=play.clientWidth;H=play.clientHeight;const r=R();balls.forEach(b=>{b.r=r;b.el.style.width=b.el.style.height=r*2+'px'})}
addEventListener('resize',resize);
let g=.55,pointer={x:-999,y:-999},dragB=null,dpx=0,dpy=0,lastT=0,moved=0,downT=0;
play.addEventListener('pointerdown',e=>{const rc=play.getBoundingClientRect();const x=e.clientX-rc.left,y=e.clientY-rc.top;
 for(let i=balls.length-1;i>=0;i--){const b=balls[i];if(Math.hypot(x-b.x,y-b.y)<b.r){dragB=b;b.drag=true;dpx=x-b.x;dpy=y-b.y;moved=0;downT=performance.now();play.setPointerCapture(e.pointerId);break}}});
play.addEventListener('pointermove',e=>{const rc=play.getBoundingClientRect();const x=e.clientX-rc.left,y=e.clientY-rc.top;pointer={x,y};
 if(dragB){const nx=x-dpx,ny=y-dpy;moved+=Math.abs(nx-dragB.x)+Math.abs(ny-dragB.y);dragB.vx=(nx-dragB.x)*.9;dragB.vy=(ny-dragB.y)*.9;dragB.x=nx;dragB.y=ny}});
play.addEventListener('pointerup',()=>{if(dragB){const b=dragB;b.drag=false;dragB=null;if(moved<8&&performance.now()-downT<400)open(b.p)}});
play.addEventListener('pointerleave',()=>{pointer={x:-999,y:-999}});
function step(){
 balls.forEach(b=>{if(b.drag)return;b.vy+=g;b.vx*=.995;b.x+=b.vx;b.y+=b.vy;
  if(b.x<b.r){b.x=b.r;b.vx=-b.vx*.55}if(b.x>W-b.r){b.x=W-b.r;b.vx=-b.vx*.55}
  if(b.y>H-b.r){b.y=H-b.r;b.vy=-b.vy*.5;b.vx*=.97;if(Math.abs(b.vy)<1.2)b.vy=0}
  const dx=b.x-pointer.x,dy=b.y-pointer.y,d=Math.hypot(dx,dy);if(!dragB&&d<b.r+26&&d>0){b.vx+=dx/d*1.1;b.vy+=dy/d*1.1}});
 for(let k=0;k<3;k++)for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],c=balls[j];const dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy)||.01,m=a.r+c.r;
  if(d<m){const nx=dx/d,ny=dy/d,o=(m-d)/2;if(!a.drag){a.x-=nx*o;a.y-=ny*o}if(!c.drag){c.x+=nx*o;c.y+=ny*o}
   const rv=(c.vx-a.vx)*nx+(c.vy-a.vy)*ny;if(rv<0){const j2=-rv*.75;if(!a.drag){a.vx-=j2*nx;a.vy-=j2*ny}if(!c.drag){c.vx+=j2*nx;c.vy+=j2*ny}}}}
 balls.forEach(b=>{b.el.style.transform=`translate(${b.x-b.r}px,${b.y-b.r}px) rotate(${b.vx*2}deg)`});
 requestAnimationFrame(step)}
step();
function open(p){$('#sc').innerHTML=`<div class="top">${IDEA.iconHTML(p,'')}<div><h3>${p.name}</h3><small>${p.cat} · ${p.platforms}</small></div></div><p><b>${p.tag}.</b> ${p.desc}</p><a class="b" href="${p.url}" target="_blank" rel="noopener">Zobacz w App Store ↗</a>`;$('#sheet').classList.add('on')}
$('#x').onclick=()=>$('#sheet').classList.remove('on');addEventListener('keydown',e=>e.key==='Escape'&&$('#sheet').classList.remove('on'));
</script>
</body>
</html>
