<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Rozmowa (wariant 14)</title>
<style>
:root{--bg:#e9e6df;--win:#fff;--me:#0a84ff;--them:#e9e9eb;--ink:#111;--soft:#8a8a8e}
@media(prefers-color-scheme:dark){:root{--bg:#0d0d0f;--win:#000;--them:#26262a;--ink:#f2f2f7}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,sans-serif;height:100vh;display:grid;place-items:center;-webkit-font-smoothing:antialiased}
.app{width:min(520px,100vw);height:min(860px,100vh);background:var(--win);border-radius:28px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 100px -20px rgba(0,0,0,.35)}
@media(max-width:560px){.app{border-radius:0;height:100vh}}
.top{padding:16px 20px 12px;text-align:center;border-bottom:1px solid rgba(128,128,128,.2);background:color-mix(in srgb,var(--win) 90%,transparent)}
.av{width:54px;height:54px;margin:0 auto 4px;border-radius:50%;background:linear-gradient(160deg,#ffb347,#ff5f6d);color:#fff;font-weight:800;font-size:24px;display:grid;place-items:center}
.top b{font-size:13px;font-weight:600}.top small{display:block;font-size:11.5px;color:var(--soft)}
.log{flex:1;overflow:auto;padding:18px 16px 8px;display:flex;flex-direction:column;gap:6px;scroll-behavior:smooth}
.b{max-width:80%;padding:9px 14px;border-radius:19px;animation:in .3s cubic-bezier(.2,1.4,.4,1);word-wrap:break-word}
@keyframes in{from{opacity:0;transform:scale(.7) translateY(10px)}}
.b.t{align-self:flex-start;background:var(--them);border-bottom-left-radius:6px;transform-origin:left bottom}
.b.m{align-self:flex-end;background:var(--me);color:#fff;border-bottom-right-radius:6px;transform-origin:right bottom}
.b.dots{display:flex;gap:4px;padding:13px 14px}
.b.dots i{width:8px;height:8px;border-radius:50%;background:#9a9aa0;animation:d 1s infinite}
.b.dots i:nth-child(2){animation-delay:.15s}.b.dots i:nth-child(3){animation-delay:.3s}
@keyframes d{40%{transform:translateY(-4px);opacity:.5}}
.b a{color:inherit;font-weight:600}
.cr{align-self:stretch;display:flex;gap:12px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory;margin:0 -16px;padding-inline:16px;animation:in .4s}
.pc{flex:none;width:210px;border-radius:20px;overflow:hidden;background:var(--them);scroll-snap-align:start;display:block;color:inherit;text-decoration:none}
.pc .im{height:140px;display:grid;place-items:center;overflow:hidden;background:var(--c)}
.pc .im img.s{width:100%;height:100%;object-fit:cover;object-position:top}
.pc .im .ico,.pc .im .ico-fallback{width:70px;height:70px;border-radius:17px;object-fit:cover;display:grid;place-items:center;font-weight:800;font-size:32px;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.pc .tx{padding:10px 13px 13px}.pc b{display:block;font-size:16px}.pc span{display:block;font-size:13px;color:var(--soft);margin:2px 0 6px;line-height:1.3}
.pc em{font-style:normal;color:var(--me);font-weight:600;font-size:14px}
.qr{padding:10px 14px 18px;display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;border-top:1px solid rgba(128,128,128,.15);min-height:70px}
.qr button{all:unset;cursor:pointer;border:1.5px solid var(--me);color:var(--me);padding:7px 15px;border-radius:99px;font-size:15.5px;font-weight:500;transition:.15s;animation:in .3s}
.qr button:hover{background:var(--me);color:#fff}
.ts{align-self:center;font-size:11.5px;color:var(--soft);margin:6px 0}
</style>
</head>
<body>
<div class="app">
<div class="top"><div class="av">M</div><b>Marcin Polak</b><small>ideaapps · zwykle odpisuję tego samego dnia</small></div>
<div class="log" id="log"></div>
<div class="qr" id="qr"></div>
</div>
<script src="data.js"></script>
<script>
const {projects,services,email}=IDEA;
const log=document.getElementById('log'),qr=document.getElementById('qr');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const scroll=()=>log.scrollTop=log.scrollHeight;
const say=async(html,delay=650)=>{const d=document.createElement('div');d.className='b t dots';d.innerHTML='<i></i><i></i><i></i>';log.appendChild(d);scroll();await sleep(delay);d.className='b t';d.innerHTML=html;scroll()};
const me=t=>{const d=document.createElement('div');d.className='b m';d.textContent=t;log.appendChild(d);scroll()};
const carousel=()=>{const d=document.createElement('div');d.className='cr';d.innerHTML=projects.map(p=>`<a class="pc" href="${p.url}" target="_blank" rel="noopener" style="--c:${p.color}"><div class="im">${p.shot&&p.id!=='boxes'?`<img class="s" src="${p.shot}" alt="">`:IDEA.iconHTML(p,'ico')}</div><div class="tx"><b>${p.name}</b><span>${p.tag}</span><em>App Store ›</em></div></a>`).join('');log.appendChild(d);scroll()};
const flows={
 start:()=>[['Co robisz?','what'],['Pokaż projekty','proj'],['Chcę zamówić aplikację','order'],['Kim jesteś?','who']],
 what:async()=>{await say('Robię całe aplikacje na iOS i tvOS: od pomysłu po publikację w App Store.');
  for(const s of services)await say(`<b>${s.t}.</b> ${s.d}`,800);return [['Pokaż projekty','proj'],['Chcę zamówić aplikację','order']]},
 proj:async()=>{await say('Osiem własnych aplikacji, wszystkie w App Store. Przesuń w bok 👉',500);carousel();await sleep(300);await say('Każdą zrobiłem sam, od projektu po wsparcie.',700);return [['Co robisz?','what'],['Chcę zamówić aplikację','order']]},
 who:async()=>{await say('Marcin. Od ponad 10 lat piszę natywne aplikacje na iOS i tvOS, wcześniej przez kilka lat na Androida.');
  await say('Ostatnio dokładam do tego AI: w produktach i w moim warsztacie.',900);return [['Pokaż projekty','proj'],['Chcę zamówić aplikację','order']]},
 order:async()=>{await say('Super! Opisz mi w kilku zdaniach, co chcesz zbudować. Odpiszę i powiem szczerze, jak to widzę.');
  await say(`Napisz tutaj: <a href="mailto:${email}">${email}</a>`,700);return [['Pokaż projekty','proj'],['Kim jesteś?','who']]}
};
const set=opts=>{qr.innerHTML=opts.map(([t,k])=>`<button data-k="${k}">${t}</button>`).join('')};
qr.onclick=async e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k;qr.innerHTML='';me(b.textContent);await sleep(250);set(await flows[k]())};
(async()=>{const t=document.createElement('div');t.className='ts';t.textContent='Dzisiaj';log.appendChild(t);
 await say('Cześć! 👋 Jestem Marcin, robię aplikacje na iPhone’a i Apple TV.',500);
 await say('Szukasz kogoś do swojego projektu? W czym mogę pomóc?',900);set(flows.start())})();
</script>
</body>
</html>
