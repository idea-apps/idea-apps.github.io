<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Suwak (wariant 43)</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:18px/1.5 -apple-system,"SF Pro Text",Helvetica,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;background:#0b0b10;user-select:none}
a{color:inherit;text-decoration:none}
#bg{position:fixed;inset:0;z-index:0}
.blob{position:fixed;z-index:1;width:70vmin;height:70vmin;right:8vw;top:50%;margin-top:-35vmin;background:rgba(255,255,255,.14);filter:blur(2px);border-radius:46% 54% 60% 40%/50% 40% 60% 50%;animation:mo 9s ease-in-out infinite alternate}
@keyframes mo{to{border-radius:60% 40% 38% 62%/44% 58% 42% 56%;transform:rotate(30deg) scale(1.08)}}
.nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:20px 4vw;z-index:20;font-weight:700}
.nav span{font-weight:500;font-size:15px;opacity:.75}
.stage{position:relative;z-index:5;height:100%;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;padding:8vh 6vw 22vh;gap:3vw}
.txt{position:relative;min-height:380px}
.ti{position:absolute;left:0;top:50%;transform:translateY(-50%);opacity:0;transition:opacity .35s,transform .5s cubic-bezier(.2,.9,.2,1);pointer-events:none;width:100%}
.ti.on{opacity:1;pointer-events:auto;transform:translateY(-50%)}
.ti:not(.on){transform:translateY(-44%)}
.ti small{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.ti h1{font-size:clamp(54px,9.4vw,150px);line-height:.86;letter-spacing:-.07em;font-weight:800;margin:10px 0 16px}
.ti p{font-size:clamp(16px,1.5vw,21px);line-height:1.4;max-width:26em;opacity:.92;margin-bottom:18px}
.btn{display:inline-block;background:#fff;color:#111;font-weight:700;padding:13px 24px;border-radius:99px}
.phw{position:relative;height:100%;display:grid;place-items:center}
.ph{position:absolute;height:min(62vh,600px);aspect-ratio:9/19.5;border-radius:42px;overflow:hidden;box-shadow:0 0 0 8px #09090c,0 50px 90px -10px rgba(0,0,0,.55);will-change:opacity,transform}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top}
.ph .fb{width:100%;height:100%;display:grid;place-items:center;font:800 min(22vh,180px) sans-serif;color:rgba(255,255,255,.95)}
.rail{position:fixed;left:0;right:0;bottom:0;z-index:10;padding:0 6vw 4vh}
.rail .ct{display:flex;justify-content:space-between;font-size:14px;margin-bottom:14px;opacity:.85;font-weight:600}
.track{position:relative;height:84px;touch-action:none;cursor:pointer}
.track .line{position:absolute;left:28px;right:28px;top:50%;height:6px;margin-top:-3px;border-radius:6px;background:rgba(255,255,255,.28)}
.track .fill{position:absolute;left:28px;top:50%;height:6px;margin-top:-3px;border-radius:6px;background:#fff}
.tk{position:absolute;top:50%;width:48px;height:48px;margin:-24px 0 0 -24px;border-radius:23%;overflow:hidden;opacity:.62;transform:scale(.8);transition:opacity .2s,transform .25s;box-shadow:0 6px 16px rgba(0,0,0,.4)}
.tk:hover{opacity:1;transform:scale(1)}
.tk .ico,.tk .ico-fallback{width:100%;height:100%;object-fit:cover;display:grid;place-items:center;font:800 22px sans-serif;color:#fff}
.thumb{position:absolute;top:50%;width:70px;height:70px;margin:-35px 0 0 -35px;border-radius:26%;background:#fff;box-shadow:0 0 0 4px rgba(255,255,255,.35),0 14px 30px rgba(0,0,0,.5);display:grid;place-items:center;z-index:3;cursor:grab;overflow:hidden}
.thumb:active{cursor:grabbing}
.thumb .ico,.thumb .ico-fallback{width:100%;height:100%;object-fit:cover;display:grid;place-items:center;font:800 32px sans-serif;color:#fff}
.more{position:fixed;right:4vw;top:22px;z-index:20;display:flex;gap:8px}
.more button{all:unset;cursor:pointer;font-size:14px;font-weight:600;padding:7px 16px;border-radius:99px;border:1.5px solid rgba(255,255,255,.5)}
.more button:hover{background:#fff;color:#111}
.ov{position:fixed;inset:0;z-index:30;background:rgba(10,10,16,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:14vh 8vw;display:none;overflow:auto}
.ov.on{display:block}
.ov h2{font-size:clamp(44px,8vw,120px);line-height:.9;letter-spacing:-.07em;font-weight:800;margin-bottom:4vh}
.ov .sv{display:grid;grid-template-columns:repeat(2,1fr);gap:0 40px;max-width:900px}
.ov .sv div{padding:16px 0;border-top:1.5px solid rgba(255,255,255,.4)}.ov b{display:block;font-size:22px}.ov span{opacity:.8}
.ov a.m{font-size:clamp(22px,4vw,60px);font-weight:700;letter-spacing:-.04em;border-bottom:3px solid #fff;overflow-wrap:anywhere}
.ov .x{position:fixed;top:20px;right:4vw;font-size:34px;cursor:pointer;background:none;border:0;color:#fff}
@media(max-width:860px){.stage{grid-template-columns:1fr;padding:12vh 6vw 24vh}.phw{display:none}.ti{top:40%}.tk{width:38px;height:38px;margin:-19px 0 0 -19px}.thumb{width:56px;height:56px;margin:-28px 0 0 -28px}.ov .sv{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="bg"></div><div class="blob"></div>
<div class="nav"><b>ideaapps</b><span>Marcin Polak · iOS · tvOS · AI</span></div>
<div class="more"><button data-o="us">Usługi</button><button data-o="ko">Kontakt</button></div>
<main class="stage"><div class="txt" id="txt"></div><div class="phw" id="phw"></div></main>
<div class="rail"><div class="ct"><span id="cnt"></span><span>przeciągnij, przewiń kółkiem lub użyj strzałek ←  →</span></div><div class="track" id="track"><div class="line"></div><div class="fill" id="fill"></div><div class="thumb" id="thumb"></div></div></div>
<div class="ov" id="us"><button class="x" data-c="1">×</button><h2>Co zbuduję.</h2><div class="sv" id="sv"></div></div>
<div class="ov" id="ko"><button class="x" data-c="1">×</button><h2>Masz pomysł?</h2><p style="max-width:28em;margin-bottom:26px;font-size:20px;opacity:.9">Opisz w kilku zdaniach, co chcesz zbudować. Odpowiem i powiem szczerze, jak to widzę.</p><a class="m" id="mail" href="#"></a></div>
<script src="data.js"></script>
<script>
const {projects,services,email}=IDEA;
const $=s=>document.querySelector(s);
$('#mail').href='mailto:'+email;$('#mail').textContent=email;
$('#sv').innerHTML=services.map(s=>`<div><b>${s.t}</b><span>${s.d}</span></div>`).join('');
const N=projects.length;
$('#txt').innerHTML=projects.map((p,i)=>`<div class="ti" data-i="${i}"><small>${p.cat} · ${p.platforms}</small><h1>${p.name}</h1><p><b>${p.tag}.</b> ${p.desc}</p><a class="btn" href="${p.url}" target="_blank" rel="noopener">App Store ↗</a></div>`).join('');
$('#phw').innerHTML=projects.map((p,i)=>`<div class="ph" data-i="${i}">${p.shot&&p.id!=='boxes'?`<img src="${p.shot}" alt="">`:`<div class="fb" style="background:${p.color}">${p.name[0]}</div>`}</div>`).join('');
const track=$('#track'),thumb=$('#thumb'),fill=$('#fill');
$('#track').insertAdjacentHTML('beforeend',projects.map((p,i)=>`<div class="tk" data-i="${i}">${IDEA.iconHTML(p,'')}</div>`).join(''));
const ticks=[...document.querySelectorAll('.tk')];
let t=0,target=0,drag=false;
const xOf=v=>28+(track.clientWidth-56)*v/(N-1);
function layout(){ticks.forEach((e,i)=>e.style.left=xOf(i)+'px')}layout();addEventListener('resize',layout);
const mixC=(a,b,k)=>`color-mix(in srgb,${a} ${Math.round((1-k)*100)}%,${b})`;
const dark=c=>`color-mix(in srgb,${c} 70%,#0b0b10)`;
let lastI=-1;
function render(){
 const i0=Math.max(0,Math.min(N-2,Math.floor(t))),k=Math.max(0,Math.min(1,t-i0));
 const c0=dark(projects[i0].color),c1=dark(projects[Math.min(N-1,i0+1)].color);
 const base=`color-mix(in srgb,${c0} ${Math.round((1-k)*100)}%,${c1})`;
 $('#bg').style.background=`radial-gradient(80% 90% at 72% 40%,color-mix(in srgb,${base} 100%,#fff 14%),${base} 55%,color-mix(in srgb,${base} 60%,#000))`;
 const near=Math.round(t);
 if(near!==lastI){lastI=near;document.querySelectorAll('.ti').forEach(e=>e.classList.toggle('on',+e.dataset.i===near));
  thumb.innerHTML=IDEA.iconHTML(projects[near],'');$('#cnt').textContent=`${String(near+1).padStart(2,'0')} / ${String(N).padStart(2,'0')} · ${projects[near].name}`}
 document.querySelectorAll('.ph').forEach(e=>{const i=+e.dataset.i,d=i-t,a=Math.abs(d);e.style.opacity=Math.max(0,1-a*1.25);e.style.transform=`translateX(${d*90}px) rotate(${d*-7-2}deg) scale(${1-Math.min(1,a)*.12})`;e.style.zIndex=10-Math.round(a*3)});
 thumb.style.left=xOf(t)+'px';fill.style.width=(xOf(t)-28)+'px'}
(function loop(){t+=(target-t)*(drag?.5:.12);if(Math.abs(target-t)<.0005)t=target;render();requestAnimationFrame(loop)})();
const setFromX=x=>{const r=track.getBoundingClientRect();const v=(x-r.left-28)/(r.width-56)*(N-1);target=Math.max(0,Math.min(N-1,v))};
track.addEventListener('pointerdown',e=>{drag=true;track.setPointerCapture(e.pointerId);setFromX(e.clientX)});
track.addEventListener('pointermove',e=>{if(drag)setFromX(e.clientX)});
const end=()=>{if(!drag)return;drag=false;target=Math.round(target)};
track.addEventListener('pointerup',end);track.addEventListener('pointercancel',end);
addEventListener('wheel',e=>{if($('#us').classList.contains('on')||$('#ko').classList.contains('on'))return;target=Math.max(0,Math.min(N-1,target+(e.deltaY+e.deltaX)*.004));clearTimeout(window._s);window._s=setTimeout(()=>target=Math.round(target),160)},{passive:true});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')target=Math.min(N-1,Math.round(target)+1);if(e.key==='ArrowLeft')target=Math.max(0,Math.round(target)-1);if(e.key==='Escape')document.querySelectorAll('.ov').forEach(o=>o.classList.remove('on'))});
document.querySelector('.more').onclick=e=>{const b=e.target.closest('button');if(b)$('#'+b.dataset.o).classList.add('on')};
document.querySelectorAll('.ov').forEach(o=>o.onclick=e=>{if(e.target.dataset.c)o.classList.remove('on')});
</script>
</body>
</html>
