<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Płótno (wariant 15)</title>
<style>
:root{--bg:#ececec;--dot:#c4c4c4;--ink:#1e1e1e;--blue:#0d99ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font:15px/1.45 Inter,-apple-system,"SF Pro Text",Helvetica,sans-serif;color:var(--ink);background:var(--bg);background-image:radial-gradient(var(--dot) 1.3px,transparent 1.6px);background-size:24px 24px;cursor:grab;-webkit-font-smoothing:antialiased;touch-action:none}
body.drag{cursor:grabbing}
#cv{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#cv.anim{transition:transform .9s cubic-bezier(.65,0,.2,1)}
.it{position:absolute}
.fr{position:absolute}
.lb{position:absolute;top:-24px;left:0;font-size:13px;color:#777;white-space:nowrap}
.fr .box{background:#fff;border-radius:6px;box-shadow:0 0 0 1px rgba(0,0,0,.08),0 14px 40px -12px rgba(0,0,0,.2);overflow:hidden;width:100%;height:100%;transition:box-shadow .2s}
.fr:hover .box{box-shadow:0 0 0 2px var(--blue),0 20px 50px -12px rgba(0,0,0,.25)}
.fr:hover .lb{color:var(--blue)}
.title{font-size:92px;line-height:.95;letter-spacing:-.05em;font-weight:800;width:900px}
.title span{background:#ffe36e;padding:0 .1em}
.note{background:#fff3a3;padding:22px 24px;width:280px;box-shadow:0 12px 24px -10px rgba(0,0,0,.3);font-size:18px;line-height:1.35;font-family:"Bradley Hand","Marker Felt",cursive}
.note.p{background:#ffc6e0}.note.g{background:#c2f0c2}.note.b{background:#bfe0ff}
.p-app{display:grid;grid-template-columns:1fr;height:100%}
.p-app .sc{background:var(--c);height:300px;display:grid;place-items:center;overflow:hidden}
.p-app .sc img.s{width:46%;border-radius:20px 20px 0 0;align-self:end;margin-top:30px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.p-app .sc .ico,.p-app .sc .ico-fallback{width:110px;height:110px;border-radius:26px;object-fit:cover;display:grid;place-items:center;font-weight:800;font-size:54px;color:#fff;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.p-app .tx{padding:18px 22px 22px}
.p-app h3{font-size:26px;letter-spacing:-.03em}
.p-app .tg{color:#888;margin-bottom:8px}
.p-app a{color:var(--blue);font-weight:600}
.sv{padding:20px 22px}.sv h4{font-size:20px;letter-spacing:-.02em;margin-bottom:6px}.sv p{color:#555}
.ct{background:var(--ink);color:#fff;padding:36px;display:flex;flex-direction:column;justify-content:center;height:100%}
.ct h2{font-size:40px;letter-spacing:-.04em;line-height:1;margin-bottom:12px}
.ct a{color:#ffe36e;font-size:22px;font-weight:600}
.arrow{position:absolute;pointer-events:none;overflow:visible}
#tb{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#2c2c2c;color:#fff;border-radius:14px;padding:6px;display:flex;gap:2px;box-shadow:0 14px 40px rgba(0,0,0,.35);z-index:10;cursor:default}
#tb button{all:unset;cursor:pointer;padding:9px 16px;border-radius:9px;font-size:14px;font-weight:500}
#tb button:hover{background:#444}#tb button.on{background:var(--blue)}
#hud{position:fixed;top:18px;left:20px;font-weight:700;z-index:10;display:flex;gap:10px;align-items:center;cursor:default}
#hud i{width:20px;height:20px;border-radius:6px;background:var(--ink);display:block}
#hint{position:fixed;top:20px;right:22px;font-size:13px;color:#777;z-index:10;cursor:default}
</style>
</head>
<body>
<div id="hud"><i></i>ideaapps</div><div id="hint">przeciągaj · kółko = przesuwanie · ctrl + kółko = zoom</div>
<div id="cv"></div>
<div id="tb"></div>
<script src="data.js"></script>
<script>
const {projects,services,email}=IDEA;
const cv=document.getElementById('cv');
const cols=['#fff3a3','#ffc6e0','#c2f0c2','#bfe0ff'];
let h='';
h+=`<div class="it title" style="left:0;top:0">Aplikacje dla <span>Apple</span>, robię je sam.</div>`;
h+=`<div class="it note" style="left:20px;top:300px;transform:rotate(-2deg)">Marcin Polak. iOS, tvOS i AI. Ponad 10 lat. Wcześniej Android.</div>`;
h+=`<div class="it note g" style="left:360px;top:330px;transform:rotate(2deg)">Przeciągnij płótno, żeby zobaczyć moje aplikacje →</div>`;
// projects in a loose grid
const pos=[[1100,-60],[1600,40],[2100,-40],[2600,60],[1100,620],[1600,720],[2100,640],[2600,740]];
projects.forEach((p,i)=>{const [x,y]=pos[i];
 h+=`<a class="fr" href="${p.url}" target="_blank" rel="noopener" style="left:${x}px;top:${y}px;width:420px;height:${p.shot&&p.id!=='boxes'?560:520}px;--c:${p.color}"><div class="lb">${p.name} / ${p.cat}</div><div class="box p-app"><div class="sc">${p.shot&&p.id!=='boxes'?`<img class="s" src="${p.shot}" alt="">`:IDEA.iconHTML(p,'ico')}</div><div class="tx"><h3>${p.name}</h3><div class="tg">${p.tag}</div><p>${p.desc}</p><br><a>Otwórz w App Store →</a></div></div></a>`});
h+=`<div class="it note b" style="left:1100px;top:-250px;transform:rotate(-1deg)">Osiem aplikacji w App Store. Każdą zrobiłem sam.</div>`;
// services
services.forEach((s,i)=>{h+=`<div class="fr" style="left:${3300+(i%2)*400}px;top:${i<2?0:300}px;width:360px;height:240px"><div class="lb">Usługa ${i+1}</div><div class="box sv"><h4>${s.t}</h4><p>${s.d}</p></div></div>`});
h+=`<div class="it note p" style="left:3300px;top:-200px;transform:rotate(1.5deg)">Co mogę dla Ciebie zrobić</div>`;
h+=`<div class="fr" style="left:3300px;top:700px;width:760px;height:340px"><div class="lb">Kontakt</div><div class="box ct"><h2>Masz pomysł?<br>Zróbmy z niego apkę.</h2><a href="mailto:${email}">${email}</a></div></div>`;
cv.innerHTML=h;
const spots={start:[0,0,.9],proj:[1050,-100,.55],usl:[3250,-220,.8],kont:[3250,520,.8]};
let s=.9,tx=120,ty=120;
const apply=()=>cv.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;
const goto=(k)=>{const [x,y,z]=spots[k];s=z;
 const w=innerWidth,hh=innerHeight;
 tx=k==='start'?w*.08:w*.06-x*z;ty=k==='start'?hh*.14:hh*.2-y*z;cv.classList.add('anim');apply();setTimeout(()=>cv.classList.remove('anim'),950);
 document.querySelectorAll('#tb button').forEach(b=>b.classList.toggle('on',b.dataset.k===k))};
document.getElementById('tb').innerHTML=[['start','Start'],['proj','Aplikacje'],['usl','Usługi'],['kont','Kontakt']].map(([k,n])=>`<button data-k="${k}">${n}</button>`).join('');
document.getElementById('tb').onclick=e=>{const b=e.target.closest('button');if(b)goto(b.dataset.k)};
let d=null,moved=0;
addEventListener('pointerdown',e=>{if(e.target.closest('#tb'))return;d={x:e.clientX-tx,y:e.clientY-ty,sx:e.clientX,sy:e.clientY};moved=0;document.body.classList.add('drag')});
addEventListener('pointermove',e=>{if(!d)return;moved=Math.max(moved,Math.abs(e.clientX-d.sx)+Math.abs(e.clientY-d.sy));tx=e.clientX-d.x;ty=e.clientY-d.y;apply()});
addEventListener('pointerup',()=>{d=null;document.body.classList.remove('drag')});
addEventListener('click',e=>{if(moved>6){e.preventDefault();e.stopPropagation()}},true);
addEventListener('wheel',e=>{e.preventDefault();if(e.ctrlKey||e.metaKey){const f=Math.exp(-e.deltaY*.01),ns=Math.min(1.6,Math.max(.2,s*f));tx=e.clientX-(e.clientX-tx)*(ns/s);ty=e.clientY-(e.clientY-ty)*(ns/s);s=ns}else{tx-=e.deltaX;ty-=e.deltaY}apply()},{passive:false});
goto('start');
</script>
</body>
</html>
