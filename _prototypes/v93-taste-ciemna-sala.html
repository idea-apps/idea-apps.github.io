<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Ciemna sala</title>
<link rel="preconnect" href="https://api.fontshare.com"><link href="https://api.fontshare.com/v2/css?f[]=boska@400,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0d14;--surface:#131824;--ink:#e9edf3;--muted:#8891a1;--accent:#5a9bfc;--m:clamp(20px,3vw,48px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 18px/1.5 Boska,Georgia,"Times New Roman",serif;letter-spacing:.005em;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
.nav{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;justify-content:space-between;padding:var(--m);font-size:16px;mix-blend-mode:normal;pointer-events:none}
.nav>*{pointer-events:auto}
.nav nav{display:flex;gap:26px}
.nav a.b{color:var(--bg);background:var(--accent);padding:6px 16px}
.hero{min-height:100svh;display:grid;place-items:center;text-align:center;padding:12vh var(--m) 6vh}
.hero h1{font-weight:400;font-size:clamp(40px,6vw,96px);letter-spacing:-.02em;line-height:.95;max-width:16ch;margin:0 auto;text-wrap:balance}
.hero h1 i{font-style:italic}
.hero .ex{width:auto;height:min(46svh,520px);display:block;margin:5vh auto 3vh;object-fit:cover;aspect-ratio:9/19.5}
.hero p{max-width:38ch;color:var(--ink);font-size:19px;margin:0 auto}
.diag{padding:20vh var(--m) 10vh;display:grid;gap:18vh}
.diag .it{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--m);align-items:center}
.diag .it figure{grid-column:var(--c);}
.diag .it figure img{display:block;width:100%;aspect-ratio:var(--ar);object-fit:cover;object-position:top;filter:brightness(.82)}
.diag .it .tx{grid-column:var(--t);max-width:34ch}
.diag h2{font-weight:400;font-size:clamp(34px,4vw,60px);letter-spacing:-.02em;line-height:1;margin-bottom:.5em}
.diag p{color:var(--ink);font-size:19px}
.diag .it:nth-child(odd) figure{--c:2/6}.diag .it:nth-child(odd) .tx{--t:8/12}.diag .it:nth-child(even) figure{--c:8/12}.diag .it:nth-child(even) .tx{--t:2/6;order:-1}
.head{padding:10vh var(--m) 0}
.head h2{font-weight:400;font-size:clamp(34px,4.6vw,72px);letter-spacing:-.02em;line-height:1}
.ex-row{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--m);padding:10vh var(--m) 14vh;align-items:start}
.ex-row a{text-decoration:none;display:block;grid-column:span 3;margin-top:var(--mt,0)}
.ex-row img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;object-position:top;filter:brightness(.78);transition:filter .5s}
.ex-row a:hover img,.ex-row a:focus-visible img{filter:brightness(1.05)}
.ex-row span{display:block;margin-top:12px;font-size:17px}.ex-row em{color:var(--muted);font-style:normal;font-size:15px;display:block}
.faq{display:grid;grid-template-columns:5fr 7fr;gap:var(--m);padding:10vh var(--m) 14vh;align-items:start}
.faq .ph{position:sticky;top:12vh}
.faq .ph img{display:block;width:70%;aspect-ratio:3/4;object-fit:cover;object-position:top;filter:brightness(.8)}
.faq .r{margin-bottom:9vh;max-width:52ch}
.faq h3{font-weight:400;font-size:clamp(26px,2.6vw,40px);letter-spacing:-.015em;line-height:1.1;margin-bottom:.4em}
.faq p{color:var(--ink)}
.cta{display:flex;justify-content:space-between;align-items:center;padding:20vh var(--m);gap:30px}
.cta span{font-size:clamp(34px,6vw,96px);letter-spacing:-.02em;line-height:1}
.cta a{font-size:clamp(34px,6vw,96px);color:var(--accent);text-decoration:none;letter-spacing:-.02em;line-height:1}
.cta a:hover{color:var(--ink)}
footer{padding:0 var(--m) var(--m);color:var(--muted);font-size:15px;text-align:center}
@media(max-width:820px){.diag .it,.faq{grid-template-columns:1fr;display:block}.diag .it figure{margin-bottom:20px;width:70%}.ex-row a{grid-column:span 6}.faq .ph{display:none}.cta{flex-direction:column;align-items:flex-start}}
</style></head><body>
<div class="nav"><a href="#">ideaapps</a><nav><a href="#proces">Proces</a><a href="#przyklady">Przykłady</a><a class="b" id="mail" href="#">Napisz</a></nav></div>
<header class="hero"><div><h1>Od pomysłu do aplikacji w App Store</h1><img class="ex" id="hi" alt="Zrzut ekranu aplikacji Kierbud" width="300" height="650"><p>Natywne aplikacje na iOS, iPadOS i macOS. Prototypy i kod powstają z AI, a każdą zmianę sprawdza developer.</p></div></header>
<section class="diag" id="proces"></section>
<section class="head" id="przyklady"><h2>Aplikacje, które już są w sklepie</h2></section>
<section class="ex-row" id="ex"></section>
<section class="faq" id="faq"><div class="ph"><img id="fi" alt="Zrzut ekranu aplikacji Kajet"></div><div id="fq"></div></section>
<section class="cta"><span>Masz pomysł?</span><a id="m2" href="#">Napisz</a></section>
<footer>© 2026 ideaapps</footer>
<script src="data.js"></script><script src="flow.js"></script><script src="t.js"></script>
<script>
const {flow,projects,T}=IDEA,$=s=>document.querySelector(s);
$('#mail').href=$('#m2').href=T.mail('');
const ps=T.withShot();$('#hi').src=ps[0].shot;$('#fi').src=ps.find(p=>p.id==='kajet').shot;
const shots=['kierbud','mounda','kajet','stanlokalu','boxes'].map(id=>projects.find(p=>p.id===id));
$('#proces').innerHTML=flow.map((f,i)=>{const p=shots[i%shots.length];const ar=i%3===0?'4/5':i%3===1?'1/1':'3/4';return `<div class="it"><figure><img src="${p.shot}" style="--ar:${ar}" alt="Zrzut ekranu aplikacji ${p.name}" loading="lazy"></figure><div class="tx"><h2>${f.t}</h2><p>${f.d}</p></div></div>`}).join('');
$('#ex').innerHTML=ps.map((p,i)=>`<a href="${p.url}" target="_blank" rel="noopener" style="--mt:${[0,8,3,11,6][i%5]}vh"><img src="${p.shot}" alt="Zrzut ekranu aplikacji ${p.name}" loading="lazy"><span>${p.name}</span><em>${p.tag}</em></a>`).join('');
$('#fq').innerHTML='<h2 style="font-weight:400;font-size:clamp(34px,4.6vw,72px);letter-spacing:-.02em;margin-bottom:8vh">Pytania</h2>'+T.faq.map(([q,a])=>`<div class="r"><h3>${q}</h3><p>${a}</p></div>`).join('');
</script></body></html>
