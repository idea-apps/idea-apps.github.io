<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Wybierz rolę (wariant 61)</title>
<style>
:root{--bg:#f4f1ea;--ink:#16161a;--soft:#6a6a72;--a:#e8561a;--ln:#ddd8cb}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:18px/1.55 -apple-system,"SF Pro Text",Helvetica,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh;transition:background .6s}
a{color:inherit}
.w{max-width:1160px;margin:0 auto;padding:0 28px}
.nav{display:flex;justify-content:space-between;padding:22px 0;font-weight:700}
.nav span{font-weight:500;color:var(--soft);font-size:15px}
.q{padding:40px 0 22px}
.q small{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--a)}
.q h1{font-size:clamp(38px,6.4vw,92px);line-height:.95;letter-spacing:-.055em;font-weight:800;margin:10px 0 0;max-width:12em}
.roles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:30px 0 14px}
.role{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;background:#fff;border:2px solid var(--ln);border-radius:20px;padding:22px 22px 24px;transition:.25s;min-height:190px}
.role:hover{transform:translateY(-4px);border-color:var(--ink)}
.role .e{font-size:34px}
.role b{font-size:21px;letter-spacing:-.025em;line-height:1.1}
.role span{font-size:15px;color:var(--soft);line-height:1.4}
.role.on{background:var(--ink);color:#fff;border-color:var(--ink)}.role.on span{color:#c9c9d0}
.view{padding:36px 0 20px;animation:fi .5s}
@keyframes fi{from{opacity:0;transform:translateY(14px)}}
.view .lead{display:grid;grid-template-columns:1.1fr 1fr;gap:40px;align-items:start;margin-bottom:46px}
.view h2{font-size:clamp(32px,4.6vw,60px);line-height:1;letter-spacing:-.05em;font-weight:800}
.view .lead p{font-size:20px;color:#34343b}
.view h3.s{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--soft);margin:38px 0 14px}
.pts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pt{background:#fff;border:1.5px solid var(--ln);border-radius:18px;padding:22px}
.pt .n{font-size:40px;font-weight:800;letter-spacing:-.06em;line-height:.9;color:var(--a)}
.pt b{display:block;font-size:19px;margin:8px 0 4px;letter-spacing:-.02em}.pt span{font-size:15.5px;color:#46464e}
.ex{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.card{background:#fff;border:1.5px solid var(--ln);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;transition:.25s}
.card:hover{box-shadow:0 20px 40px -24px rgba(0,0,0,.4)}
.card .h{background:var(--c);color:#fff;padding:18px 20px;display:flex;gap:14px;align-items:center}
.card .h .ico,.card .h .ico-fallback{width:56px;height:56px;border-radius:23%;object-fit:cover;display:grid;place-items:center;font:800 26px sans-serif;color:#fff;flex:none;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.card .h b{font-size:22px;letter-spacing:-.03em;display:block;line-height:1.05}.card .h span{font-size:13px;opacity:.9}
.card .b{padding:16px 20px 20px;flex:1;display:flex;flex-direction:column;gap:8px}
.card .why{font-size:15.5px;font-weight:700;color:var(--ink)}
.card ul{margin:0;padding-left:18px;color:#46464e;font-size:15px}
.card a.go{margin-top:auto;font-weight:800;color:var(--c);filter:brightness(.8);font-size:15px;text-decoration:none}
.r-tag,.r-ds,.r-who,.r-ft,.r-shots,.r-meta,.r-cta{display:none}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.steps div{background:var(--ink);color:#fff;border-radius:16px;padding:18px 20px}
.steps b{display:block;font-size:17px;margin-bottom:4px}.steps span{font-size:14.5px;opacity:.85}
.steps small{display:block;font-size:12px;color:#ffcf3a;font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.note{background:#fff3d6;border:1.5px solid #f0d58a;border-radius:16px;padding:16px 20px;font-size:16px;color:#4a3a10;margin-top:14px}
.cta{margin:50px 0 30px;background:var(--ink);color:#fff;border-radius:26px;padding:48px 40px;display:flex;gap:30px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.cta h2{font-size:clamp(28px,4vw,50px);letter-spacing:-.05em;line-height:1;font-weight:800;max-width:14em}
.cta p{color:#c9c9d0;margin-top:8px;max-width:30em}
.cta a{background:#ffcf3a;color:#16161a;font-weight:800;padding:16px 28px;border-radius:99px;text-decoration:none;font-size:18px}
.proc{margin-top:10px}
footer{text-align:center;color:var(--soft);padding:10px 0 40px;font-size:14px}
@media(max-width:960px){.roles{grid-template-columns:1fr 1fr}.view .lead{grid-template-columns:1fr}.pts,.steps{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="w">
<div class="nav"><b>ideaapps</b><span>Marcin Polak · iOS · tvOS · AI</span></div>
<header class="q"><small>Zacznij od siebie</small><h1>Z czym do mnie przychodzisz?</h1></header>
<div class="roles" id="roles"></div>
<div class="view" id="view"></div>
<div class="cta"><div><h2>Opowiedz mi o swojej sytuacji.</h2><p>Wystarczy kilka zdań. Odpowiem i powiem szczerze, jak to widzę.</p></div><a id="mail" href="#">Napisz do mnie</a></div>
<footer>© 2026 ideaapps · 10+ lat iOS i tvOS · 8 własnych aplikacji w App Store</footer>
</div>
<script src="data.js"></script><script src="render.js"></script>
<script>
const {projects,services,process,email,R}=IDEA;
const $=s=>document.querySelector(s);
const P=id=>projects.find(p=>p.id===id);
const deep=c=>`color-mix(in srgb,${c} 85%,#15151a)`;
const roles=[
 {k:'idea',e:'💡',t:'Mam pomysł na aplikację',s:'Chcę ją zbudować od zera i wypuścić do App Store.',bg:'#f4f1ea',
  h:'Zamienię pomysł w działającą aplikację.',l:'Zaczynamy od rozmowy i jednostronicowego zakresu, potem w kilka dni dostajesz prototyp na własnym iPhonie. Dopiero gdy wiesz, że to działa, budujemy pełną wersję i publikujemy.',
  pts:[['1','Zakres w jednej stronie','Ustalamy, co naprawdę musi być w pierwszej wersji, a co może poczekać.'],['2','Prototyp zamiast makiet','Działająca aplikacja do wzięcia do ręki, nie PDF ze slajdami.'],['3','Publikacja pod klucz','Opis, zrzuty ekranu, prywatność i recenzja Apple załatwiam sam.']],
  ex:[['boxes','Pomysł z codziennego życia zamieniony w aplikację z kodami QR.'],['kwity','Prosty problem (zgubione gwarancje) i prosta, szybka aplikacja.'],['obiadki','Wąska nisza, ale dokładnie rozwiązana.']],
  steps:[0,1,2,4],note:'Nie wiesz jeszcze, czy pomysł ma sens? To normalne. Pierwsza rozmowa służy właśnie temu.'},
 {k:'fix',e:'🛠',t:'Mam aplikację do poprawy',s:'Istnieje, ale wymaga porządków, nowych funkcji albo przepisania.',bg:'#eef1f4',
  h:'Zobaczę, co jest w środku, i powiem szczerze, co z tym zrobić.',l:'Zaczynam od przeglądu kodu: architektura, wydajność, dług techniczny, zgodność z nowymi wersjami iOS. Dostajesz uczciwą ocenę: poprawiać, przepisać fragment czy zostawić.',
  pts:[['1','Audyt','Przegląd kodu i listy rzeczy, które realnie bolą, w kolejności ważności.'],['2','Plan','Co poprawiamy najpierw i ile to kosztuje, zanim cokolwiek ruszę.'],['3','Zmiany w małych krokach','Nowe wersje przez TestFlight, bez ryzykownej „wielkiej przebudowy”.']],
  ex:[['kajet','Rozbudowana aplikacja: plan, oceny, widżet, Siri, 13 języków.'],['kierbud','Złożona logika: zdjęcia, pinezki, raporty PDF i praca offline.'],['stanlokalu','Podpisy, zdjęcia i PDF w jednym przepływie.']],
  steps:[0,2,3,5],note:'Kod pisał ktoś inny? Pracuję także na cudzym kodzie i nie oceniam poprzedników, tylko mówię, co działa.'},
 {k:'tv',e:'📺',t:'Potrzebuję aplikacji na Apple TV',s:'Streaming, treści lub narzędzie na duży ekran.',bg:'#efeff6',
  h:'tvOS to osobny świat. Znam go z produkcji.',l:'Od lat buduję na iOS i tvOS, także w komercyjnych projektach. Wiem, czym różni się nawigacja pilotem i fokusem, odtwarzacze, wydajność na dużym ekranie i wymogi Apple dla tvOS.',
  pts:[['1','Nawigacja fokusem','Interfejs, który działa pilotem, a nie myszą ani palcem.'],['2','Odtwarzanie i treści','Doświadczenie ze streamingiem i dużymi bibliotekami treści.'],['3','Wspólny kod z iOS','Tam, gdzie się opłaca, współdzielę logikę między iPhone’em a Apple TV.']],
  ex:[['kajet','Aplikacja z bogatą logiką, którą da się rozszerzać na kolejne platformy Apple.'],['boxes','iPhone, iPad i Mac: przykład wieloplatformowego podejścia.']],
  steps:[0,1,2,4],note:'Uczciwie: moje własne aplikacje w sklepie są na iPhone’a, iPada i Maca. Doświadczenie z tvOS pochodzi z projektów komercyjnych.'},
 {k:'ai',e:'✨',t:'Chcę dodać AI do produktu',s:'Funkcja, która ma sens dla użytkownika, a nie tylko dla marketingu.',bg:'#f1eef6',
  h:'AI tam, gdzie pomaga, a nie tam, gdzie się dobrze sprzedaje.',l:IDEA.ai.d,
  pts:[['1','Dobór modelu','Na urządzeniu (prywatnie, offline) albo w chmurze, zależnie od potrzeby i kosztów.'],['2','Realna funkcja','Rozpoznawanie ze zdjęcia lub głosu, podsumowania, asystent, mądrzejsze wyszukiwanie.'],['3','Kontrola jakości','Testy na prawdziwych danych, zanim funkcja trafi do użytkowników.']],
  ex:[['boxes','Dodawanie rzeczy głosem lub zdjęciem, dyktowanie na urządzeniu.'],['mounda','Wynik (objętość) liczony na podstawie zdjęcia.'],['kwity','Zdjęcie paragonu zamienia się w przypomnienie.']],
  steps:[0,1,3,4],note:'Sam na co dzień pracuję z agentami kodującymi, więc wiem, gdzie AI daje przewagę, a gdzie wymaga nadzoru.'}];
$('#roles').innerHTML=roles.map(r=>`<button class="role" data-k="${r.k}"><span class="e">${r.e}</span><b>${r.t}</b><span>${r.s}</span></button>`).join('');
function show(k){const r=roles.find(x=>x.k===k);document.body.style.background=r.bg;
 document.querySelectorAll('.role').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
 $('#view').innerHTML=`<div class="lead"><h2>${r.h}</h2><p>${r.l}</p></div>
 <h3 class="s">Jak Ci pomogę</h3><div class="pts">${r.pts.map(p=>`<div class="pt"><span class="n">${p[0]}</span><b>${p[1]}</b><span>${p[2]}</span></div>`).join('')}</div>
 <h3 class="s">Przykłady z moich aplikacji</h3><div class="ex">${r.ex.map(([id,why])=>{const p=P(id);return `<div class="card" style="--c:${deep(p.color)}"><div class="h">${IDEA.iconHTML(p,'')}<div><b>${p.name}</b><span>${p.cat} · ${p.platforms.split(' · ')[0]}</span></div></div><div class="b"><div class="why">${why}</div><ul>${p.feats.slice(0,3).map(f=>`<li>${f}</li>`).join('')}</ul><a class="go" href="${p.url}" target="_blank" rel="noopener">Zobacz w App Store ↗</a></div></div>`}).join('')}</div>
 <h3 class="s">Jak będziemy pracować</h3><div class="steps">${r.steps.map((i,n)=>`<div><small>Etap ${n+1}</small><b>${process[i].t}</b><span>${process[i].d}</span></div>`).join('')}</div>
 <div class="note">${r.note}</div>`;
 $('#mail').href=`mailto:${email}?subject=${encodeURIComponent(r.t)}`;
 history.replaceState(null,'','#'+k)}
$('#roles').addEventListener('click',e=>{const b=e.target.closest('.role');if(b)show(b.dataset.k)});
show((location.hash||'#idea').slice(1)&&roles.find(r=>r.k===location.hash.slice(1))?location.hash.slice(1):'idea');
</script>
</body>
</html>
