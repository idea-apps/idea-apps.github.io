<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Słoik (wariant 53)</title>
<style>
:root{--c:#e8dcc4}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:18px/1.5 -apple-system,"SF Pro Text",Helvetica,sans-serif;color:#2a2418;-webkit-font-smoothing:antialiased;user-select:none;touch-action:none;
 background:radial-gradient(70% 80% at 50% 40%,color-mix(in srgb,var(--c) 60%,#fff),var(--c) 70%);transition:background .9s}
.top{position:fixed;left:4vw;top:22px;z-index:5;pointer-events:none}
.top b{font-size:20px}.top span{display:block;font-size:14px;opacity:.7}
.hook{position:fixed;left:4vw;top:90px;z-index:5;max-width:min(380px,30vw);pointer-events:none}
.hook h1{font-size:clamp(32px,4.8vw,72px);line-height:.9;letter-spacing:-.06em;font-weight:800}
.hook p{margin-top:12px;font-size:16px;opacity:.8}
.stage{position:fixed;inset:0;display:grid;place-items:center;padding-bottom:60px}
.jar{position:relative;width:min(560px,86vw,calc((100vh - 150px)*.9));aspect-ratio:.92;transition:transform .25s}
.lidj{position:absolute;left:12%;right:12%;top:-6%;height:9%;border-radius:12px 12px 4px 4px;background:linear-gradient(#f0b429,#c98900);box-shadow:inset 0 3px 0 rgba(255,255,255,.5),0 6px 14px rgba(0,0,0,.3);z-index:4}
.lidj::after{content:"ideaapps";position:absolute;inset:0;display:grid;place-items:center;font:800 clamp(10px,1.5vw,16px) sans-serif;letter-spacing:.3em;text-transform:uppercase;color:#6a4a00}
.glass{position:absolute;inset:0;border-radius:6% 6% 16% 16%/4% 4% 12% 12%;background:linear-gradient(100deg,rgba(255,255,255,.55),rgba(255,255,255,.1) 30%,rgba(255,255,255,.05) 70%,rgba(255,255,255,.35));border:3px solid rgba(255,255,255,.7);box-shadow:inset 0 0 40px rgba(255,255,255,.4),0 30px 60px -20px rgba(0,0,0,.4);overflow:hidden;z-index:2;backdrop-filter:blur(1px)}
.glass::after{content:"";position:absolute;left:6%;top:6%;width:7%;bottom:12%;border-radius:20px;background:linear-gradient(rgba(255,255,255,.7),rgba(255,255,255,.05));pointer-events:none}
#in{position:absolute;inset:3px;z-index:3;touch-action:none}
.nd{position:absolute;left:0;top:0;border-radius:23%;overflow:hidden;display:grid;place-items:center;font:800 30px sans-serif;color:#fff;cursor:grab;will-change:transform;box-shadow:0 8px 18px rgba(0,0,0,.4);touch-action:none;transition:filter .3s,box-shadow .3s}
.nd img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.nd.sel{box-shadow:0 0 0 4px #fff,0 0 40px 8px rgba(255,255,255,.6)}
.mb{position:absolute;left:0;top:0;border-radius:50%;box-shadow:inset -4px -5px 8px rgba(0,0,0,.25),inset 3px 3px 6px rgba(255,255,255,.5),0 3px 6px rgba(0,0,0,.25)}
.lab{position:absolute;left:50%;bottom:-5%;transform:translateX(-50%);z-index:5;background:#fff;color:#2a2418;font-weight:800;padding:6px 22px;border-radius:6px;box-shadow:0 6px 14px rgba(0,0,0,.25);letter-spacing:.04em;font-size:14px;white-space:nowrap}
.tip{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);font-size:14px;opacity:.75;z-index:5;white-space:nowrap;pointer-events:none}
@media(max-width:860px){.hook{display:none}.tip{white-space:normal;text-align:center;width:90vw;bottom:92px}}
</style>
</head>
<body>
<div class="top"><b>ideaapps</b><span>Marcin Polak · iOS · tvOS · AI</span></div>
<div class="hook"><h1>Potrząśnij słoikiem.</h1><p>Poruszaj kursorem (albo przechylaj telefon), a aplikacje przesypują się w stronę „dołu”. Wyłów jedną.</p></div>
<div class="stage"><div class="jar" id="jar"><div class="lidj"></div><div class="glass"></div><div id="in"></div><div class="lab">8 aplikacji w słoiku</div></div></div>
<div class="tip">kursor lub przechył telefonu zmienia kierunek grawitacji · przeciągnij ikonę · kliknij, żeby otworzyć</div>
<script src="data.js"></script><script src="phys.js"></script><script src="ui.js"></script>
<script>
const {projects}=IDEA;
const jar=document.getElementById('jar'),inn=document.getElementById('in');
const R=()=>Math.max(30,Math.min(56,inn.clientWidth/8.2));
let sel=null;
const ph=Phys(inn,{mode:'vec',gx:0,gy:.5,rest:.45,fric:.99,onTap:b=>b.p&&pick(b)});
const cols=['#ff6b6b','#ffd93d','#6bcb77','#4d96ff','#c77dff','#ff9f43'];
projects.forEach((p,i)=>{const r=R();const el=document.createElement('div');el.className='nd';el.style.cssText=`width:${r*2}px;height:${r*2}px;background:${p.color}`;
 el.innerHTML=p.icon?`<img src="${p.icon}" alt="">`:p.name[0];inn.appendChild(el);ph.add({el,p,r,x:inn.clientWidth*(.2+Math.random()*.6),y:-r*2*(i+1)})});
for(let i=0;i<14;i++){const r=9+Math.random()*10;const el=document.createElement('div');el.className='mb';el.style.cssText=`width:${r*2}px;height:${r*2}px;background:${cols[i%cols.length]}`;inn.appendChild(el);ph.add({el,r,x:inn.clientWidth*(.15+Math.random()*.7),y:-r*2-Math.random()*300,nodrag:false})}
addEventListener('resize',()=>{ph.resize();const r=R();ph.B.forEach(b=>{if(b.p){b.r=r;b.el.style.width=b.el.style.height=r*2+'px'}})});
// gravity from pointer relative to jar centre / device tilt
let gx=0,gy=.5,tilt=0;
function setG(dx,dy){const d=Math.hypot(dx,dy)||1;const a=Math.min(1,d/260);gx=dx/d*.62*a;gy=dy/d*.62*a+.18*(1-a);if(!isFinite(gx)){gx=0;gy=.5}}
addEventListener('pointermove',e=>{if(e.target.closest('.nd'))return;const r=jar.getBoundingClientRect();setG(e.clientX-(r.left+r.width/2),e.clientY-(r.top+r.height/2))});
addEventListener('deviceorientation',e=>{if(e.gamma==null)return;const g=Math.max(-60,Math.min(60,e.gamma))/60,b=Math.max(-60,Math.min(60,e.beta-40))/60;gx=g*.7;gy=Math.max(.05,.45+b*.5)});
(function loop(){ph.o.gx=gx;ph.o.gy=gy;jar.style.transform=`rotate(${Math.max(-7,Math.min(7,gx*-14))}deg)`;requestAnimationFrame(loop)})();
// shake: extra impulse when pointer moves fast
let lx=0,ly=0;addEventListener('pointermove',e=>{const v=Math.hypot(e.clientX-lx,e.clientY-ly);lx=e.clientX;ly=e.clientY;if(v>70)ph.B.forEach(b=>{if(!b.drag){b.vx+=(Math.random()-.5)*5;b.vy-=Math.random()*5}})});
function pick(b){sel=b;ph.B.forEach(x=>x.el.classList.toggle('sel',x===b));document.body.style.setProperty('--c',`color-mix(in srgb,${b.p.color} 55%,#e8dcc4)`);
 IDEA.ui.app(b.p,{onOpen:q=>{document.body.style.setProperty('--c',`color-mix(in srgb,${q.color} 55%,#e8dcc4)`);ph.B.forEach(x=>x.el.classList.toggle('sel',x.p&&x.p.id===q.id))},onClose:()=>{ph.B.forEach(x=>x.el.classList.remove('sel'));document.body.style.setProperty('--c','#e8dcc4')}})}
IDEA.ui.bar();
</script>
</body>
</html>
