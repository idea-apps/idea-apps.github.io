<p class="sub">Łącznie <span id="tot"></span> wariantów w 12 rundach. Podglądy na żywo ładują się dla kafelków widocznych na ekranie. Kliknięcie otwiera pełny prototyp. Najnowsze rundy są na górze.</p>

<script>
const R=[{"name": "Runda 1 — pierwsze 5 wariantów", "n": 1, "items": [{"f": "v1-midnight.html", "t": "1 · Midnight", "d": "Ciemny, gradienty, bento grid. Technologiczny look."}, {"f": "v2-editorial.html", "t": "2 · Editorial", "d": "Jasny, typograficzny, lista projektów z podglądem na hover."}, {"f": "v3-showcase.html", "t": "3 · Showcase", "d": "W stylu apple.com: duże kafle z telefonami, auto dark mode."}, {"f": "v4-terminal.html", "t": "4 · Terminal", "d": "Mono, zieleń na czerni, animowany terminal. Akcent na AI."}, {"f": "v5-pop.html", "t": "5 · Pop", "d": "Neo-brutalizm: grube obrysy, żywe kolory, marquee."}]}, {"name": "Runda 2 — mniej \"wygenerowane\"", "n": 2, "items": [{"f": "v6-zine.html", "t": "6 · Zine", "d": "Kserowany fanzin: papier, taśma, halftone, krzywo przyklejone kartki."}, {"f": "v7-catalogue.html", "t": "7 · Katalog", "d": "Szwajcarska siatka, tabela projektów z filtrem, podgląd screena przy najechaniu."}, {"f": "v8-blueprint.html", "t": "8 · Rysunek techniczny", "d": "Niebieska kalka, wymiary, tabliczka rysunkowa. Precyzja jako marka."}, {"f": "v9-retromac.html", "t": "9 · Pulpit", "d": "Klasyczny Mac: aplikacje jako ikony na pulpicie, przeciągalne okna."}, {"f": "v10-list.html", "t": "10 · List", "d": "Osobisty list zamiast strony firmowej. Prawie bez designu, bardzo ludzkie."}]}, {"name": "Runda 3 — 10 różnych pomysłów na interakcję", "n": 3, "items": [{"f": "v11-phone.html", "t": "11 · Telefon", "d": "Przyklejony iPhone, który zmienia ekran, gdy przewijasz tekst. Tło przyjmuje kolor aplikacji."}, {"f": "v12-cinema.html", "t": "12 · Kino", "d": "Pełnoekranowe sceny, przewijane poziomo (strzałki, kółko, swipe). Jedna aplikacja na slajd."}, {"f": "v13-today.html", "t": "13 · Dzisiaj", "d": "Karty jak w zakładce Dzisiaj w App Store, rozwijane płynnie na pełny ekran."}, {"f": "v14-chat.html", "t": "14 · Rozmowa", "d": "Strona jako czat. Klient wybiera pytania, odpowiedzi i projekty wskakują jako bąbelki."}, {"f": "v15-canvas.html", "t": "15 · Płótno", "d": "Nieskończona tablica jak Figma: przeciągasz, zoomujesz, skaczesz paskiem narzędzi."}, {"f": "v16-xcode.html", "t": "16 · Xcode", "d": "Projekty to pliki .swift w nawigatorze, z podglądem urządzenia po prawej."}, {"f": "v17-cork.html", "t": "17 · Tablica", "d": "Korkowa tablica: polaroidy, karteczki, wizytówka, pinezki."}, {"f": "v18-zdanie.html", "t": "18 · Jedno zdanie", "d": "Cała strona to zdanie. Nazwy aplikacji w tekście podświetlają się i pokazują kartę."}, {"f": "v19-tvos.html", "t": "19 · tvOS", "d": "Ekran główny Apple TV: strzałki, fokus z paralaksą, rozmyte tło w kolorze aplikacji."}, {"f": "v20-gazeta.html", "t": "20 · Gazeta", "d": "Pierwsza strona dziennika: łamy, zdjęcia w szarościach, ogłoszenia drobne jako usługi."}]}, {"name": "Runda 4 — nowoczesne", "n": 4, "items": [{"f": "v21-glass.html", "t": "21 · Glass", "d": "Szklane panele z rozmyciem na żywym tle, pływający pasek nawigacji. Styl iOS 26."}, {"f": "v22-command.html", "t": "22 · Command", "d": "Ciemny, ostry, z paletą poleceń na ⌘K i światłem podążającym za kursorem."}, {"f": "v23-stack.html", "t": "23 · Stos", "d": "Ogromna typografia i karty, które układają się w stos podczas przewijania."}, {"f": "v24-carousel.html", "t": "24 · Karuzela 3D", "d": "Telefony na obracanym pierścieniu, przeciągane myszą, tło zmienia kolor."}, {"f": "v25-split.html", "t": "25 · Split", "d": "Stały czarny panel z limonkowym akcentem po lewej, przewijane projekty z paralaksą po prawej."}]}, {"name": "Runda 5 — unikalne pomysły", "n": 5, "items": [{"f": "v26-homescreen.html", "t": "26 · Ekran główny", "d": "Strona to ekran iPhone’a: aplikacje jako ikony, dotknięcie otwiera je z animacją jak w iOS."}, {"f": "v27-island.html", "t": "27 · Wyspa", "d": "Dynamic Island jako nawigacja: pokazuje aktualną aplikację podczas przewijania, po dotknięciu rozwija menu."}, {"f": "v28-pipeline.html", "t": "28 · Pipeline", "d": "Panel CI: uruchom build i zobacz etapy od pomysłu do App Store plus log na żywo. Historia buildów to portfolio."}, {"f": "v29-brief.html", "t": "29 · Brief", "d": "Konfigurator: klient klika platformy i funkcje, szkic aplikacji rośnie, a brief wysyła mailem jednym kliknięciem."}, {"f": "v30-metro.html", "t": "30 · Metro", "d": "Mapa linii: iPhone, iPad, Mac, tvOS. Aplikacje to stacje, usługi to bilety."}, {"f": "v31-receipt.html", "t": "31 · Paragon", "d": "Strona jako paragon drukowany linia po linii, ze stemplem. Ukłon w stronę aplikacji Kwity."}, {"f": "v32-stories.html", "t": "32 · Stories", "d": "Pionowe stories z paskiem postępu: klik dalej, przytrzymaj pauza. Pomysł pod mobile."}, {"f": "v33-gravity.html", "t": "33 · Grawitacja", "d": "Ikony spadają i zderzają się w hero. Możesz je łapać, rzucać i klikać."}, {"f": "v34-book.html", "t": "34 · Książka", "d": "Portfolio jako książka z przewracanymi stronami 3D, spisem treści i okładką."}, {"f": "v35-playground.html", "t": "35 · Playground", "d": "Edytowalny kod SwiftUI po lewej, na żywo zmieniający aplikację po prawej. Pokazuje, jak pracuję."}]}, {"name": "Runda 6 — kolory i interakcje fizyczne", "n": 6, "items": [{"f": "v36-magnes.html", "t": "36 · Magnes", "d": "Fizyka jak w 33, ale z trybami: grawitacja, magnes przyciągający do kursora, nieważkość. Klik w ikonę zmienia kolor całej strony."}, {"f": "v37-katapulta.html", "t": "37 · Katapulta", "d": "Naciągasz procę, wystrzeliwujesz żółtą kulę „pomysł” w stos aplikacji. Trafiona aplikacja nadaje stronie kolor."}, {"f": "v38-dock.html", "t": "38 · Dock", "d": "Dock jak w macOS z powiększaniem ikon pod kursorem. Najechanie zmienia kolor sceny i telefon."}, {"f": "v39-latarka.html", "t": "39 · Latarka", "d": "Ciemna strona, którą odkrywasz światłem podążającym za kursorem. Światło przyjmuje kolor aplikacji."}, {"f": "v40-orbita.html", "t": "40 · Orbita", "d": "Układ słoneczny: aplikacje krążą wokół „ideaapps”. Najechanie spowalnia, klik zmienia kolor tła."}, {"f": "v41-farby.html", "t": "41 · Farby", "d": "Paski kolorów aplikacji. Klik zalewa całą stronę nowym kolorem okrągłą falą z miejsca kliknięcia."}, {"f": "v42-losowanie.html", "t": "42 · Losowanie", "d": "Maszyna losująca z dźwignią, którą przeciągasz. Wylosowana aplikacja zmienia kolor strony."}, {"f": "v43-suwak.html", "t": "43 · Suwak", "d": "Przeciągasz suwak po ikonach, a kolory i ekrany telefonu płynnie mieszają się między aplikacjami."}, {"f": "v44-karty.html", "t": "44 · Karty", "d": "Aplikacje jako karty w ręce. Przeciągasz kartę na stół, a stół zmienia kolor."}, {"f": "v45-tasma.html", "t": "45 · Taśma", "d": "Filmowa taśma z bezwładnością: przeciągasz, puszczasz, zatrzymuje się na kadrze. Tło płynnie zmienia kolor."}]}, {"name": "Runda 7 — żywe strony z czytelną kartą aplikacji", "n": 7, "items": [{"f": "v46-galaktyka.html", "t": "46 · Galaktyka", "d": "Rozwinięcie układu słonecznego: planety krążą, kamera przylatuje do wybranej, a po boku pełna, czytelna karta. Złap kometę."}, {"f": "v47-lawica.html", "t": "47 · Ławica", "d": "Ikony pływają jak ryby. Kursor je płoszy, kliknięcie w tło rzuca jedzenie, kliknięcie ikony ją łapie."}, {"f": "v48-plinko.html", "t": "48 · Plinko", "d": "Puszczasz kulki, odbijają się od aplikacji, a lądując w przegródce otwierają Jak pracuję, Usługi lub Kontakt."}, {"f": "v49-balony.html", "t": "49 · Balony", "d": "Aplikacje to balony unoszące się w niebo. Dmuchasz kursorem i przebijasz, żeby zobaczyć kartę."}, {"f": "v50-memory.html", "t": "50 · Memory", "d": "Gra w pary. Za każdą parę otwiera się karta aplikacji, a po komplecie niespodzianka."}, {"f": "v51-sprezyny.html", "t": "51 · Sprężyny", "d": "Sieć ikon na elastycznych sprężynach. Szarpiesz jedną, reszta drży i idzie za nią."}, {"f": "v52-naklejki.html", "t": "52 · Naklejki", "d": "Laptop oklejony aplikacjami: przeciągasz, kręcisz kółkiem, nakładasz."}, {"f": "v53-sloik.html", "t": "53 · Słoik", "d": "Aplikacje w szklanym słoiku. Kierunek grawitacji zależy od kursora lub przechylenia telefonu."}, {"f": "v54-tarcza.html", "t": "54 · Tarcza", "d": "Tarcza telefoniczna: wykręcasz otwór z aplikacją do ogranicznika i tarcza „wybiera numer”."}, {"f": "v55-fabryka.html", "t": "55 · Fabryka", "d": "Taśma i sześć maszyn pokazują, jak pracuję. Wrzucasz pomysł, a z drugiej strony wypada gotowa aplikacja."}]}, {"name": "Runda 8 — struktura i nawigacja", "n": 8, "items": [{"f": "v56-podrecznik.html", "t": "56 · Podręcznik", "d": "Strona jako instrukcja obsługi: spis treści z numerami stron, rozdziały, kolor akcentu zmienia się z aplikacją. Czyta się jak dobrą dokumentację."}, {"f": "v57-pierwiastki.html", "t": "57 · Układ okresowy", "d": "Cała oferta w tabeli pierwiastków: aplikacje, usługi, etapy pracy. Filtr grup, nawigacja strzałkami, karta właściwości obok."}, {"f": "v58-poczta.html", "t": "58 · Poczta", "d": "Strona jako klient poczty: skrzynki, lista wiadomości i panel czytania. Każda aplikacja to „mail”, Odpowiedz prowadzi do kontaktu."}, {"f": "v59-arkusz.html", "t": "59 · Arkusz", "d": "Portfolio jako arkusz kalkulacyjny: zakładki, pasek formuły, zaznaczanie komórek i podsumowania z formułami."}, {"f": "v60-macierz.html", "t": "60 · Macierz", "d": "Tabela „co potrafię”: aplikacje w wierszach, funkcje w kolumnach. Każda kropka to dowód z prawdziwej aplikacji, kolumny sortują."}, {"f": "v61-rola.html", "t": "61 · Wybierz rolę", "d": "Odwiedzający wskazuje swoją sytuację (pomysł, poprawki, Apple TV, AI) i dostaje stronę napisaną pod siebie."}, {"f": "v62-prezentacja.html", "t": "62 · Prezentacja", "d": "Strona jako prezentacja w stylu Keynote: miniatury slajdów, nawigacja strzałkami, tryb pełnoekranowy."}, {"f": "v63-mapa.html", "t": "63 · Mapa myśli", "d": "Radialna mapa: rozwijasz gałęzie (Aplikacje, Jak pracuję, Usługi, Kontakt) i czytasz opis w panelu obok."}, {"f": "v64-kartoteka.html", "t": "64 · Kartoteka", "d": "Szuflady z zakładkami i kartami, z których wysuwa się jedna. Wszystko wygląda jak fizyczna kartoteka."}, {"f": "v65-finder.html", "t": "65 · Finder", "d": "Widok kolumnowy jak w macOS: zagłębiasz się w foldery, podgląd po prawej, spacja otwiera Quick Look."}]}, {"name": "Runda 9 — nowoczesne, proste, z animowanym tłem", "n": 9, "items": [{"f": "v66-aurora.html", "t": "66 · Aurora", "d": "Lista aplikacji wielkim drukiem, telefon obok, a tło to żywa aurora, która płynnie przelewa się w kolory wybranej aplikacji. Sama przełącza co kilka sekund."}, {"f": "v67-blob.html", "t": "67 · Blob", "d": "Pulsujący, zmieniający kształt blob w kolorze aplikacji za telefonem, obrysowana nazwa wielkim drukiem i pigułki z ikonami."}, {"f": "v68-wipe.html", "t": "68 · Wipe", "d": "Kolor zalewa ekran okrągłą falą z miejsca kliknięcia, nazwa wjeżdża litera po literze, telefon podąża za kursorem."}, {"f": "v69-scroll.html", "t": "69 · Scroll", "d": "Przewijasz stronę, a tło płynnie miesza kolory sąsiednich aplikacji, telefony zamieniają się w locie. Na końcu Jak pracuję i kontakt."}, {"f": "v70-czastki.html", "t": "70 · Cząstki", "d": "Każda aplikacja ma własne animowane tło: klocki, pył, trójkąty, kreski, ramki, fale, konfetti i bąbelki."}, {"f": "v71-napisy.html", "t": "71 · Napisy", "d": "Za szklaną kartą suną wielkie napisy z nazwą aplikacji, a przy zmianie wymieniają się i zmienia się tło."}, {"f": "v72-panele.html", "t": "72 · Panele", "d": "Podzielony ekran: tekst wyjeżdża w górę, kolorowy panel z telefonem w dół. Kółko myszy przewija aplikacje."}, {"f": "v73-stos.html", "t": "73 · Stos kart", "d": "Karty aplikacji do przeciągania i odrzucania na boki, a aurora w tle zmienia kolor na barwę wierzchniej karty."}, {"f": "v74-lot.html", "t": "74 · Lot ikony", "d": "Klikasz ikonę w siatce, a ona leci do nagłówka, podczas gdy kolor zalewa tło. Prosto i bardzo czytelnie."}, {"f": "v75-warstwy.html", "t": "75 · Warstwy", "d": "Karta z głębią: tło, napisy, telefon i ikona w różnych płaszczyznach, które reagują na ruch myszy."}]}, {"name": "Runda 10 — koncepty: jak pracuję, cykl, AI i start w kosmos", "n": 10, "items": [{"f": "v76-rakieta.html", "t": "76 · Rakieta", "d": "Przewijasz, a rakieta startuje przez 7 etapów pracy aż na orbitę, gdzie czekają Twoje aplikacje jako satelity. Niebo ciemnieje w kosmos."}, {"f": "v77-kontrola.html", "t": "77 · Centrum kontroli", "d": "Panel misji: lista startowa, zegar T+, załoga (Ty, Marcin, Agent AI). „Odpal misję” przechodzi przez etapy."}, {"f": "v78-petla.html", "t": "78 · Pętla", "d": "Koło iteracji: wymagania, prototyp, budowa, opinie. Punkt krąży i liczy obroty. Z pętli wychodzi się do premiery."}, {"f": "v79-szkic.html", "t": "79 · Szkic do sklepu", "d": "Suwak zamienia szkic w prototyp, a ten w gotową aplikację na prawdziwym ekranie wybranej apki. Tło zmienia kolor."}, {"f": "v80-sesja.html", "t": "80 · Sesja z agentem", "d": "Odtwarzana sesja czatu: polecenie, plan, kod, błąd w testach, poprawka, TestFlight. Pokazuje kodowanie z agentami."}, {"f": "v81-tory.html", "t": "81 · Trzy tory", "d": "Diagram torów: co robisz Ty, co ja, co agent AI na każdym etapie, plus efekt. Czytelne rozdzielenie ról."}, {"f": "v82-harmonogram.html", "t": "82 · Harmonogram", "d": "Przykładowy plan tydzień po tygodniu: suwak przesuwa kursor po wykresie, a telefon dojrzewa od szkicu do App Store."}, {"f": "v83-plan-lotu.html", "t": "83 · Plan lotu", "d": "Poziomy lot po planetach-etapach z paralaksą gwiazd. Na końcu orbita z aplikacjami."}, {"f": "v84-schemat.html", "t": "84 · Schemat", "d": "Jeden rysunek całego procesu ze strzałkami, pętlami opinii i płynącymi pakietami. Węzły są klikalne."}, {"f": "v85-pytania.html", "t": "85 · Pytania", "d": "Lista pytań o AI, jakość, prawa do kodu, czas i prywatność. Odpowiedź wymienia się, tło zmienia kolor."}]}, {"name": "Runda 11 — jasne, redakcyjne, bezosobowe (iOS/iPadOS/macOS)", "n": 11, "items": [{"f": "v86-magazyn.html", "t": "86 · Magazyn", "d": "Jasny, redakcyjny. Duży szeryfowy nagłówek, rozdziały 01–07 jak w magazynie, kolor akcentu zmienia się z etapem, lista przykładów z podglądem przy najechaniu."}, {"f": "v87-slowa.html", "t": "87 · Słowa", "d": "Jedno wielkie słowo na etap (Wymagania const out=document.getElementById('out'),bar=document.getElementById('bar');
let filter='all',q='';
const total=R.reduce((a,r)=>a+r.items.length,0);document.getElementById('tot').textContent=total;
const rs=[...R].sort((a,b)=>b.n-a.n);
bar.innerHTML='<button data-r="all" class="on">Wszystkie</button>'+rs.map(r=>`<button data-r="${r.n}">Runda ${r.n}</button>`).join('')+'<input id="q" placeholder="Szukaj (np. kolor, telefon, gra)…"><span class="n" id="cnt"></span>';
function draw(){let shown=0;
 out.innerHTML=rs.filter(r=>filter==='all'||String(r.n)===filter).map(r=>{
  const items=r.items.filter(c=>!q||(c.t+' '+c.d).toLowerCase().includes(q));if(!items.length)return'';shown+=items.length;
  return `<h2>${r.name.replace(/^Runda \d+ — /,'Runda '+r.n+' · ')}<small>${items.length} wariantów</small>${r.n===12?'<span class="new">NAJNOWSZA</span>':''}</h2><div class="g">${items.map(c=>{const num=(c.f.match(/v(\d+)/)||[0,'?'])[1];return `<a class="c" href="${c.f}" data-f="${c.f}"><div class="fr" style="--h:${(num*37)%360}"><span class="no">${num}</span><span class="hint">podgląd</span></div><div class="t"><b>${c.t}</b><span>${c.d}</span></div></a>`}).join('')}</div>`}).join('');
 document.getElementById('cnt').textContent=shown+' z '+total}
draw();
bar.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.r;bar.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));draw()});
bar.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value.toLowerCase();draw()}});
// podgląd na żywo dla kafelków widocznych na ekranie (max 9 naraz, reszta czeka)
const MAX=location.search.includes('np')?0:9,live=new Set(),queue=[];
function load(c){const fr=c.querySelector('.fr');if(fr.querySelector('iframe'))return;
 const f=document.createElement('iframe');f.src=c.dataset.f;f.setAttribute('tabindex','-1');f.setAttribute('sandbox','allow-scripts');
 f.style.transform=`scale(${fr.clientWidth/1280})`;fr.appendChild(f);live.add(c);
 f.onload=()=>setTimeout(()=>{f.classList.add('on');c.querySelector('.hint').textContent='podgląd na żywo'},500)}
function unload(c){const f=c.querySelector('iframe');if(f)f.remove();live.delete(c);const h=c.querySelector('.hint');if(h)h.textContent='podgląd'}
function pump(){while(live.size<MAX&&queue.length){const c=queue.shift();if(c.isConnected&&c._vis)load(c)}}
const io=new IntersectionObserver(es=>{es.forEach(e=>{const c=e.target;c._vis=e.isIntersecting;
 if(e.isIntersecting){if(!live.has(c)&&!queue.includes(c))queue.push(c)}else{const i=queue.indexOf(c);if(i>-1)queue.splice(i,1);unload(c)}});pump()},{rootMargin:'-5% 0px -5% 0px',threshold:.5});
function observe(){io.disconnect();live.clear();queue.length=0;out.querySelectorAll('.c').forEach(c=>io.observe(c))}
const _draw=draw;draw=function(){_draw();observe()};
observe();
</script></body></html>
