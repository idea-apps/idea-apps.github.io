<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Od szkicu do sklepu (koncept 79)</title>
<link rel="stylesheet" href="c.css">
<style>
body{min-height:100vh;overflow-x:hidden}
.fxw{position:relative;z-index:5;min-height:100vh;padding:90px 5vw 60px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5vw;align-items:center;max-width:1320px;margin:0 auto}
h1{font-size:clamp(38px,6vw,90px);line-height:.9;letter-spacing:-.06em;font-weight:900;margin:8px 0 14px}
.lead{font-size:19px;opacity:.9;max-width:28em;margin-bottom:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chips button{all:unset;cursor:pointer;display:flex;gap:8px;align-items:center;padding:6px 14px 6px 6px;border-radius:99px;border:1.5px solid rgba(255,255,255,.35);font-weight:700;font-size:14.5px;transition:.25s}
.chips button.on{background:#fff;color:#14141c}
.chips .ico,.chips .ico-fallback{width:28px;height:28px;border-radius:50%;object-fit:cover;display:grid;place-items:center;font:800 13px sans-serif;color:#fff}
.stg{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.26);border-radius:26px;padding:22px 24px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);max-width:640px;transition:.3s}
.stg h2{font-size:clamp(28px,3.4vw,46px);letter-spacing:-.05em;line-height:1;font-weight:900;margin:4px 0 8px}
.stg .d{font-size:16px;opacity:.92;margin-bottom:12px}
.stg .tag{opacity:1;color:#ffe08a}
.sl{margin-top:22px;max-width:640px}
.sl input{-webkit-appearance:none;appearance:none;width:100%;height:10px;border-radius:10px;background:rgba(255,255,255,.28);outline:0}
.sl input::-webkit-slider-thumb{-webkit-appearance:none;width:34px;height:34px;border-radius:50%;background:#fff;box-shadow:0 6px 18px rgba(0,0,0,.4);cursor:grab}
.sl input::-moz-range-thumb{width:34px;height:34px;border-radius:50%;background:#fff;border:0}
.marks{display:flex;justify-content:space-between;margin-top:12px;font-weight:800;font-size:15px}
.marks button{all:unset;cursor:pointer;opacity:.6;padding:4px 2px;transition:.25s}.marks button.on{opacity:1;text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.ph{position:relative;height:min(74vh,700px);aspect-ratio:9/19.5;border-radius:48px;background:#0a0a0e;box-shadow:0 0 0 9px #0a0a0e,0 0 0 11px rgba(255,255,255,.22),0 60px 100px -20px rgba(0,0,0,.65);overflow:hidden;rotate:-2deg}
.ph .l{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top}
#skA{filter:grayscale(1) contrast(1.9) brightness(1.55) sepia(.25);background:#f4efe3}
#skB{filter:grayscale(.7) contrast(1.1) saturate(.6)}
.ph .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(60,90,200,.15) 1px,transparent 1px),linear-gradient(90deg,rgba(60,90,200,.15) 1px,transparent 1px);background-size:24px 24px;mix-blend-mode:multiply}
.ph .lab{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:#fff;color:#14141c;font-weight:800;font-size:13px;padding:5px 14px;border-radius:99px;z-index:3;white-space:nowrap}
.fb{position:absolute;inset:0;display:grid;place-items:center;font:900 150px sans-serif;color:#fff}
@media(max-width:900px){.fxw{grid-template-columns:1fr}.ph{height:52vh;margin:0 auto}}
</style></head><body>
<div class="brand">ideaapps<small>Marcin Polak · iOS · tvOS · AI</small></div>
<main class="fxw"><div><span class="tag">Od szkicu do sklepu</span><h1>Ten sam ekran, trzy etapy.</h1><p class="lead">Przeciągnij suwak i zobacz, jak pomysł zamienia się w aplikację. Wybierz jedną z moich apek jako przykład.</p>
<div class="chips" id="chips"></div><div class="stg" id="stg"></div>
<div class="sl"><input id="rng" type="range" min="0" max="200" value="0"><div class="marks" id="marks"></div></div></div>
<div class="ph" id="ph"><img class="l" id="skA" alt=""><img class="l" id="skB" alt=""><img class="l" id="skC" alt=""><div class="grid" id="gr"></div><div class="lab" id="lab"></div></div></main>
<script src="data.js"></script><script src="flow.js"></script><script src="fx.js"></script><script src="ui.js"></script>
<script>
const {flow,projects}=IDEA,$=s=>document.querySelector(s);
const au=IDEA.fx.aurora();
const ex=projects.filter(p=>p.shot&&p.id!=='boxes').concat(projects.filter(p=>p.id==='boxes'));
const st=[{f:flow[0],lab:'Szkic: wymagania',t:'Szkic i wymagania'},{f:flow[1],lab:'Prototyp z AI',t:'Prototyp'},{f:flow[5],lab:'Aplikacja w App Store',t:'Gotowa aplikacja'}];
$('#chips').innerHTML=ex.map((p,i)=>`<button data-i="${i}">${IDEA.iconHTML(p,'')}${p.name}</button>`).join('');
$('#marks').innerHTML=st.map((s,i)=>`<button data-i="${i}">${s.t}</button>`).join('');
let app=ex[0];
function setApp(i){app=ex[i];au.set(app.color);document.querySelectorAll('.chips button').forEach((b,k)=>b.classList.toggle('on',k===i));['skA','skB','skC'].forEach(id=>$('#'+id).src=app.shot);render()}
let lastS=-1;
function render(){const v=$('#rng').value/100;
 $('#skA').style.opacity=Math.max(0,1-v);$('#skB').style.opacity=v<1?Math.min(1,v*1.4):Math.max(0,2-v);$('#skC').style.opacity=Math.max(0,v-1);$('#gr').style.opacity=Math.max(0,1-v)*.9;
 const s=v<.5?0:v<1.5?1:2;$('#lab').textContent=st[s].lab;
 document.querySelectorAll('.marks button').forEach((b,k)=>b.classList.toggle('on',k===s));
 if(s!==lastS){lastS=s;const f=st[s].f;$('#stg').innerHTML=`<span class="tag">Etap ${s===2?6:s+1} · ${f.time}</span><h2>${f.t}</h2><div class="d">${s===2?'Gotowa aplikacja z '+app.name+' jest dowodem na to, że cała droga działa: '+app.tag.toLowerCase()+'.':f.d}</div>${IDEA.trio(f)}`}}
$('#rng').oninput=render;
$('#chips').onclick=e=>{const b=e.target.closest('button');if(b)setApp(+b.dataset.i)};
$('#marks').onclick=e=>{const b=e.target.closest('button');if(!b)return;const to=+b.dataset.i*100,from=+$('#rng').value;const t0=performance.now();(function a(t){const k=Math.min(1,(t-t0)/700),e=1-Math.pow(1-k,3);$('#rng').value=from+(to-from)*e;render();if(k<1)requestAnimationFrame(a)})(t0)};
IDEA.ui.bar(null,'top');setApp(0);
</script></body></html>
