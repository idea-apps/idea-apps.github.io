<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Arkusz stykowy</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--surface:#f4f4f4;--ink:#111;--muted:#6b6b6b;--accent:#1a4be0;--g:20px;--c1:#ffe14d;--c2:#ff8a65;--c3:#8be0a6;--c4:#9ac4ff}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 17px/1.5 "Bricolage Grotesque",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
.sheet{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--g);padding:var(--g);height:100svh;overflow:hidden;position:relative}
.sheet .col{display:flex;flex-direction:column;gap:var(--g);margin-top:var(--o)}
.fr{position:relative;display:block;text-decoration:none;color:var(--ink)}
.fr img{display:block;width:100%;height:var(--h);object-fit:cover;object-position:var(--p,top)}
.fr .lb{display:block;background:var(--s);font-weight:500;font-size:13px;padding:5px 8px;height:28px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.panel{position:absolute;left:calc(var(--g) + (100% - 7*var(--g))/6*2 + var(--g)*2);top:22%;width:calc((100% - 7*var(--g))/6*2 + var(--g));height:480px;background:var(--ink);color:#fff;padding:24px;display:flex;flex-direction:column;justify-content:space-between;z-index:5}
.panel .wm{font-size:clamp(44px,5.4vw,84px);font-weight:600;letter-spacing:-.05em;line-height:.95}
.panel p{font-size:24px;line-height:1.2;max-width:22ch}
.panel .btn{align-self:flex-start;background:#fff;color:var(--ink);padding:11px 20px;text-decoration:none;font-weight:500;font-size:16px}
.panel .ln{display:flex;gap:16px;font-size:15px}
.panel .ln a{color:#fff}
.col-n{padding:16vh var(--g) 8vh;display:grid;grid-template-columns:15% minmax(0,1fr)}
.col-n .in{grid-column:2;max-width:560px}
.col-n h2{font-weight:600;font-size:clamp(28px,3vw,42px);letter-spacing:-.04em;line-height:1.05;margin-bottom:1.2em}
.col-n p+p{margin-top:1em;color:var(--ink)}
.stage{margin-bottom:1.6em;font-size:18px}
.stage b{font-weight:600}.stage span{color:var(--ink)}
.stage .row{display:flex;gap:var(--g);margin-top:12px;overflow-x:auto}
.stage .row img{height:96px;width:auto;display:block}
.whole{padding:var(--g)}
.whole h2{font-weight:600;font-size:clamp(28px,3vw,42px);letter-spacing:-.04em;padding:6vh var(--g) 4vh}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--g);height:70svh}
.tiles div{background-image:var(--img);background-size:400% auto;background-repeat:no-repeat;background-position:calc(var(--i)*100%/3) top;background-color:var(--surface)}
.tiles+.cap{padding:10px 0;font-size:15px;color:var(--muted)}
.faq{padding:12vh var(--g);display:grid;grid-template-columns:5fr 7fr;gap:var(--g)}
.faq h2{font-weight:600;font-size:clamp(32px,4vw,64px);letter-spacing:-.04em;line-height:1;margin-bottom:5vh}
.faq .q{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.faq .q button{all:unset;cursor:pointer;font-weight:500;font-size:clamp(20px,1.8vw,26px);letter-spacing:-.03em;line-height:1.15;color:var(--muted);padding:4px 0}
.faq .q button.on,.faq .q button:hover{color:var(--ink)}
.faq .a{font-size:clamp(22px,2vw,32px);letter-spacing:-.02em;line-height:1.3;font-weight:500;min-height:5em;background:var(--surface);padding:28px}
.cta{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--g);padding:0 var(--g)}
.cta img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;display:block}
.cta .f{grid-column:1/-1;background:var(--accent);color:#fff;padding:12vh 28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;text-decoration:none}
.cta .f span{font-size:clamp(34px,5vw,84px);letter-spacing:-.045em;line-height:1;font-weight:600;max-width:22ch}
.cta .f b{font-weight:500;font-size:clamp(20px,2.2vw,32px);text-decoration:underline}
footer{padding:var(--g);display:grid;grid-template-columns:repeat(4,1fr);gap:var(--g);margin-top:var(--g)}
footer div{background:var(--surface);padding:18px 14px;min-height:110px;display:flex;flex-direction:column;justify-content:space-between;font-size:15px}
footer div:first-child{background:var(--ink);color:#fff}
footer a{text-decoration:none;font-weight:500;font-size:19px}
@media(max-width:820px){:root{--g:24px}.sheet{grid-template-columns:repeat(2,1fr);height:auto;padding-top:calc(var(--g) + 440px)}.sheet .col:nth-child(n+3){display:none}.panel{left:var(--g);right:var(--g);width:auto;top:var(--g);height:420px}.col-n{grid-template-columns:1fr}.col-n .in{grid-column:1}.faq{grid-template-columns:1fr}.cta{grid-template-columns:1fr}footer{grid-template-columns:1fr 1fr}.tiles{height:50svh}}
</style></head><body>
<header class="sheet" id="sheet"><div class="panel"><h1 class="wm">ideaapps</h1><p>Natywne aplikacje Apple, od pierwszej rozmowy po App Store.</p><a class="btn" id="mail" href="#">Napisz</a><div class="ln"><a href="#proces">Proces</a><a href="#przyklady">Przykłady</a><a href="#faq">Pytania</a></div></div></header>
<section class="col-n" id="proces"><div class="in"><h2>Jak powstaje aplikacja</h2><div id="steps"></div></div></section>
<section class="whole" id="przyklady"><h2>Jeden ekran, cztery kadry</h2><div class="tiles" id="tiles"></div><div class="cap" id="cap"></div></section>
<section class="faq" id="faq"><div><h2>Pytania</h2><div class="q" id="q"></div></div><div class="a" id="a"></div></section>
<section class="cta" id="cta"></section>
<footer id="ft"></footer>
<script src="data.js"></script><script src="flow.js"></script><script src="t.js"></script>
<script>
const {flow,projects,T,email}=IDEA,$=s=>document.querySelector(s);
const P=id=>projects.find(p=>p.id===id);
$('#mail').href=T.mail('');
// arkusz: kadry to kolejne wycinki prawdziwych zrzutów
const srcs=['kierbud','mounda','kajet','stanlokalu','boxes'].map(P);const pos=['top','center 30%','center 62%','bottom'];
const strips=['var(--c1)','var(--c2)','var(--c3)','var(--c4)'];
const offs=[0,-90,-40,-130,-20,-70];let h='';
for(let c=0;c<6;c++){h+=`<div class="col" style="--o:${offs[c]}px">`;for(let r=0;r<5;r++){const p=srcs[(c*2+r)%srcs.length],ph=[190,130,230,150,200][(c+r)%5];h+=`<a class="fr" href="${p.url}" target="_blank" rel="noopener" style="--h:${ph}px;--p:${pos[(c+r)%4]};--s:${strips[(c+r)%4]}"><img src="${p.shot}" alt="Fragment zrzutu ekranu aplikacji ${p.name}" loading="lazy"><span class="lb">${p.name} · ${p.cat}</span></a>`}h+='</div>'}
$('#sheet').insertAdjacentHTML('afterbegin',h);
$('#steps').innerHTML=flow.map((f,i)=>`<div class="stage"><b>${T.moments[i]}</b> <span>${f.d}</span>${i===1||i===2?`<div class="row">${[0,1,2].map(k=>`<img src="${srcs[(i+k)%5].shot}" style="object-fit:cover;width:60px;object-position:${pos[k]}" alt="Fragment zrzutu ekranu">`).join('')}</div>`:''}</div>`).join('');
const big=P('kajet');
$('#tiles').innerHTML=[0,1,2,3].map(i=>`<div style="--i:${i};--img:url('${big.shot}')" role="img" aria-label="Fragment ${i+1} zrzutu ekranu aplikacji Kajet"></div>`).join('');
$('#cap').textContent='Kajet: '+big.tag+'. Jeden zrzut ekranu podzielony na cztery kadry.';
$('#q').innerHTML=T.faq.map(([q],i)=>`<button data-i="${i}">${q}</button>`).join('');
function fq(i){document.querySelectorAll('#q button').forEach((b,k)=>b.classList.toggle('on',k===i));$('#a').textContent=T.faq[i][1]}
$('#q').onclick=e=>{const b=e.target.closest('button');if(b)fq(+b.dataset.i)};fq(0);
$('#cta').innerHTML=['kierbud','mounda','stanlokalu'].map(id=>`<img src="${P(id).shot}" alt="Zrzut ekranu aplikacji ${P(id).name}" loading="lazy">`).join('')+`<a class="f" href="${T.mail('')}"><span>Opis pomysłu to dobry początek.</span><b>${email}</b></a>`;
$('#ft').innerHTML=`<div><span>ideaapps</span><span>© 2026</span></div><div><span>Proces</span><a href="#proces">Czytaj</a></div><div><span>Przykłady</span><a href="#przyklady">Zobacz</a></div><div><span>Kontakt</span><a href="mailto:${email}">${email}</a></div>`;
</script></body></html>
