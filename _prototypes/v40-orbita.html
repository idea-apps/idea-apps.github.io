<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Orbita (wariant 40)</title>
<style>
:root{--c:#3a4aa8}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:18px/1.5 -apple-system,"SF Pro Text",Helvetica,sans-serif;color:#fff;background:#07070c;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.bg{position:fixed;inset:0;background:radial-gradient(70% 70% at 62% 50%,color-mix(in srgb,var(--c) 70%,#07070c),#07070c 72%);transition:background .8s;z-index:0}
.stars{position:fixed;inset:0;z-index:0;background-image:radial-gradient(1px 1px at 20% 30%,#fff9,transparent),radial-gradient(1px 1px at 70% 20%,#fff8,transparent),radial-gradient(1.4px 1.4px at 40% 80%,#fffa,transparent),radial-gradient(1px 1px at 85% 70%,#fff8,transparent),radial-gradient(1px 1px at 10% 60%,#fff7,transparent),radial-gradient(1.2px 1.2px at 55% 10%,#fff9,transparent);background-size:340px 340px}
.nav{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:22px 4vw;z-index:20;font-weight:700}
.nav span{font-weight:500;opacity:.7;font-size:15px}
.panel{position:fixed;left:4vw;top:50%;transform:translateY(-50%);width:min(430px,38vw);z-index:10;transition:opacity .3s,transform .3s}
.panel.sw{opacity:0;transform:translateY(-46%)}
.panel small{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.panel h1{font-size:clamp(46px,7vw,110px);line-height:.88;letter-spacing:-.07em;font-weight:800;margin:10px 0 16px}
.panel p{font-size:clamp(16px,1.4vw,20px);opacity:.9;line-height:1.4;margin-bottom:18px}
.panel .m{font-size:14px;opacity:.75;margin-bottom:18px}
.btn{display:inline-block;background:#fff;color:#111;font-weight:700;padding:13px 24px;border-radius:99px}
.svl div{padding:10px 0;border-bottom:1px solid rgba(255,255,255,.2)}.svl b{display:block;font-size:17px}.svl span{font-size:14px;opacity:.82}
.sys{position:fixed;left:50%;top:50%;width:0;height:0;z-index:5}
.sun{position:absolute;width:110px;height:110px;margin:-55px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffd986 40%,#ff9f3d);box-shadow:0 0 90px 30px rgba(255,170,70,.55),0 0 200px 60px rgba(255,170,70,.25);display:grid;place-items:center;color:#4a2a00;font:800 15px sans-serif;letter-spacing:-.02em;text-align:center;line-height:1.05}
svg.orb{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.pl{position:fixed;left:0;top:0;z-index:6;cursor:pointer;will-change:transform}
.pl .in{width:var(--s);height:var(--s);margin:calc(var(--s)/-2);border-radius:23%;display:grid;place-items:center;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.6);transition:transform .25s,box-shadow .25s;font:800 24px sans-serif;color:#fff}
.pl .in img{width:100%;height:100%;object-fit:cover}
.pl:hover .in{transform:scale(1.25)}
.pl.sel .in{transform:scale(1.5);box-shadow:0 0 0 3px #fff,0 0 50px 8px rgba(255,255,255,.55)}
.pl .lb{position:absolute;left:0;top:calc(var(--s)/2 + 8px);transform:translateX(-50%);font-size:12.5px;font-weight:700;white-space:nowrap;text-shadow:0 1px 6px #000;opacity:.9}
.pl.txt .in{border-radius:99px;width:auto;height:30px;margin:-15px 0 0 -40px;padding:0 14px;background:rgba(255,255,255,.16);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.4);font:700 13px sans-serif;box-shadow:none}
.hint{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);font-size:14px;opacity:.65;z-index:10;white-space:nowrap}
@media(max-width:860px){.panel{width:92vw;left:4vw;top:auto;bottom:60px;transform:none}.panel.sw{transform:translateY(10px)}.panel h1{font-size:48px}.panel p{display:none}.sys{top:34%}}
</style>
</head>
<body>
<div class="bg" id="bg"></div><div class="stars"></div>
<div class="nav"><b>ideaapps</b><span>Marcin Polak · iOS · tvOS · AI</span></div>
<svg class="orb" id="orb"></svg>
<div class="sys"><div class="sun">idea<br>apps</div></div>
<div id="pls"></div>
<div class="panel" id="panel"></div>
<div class="hint">najedź, żeby spowolnić · kliknij planetę</div>
<script src="data.js"></script>
<script>
const {projects,services,email}=IDEA;
const $=s=>document.querySelector(s);
const deep=c=>`color-mix(in srgb,${c} 82%,#07070c)`;
const bodies=[...projects.map((p,i)=>({id:p.id,p,name:p.name})),{id:'uslugi',name:'Usługi',txt:true,color:'#8a93ff'},{id:'kontakt',name:'Kontakt',txt:true,color:'#ffd56b'}];
bodies.forEach((b,i)=>{b.ph=Math.random()*6.28;b.k=i});
$('#pls').innerHTML=bodies.map(b=>b.txt?`<div class="pl txt" data-id="${b.id}"><div class="in">${b.name}</div></div>`:`<div class="pl" data-id="${b.id}" style="--s:${54}px"><div class="in" style="background:${b.p.color}">${b.p.icon?`<img src="${b.p.icon}" alt="">`:b.p.name[0]}</div><span class="lb">${b.name}</span></div>`).join('');
const els=Object.fromEntries([...document.querySelectorAll('.pl')].map(e=>[e.dataset.id,e]));
let W,H,cx,cy,sc;
function lay(){W=innerWidth;H=innerHeight;const mob=W<860;cx=mob?W/2:W*.62;cy=mob?H*.34:H/2;sc=Math.min(mob?W*.46:W*.36,H*.46);
 const sys=document.querySelector('.sys');sys.style.left=cx+'px';sys.style.top=cy+'px';
 bodies.forEach((b,i)=>{b.R=sc*(.34+i*.075);b.sp=.12/Math.sqrt(b.R/sc+.2)*.9});
 $('#orb').innerHTML=bodies.map(b=>`<ellipse cx="${cx}" cy="${cy}" rx="${b.R}" ry="${b.R*.42}" fill="none" stroke="rgba(255,255,255,.13)" stroke-width="1"/>`).join('')}
addEventListener('resize',lay);lay();
let slow=1,tslow=1,sel=null;
let last=performance.now();
(function frame(t){const dt=(t-last)/1000;last=t;slow+=(tslow-slow)*.1;
 bodies.forEach(b=>{b.ph+=b.sp*dt*slow;const x=cx+Math.cos(b.ph)*b.R,y=cy+Math.sin(b.ph)*b.R*.42;const dep=(Math.sin(b.ph)+1)/2;const e=els[b.id];e.style.transform=`translate(${x}px,${y}px) scale(${.78+dep*.45})`;e.style.zIndex=Math.round(dep*10)+6});
 requestAnimationFrame(frame)})(last);
$('#pls').addEventListener('pointerover',e=>{if(e.target.closest('.pl'))tslow=.04});
$('#pls').addEventListener('pointerout',e=>{if(e.target.closest('.pl'))tslow=1});
const views={};
projects.forEach(p=>views[p.id]={c:p.color,h:`<small>${p.cat}</small><h1>${p.name}</h1><p><b>${p.tag}.</b> ${p.desc}</p><div class="m">${p.platforms}</div><a class="btn" href="${p.url}" target="_blank" rel="noopener">Zobacz w App Store ↗</a>`});
views.uslugi={c:'#4651c9',h:`<small>Usługi</small><h1>Co zbuduję.</h1><div class="svl">${services.map(s=>`<div><b>${s.t}</b><span>${s.d}</span></div>`).join('')}</div>`};
views.kontakt={c:'#c98a14',h:`<small>Kontakt</small><h1>Masz pomysł?</h1><p>Opisz w kilku zdaniach, co chcesz zbudować. Odpowiem i powiem szczerze, jak to widzę.</p><a class="btn" href="mailto:${email}">${email}</a>`};
views.home={c:'#3a4aa8',h:`<small>Cześć, jestem Marcin</small><h1>Mój układ aplikacji.</h1><p>Ponad 10 lat iOS i tvOS i osiem aplikacji, które krążą wokół jednej idei: dobrze zrobione, natywne aplikacje Apple. Kliknij planetę.</p>`};
function show(id){if(sel===id)return;sel=id;const v=views[id];const pn=$('#panel');pn.classList.add('sw');$('#bg').style.setProperty('--c',v.c);document.documentElement.style.setProperty('--c',deep(v.c));
 document.querySelectorAll('.pl').forEach(e=>e.classList.toggle('sel',e.dataset.id===id));
 setTimeout(()=>{pn.innerHTML=v.h;pn.classList.remove('sw')},200)}
$('#bg').style.background='';
document.getElementById('pls').addEventListener('click',e=>{const p=e.target.closest('.pl');if(p)show(p.dataset.id)});
addEventListener('keydown',e=>{if(e.key==='Escape'){sel=null;show('home')}});
$('#panel').innerHTML=views.home.h;
(function(){const bg=$('#bg');bg.style.cssText='';})();
</script>
</body>
</html>
