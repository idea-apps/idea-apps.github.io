<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Plan lotu (koncept 83)</title>
<link rel="stylesheet" href="c.css">
<style>
html,body{height:100%;overflow:hidden}
body{background:#05060f}
.sp{position:fixed;inset:0;z-index:0;background:radial-gradient(70% 70% at 70% 30%,var(--g,#1b2a6b),#05060f 70%);transition:background 1s}
.st1,.st2{position:fixed;inset:0;z-index:1;pointer-events:none;background-image:radial-gradient(1.4px 1.4px at 12% 20%,#fff,transparent),radial-gradient(1px 1px at 70% 12%,#fff,transparent),radial-gradient(1.6px 1.6px at 40% 62%,#fff,transparent),radial-gradient(1px 1px at 88% 48%,#fff,transparent),radial-gradient(1.2px 1.2px at 24% 84%,#fff,transparent),radial-gradient(1px 1px at 58% 36%,#fff,transparent);background-size:420px 420px}
.st2{background-size:260px 260px;opacity:.55}
.track{position:fixed;left:6vw;right:6vw;top:82px;z-index:20;height:46px}
.track::before{content:"";position:absolute;left:0;right:0;top:22px;height:2px;background:rgba(255,255,255,.3)}
.track .fill{position:absolute;left:0;top:21px;height:4px;border-radius:4px;background:linear-gradient(90deg,#f5a524,#8a7bff,#34d17a)}
.track button{all:unset;cursor:pointer;position:absolute;top:10px;width:26px;height:26px;margin-left:-13px;border-radius:50%;border:2px solid #fff;background:#0b0d24;display:grid;place-items:center;font:800 11px "SF Mono",monospace;transition:.3s}
.track button.on{background:var(--c);transform:scale(1.35);box-shadow:0 0 18px var(--c);color:#10142a}
.track button span{position:absolute;top:32px;font:700 12px -apple-system;white-space:nowrap;opacity:.7}
.track button.on span{opacity:1}
.rk{position:absolute;top:-6px;font-size:28px;margin-left:-14px;transition:left .5s;transform:rotate(90deg)}
#h{position:fixed;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;z-index:5}
#h::-webkit-scrollbar{display:none}
.sc{flex:none;width:100vw;height:100%;scroll-snap-align:start;display:flex;align-items:center;padding:140px 7vw 60px;position:relative}
.pl{position:absolute;right:6vw;top:50%;width:min(44vw,520px);aspect-ratio:1;transform:translateY(-44%);border-radius:50%;background:radial-gradient(circle at 32% 28%,color-mix(in srgb,var(--c) 70%,#fff),var(--c) 55%,color-mix(in srgb,var(--c) 40%,#000));box-shadow:0 0 120px 20px color-mix(in srgb,var(--c) 45%,transparent);transition:transform .9s}
.pl::after{content:attr(data-n);position:absolute;inset:0;display:grid;place-items:center;font:900 clamp(120px,22vw,300px)/1 -apple-system;letter-spacing:-.08em;color:rgba(0,0,0,.18)}
.pl.ring::before{content:"";position:absolute;left:-18%;right:-18%;top:42%;bottom:42%;border:4px solid rgba(255,255,255,.4);border-radius:50%;transform:rotate(-14deg)}
.tx{position:relative;z-index:3;max-width:min(620px,52vw)}
.tx .tag{color:var(--c);opacity:1}
.tx h2{font-size:clamp(46px,7.6vw,118px);line-height:.88;letter-spacing:-.07em;font-weight:900;margin:8px 0 14px}
.tx .d{font-size:clamp(16px,1.5vw,19px);opacity:.92;margin-bottom:14px}
.tx .tm{display:inline-block;font:700 12.5px "SF Mono",monospace;padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.14);margin-left:8px;letter-spacing:0;text-transform:none}
.tx .trio{margin-top:6px}
.ap{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0 22px;max-width:760px}
.ap button{all:unset;cursor:pointer;text-align:center;padding:14px 8px;border-radius:22px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);font-weight:700;font-size:14px;transition:.3s}
.ap button:hover{transform:translateY(-6px);background:rgba(255,255,255,.2)}
.ap .ico,.ap .ico-fallback{width:60px;height:60px;border-radius:23%;object-fit:cover;display:grid;place-items:center;font:800 26px sans-serif;color:#fff;margin:0 auto 8px}
.hint{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);font-size:14px;opacity:.65;z-index:20}
@media(max-width:860px){.tx{max-width:90vw}.pl{opacity:.35;width:80vw}.track button span{display:none}.ap{grid-template-columns:repeat(4,1fr);gap:8px}}
</style></head><body>
<div class="brand">ideaapps<small>Marcin Polak · iOS · tvOS · AI</small></div>
<div class="sp" id="sp"></div><div class="st1" id="s1"></div><div class="st2" id="s2"></div>
<div class="track" id="track"><div class="fill" id="fill"></div><div class="rk" id="rk">🚀</div></div>
<div id="h"></div><div class="hint">przewijaj w bok (kółko, strzałki, przeciąganie)</div>
<script src="data.js"></script><script src="flow.js"></script><script src="ui.js"></script>
<script>
const {flow,projects}=IDEA,$=s=>document.querySelector(s),N=flow.length;
const h=$('#h');
h.innerHTML=`<section class="sc" data-c="#8a7bff"><div class="pl ring" style="--c:#8a7bff" data-n="0"></div><div class="tx" style="--c:#8a7bff"><span class="tag">Plan lotu · iOS · tvOS · AI</span><h2>Twój pomysł leci na orbitę.</h2><p class="d">Siedem przystanków między pierwszą rozmową a aplikacją w rękach użytkowników. Ja prowadzę, AI przyspiesza, a Ty widzisz każdy etap. Przewiń w bok, żeby wystartować.</p></div></section>`
+flow.map((f,i)=>`<section class="sc" data-c="${f.c}"><div class="pl ${i%2?'ring':''}" style="--c:${f.c}" data-n="${i+1}"></div><div class="tx" style="--c:${f.c}"><span class="tag">Przystanek ${i+1} z ${N}<span class="tm">${f.time}</span></span><h2>${f.t}</h2><p class="d">${f.d}</p>${IDEA.trio(f)}<div class="get"><b>Efekt:</b> ${f.get}</div></div></section>`).join('')
+`<section class="sc" data-c="#34d17a"><div class="pl" style="--c:#34d17a" data-n="★"></div><div class="tx" style="--c:#34d17a"><span class="tag">Orbita</span><h2>Wylądowali już ci przed Tobą.</h2><p class="d">Osiem aplikacji, które przeszły całą drogę. Kliknij, żeby zobaczyć szczegóły.</p><div class="ap" id="ap"></div><button class="btn" id="mail">Zaplanuj swój lot →</button></div></section>`;
$('#ap').innerHTML=projects.map((p,i)=>`<button data-i="${i}">${IDEA.iconHTML(p,'')}${p.name}</button>`).join('');
$('#ap').onclick=e=>{const b=e.target.closest('button');if(b)IDEA.ui.app(projects[+b.dataset.i])};
$('#mail').onclick=()=>IDEA.ui.panel('contact');
const secs=[...h.children],T=secs.length;
$('#track').insertAdjacentHTML('beforeend',secs.map((s,i)=>`<button data-i="${i}" style="left:${i/(T-1)*100}%;--c:${s.dataset.c}">${i}<span>${i===0?'Start':i===T-1?'Orbita':flow[i-1].t}</span></button>`).join(''));
$('#track').onclick=e=>{const b=e.target.closest('button');if(b)h.scrollTo({left:+b.dataset.i*innerWidth,behavior:'smooth'})};
h.addEventListener('wheel',e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){e.preventDefault();h.scrollLeft+=e.deltaY*1.1}},{passive:false});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')h.scrollBy({left:innerWidth,behavior:'smooth'});if(e.key==='ArrowLeft')h.scrollBy({left:-innerWidth,behavior:'smooth'})});
function upd(){const p=h.scrollLeft/(h.scrollWidth-innerWidth||1),i=Math.round(h.scrollLeft/innerWidth);
 $('#fill').style.width=(p*100)+'%';$('#rk').style.left=(p*100)+'%';$('#s1').style.transform=`translateX(${-h.scrollLeft*.12}px)`;$('#s2').style.transform=`translateX(${-h.scrollLeft*.3}px)`;
 document.querySelectorAll('.track button').forEach((b,k)=>b.classList.toggle('on',k===i));
 $('#sp').style.setProperty('--g',`color-mix(in srgb,${secs[i].dataset.c} 38%,#05060f)`)}
h.addEventListener('scroll',()=>requestAnimationFrame(upd),{passive:true});addEventListener('resize',upd);
IDEA.ui.bar(null,'top');upd();
</script></body></html>
