<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Plinko (wariant 48)</title>
<style>
:root{--c:#1b1d2e}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:18px/1.5 -apple-system,"SF Pro Text",Helvetica,sans-serif;color:#fff;background:var(--c);transition:background .8s;-webkit-font-smoothing:antialiased;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;cursor:crosshair}
.top{position:fixed;left:4vw;top:20px;z-index:5;pointer-events:none}
.top b{font-size:20px}.top span{display:block;font-size:14px;opacity:.7}
.hook{position:fixed;left:4vw;top:84px;z-index:5;max-width:min(360px,30vw);pointer-events:none}
.hook h1{font-size:clamp(30px,4.4vw,64px);line-height:.92;letter-spacing:-.06em;font-weight:800}
.hook p{margin-top:10px;font-size:15.5px;opacity:.8}
.cnt{position:fixed;right:4vw;top:22px;z-index:5;font:700 14px "SF Mono",monospace;opacity:.8;pointer-events:none}
.tip{position:fixed;left:50%;transform:translateX(-50%);bottom:84px;z-index:5;font-size:14px;opacity:.75;pointer-events:none;white-space:nowrap}
@media(max-width:800px){.hook{display:none}.tip{white-space:normal;text-align:center;width:90vw}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="top"><b>ideaapps</b><span>Marcin Polak · iOS · tvOS · AI</span></div>
<div class="hook"><h1>Wrzuć pomysł.<br>Zobacz, gdzie wpadnie.</h1><p>Klikaj u góry, żeby puszczać kulki. Odbijają się od moich aplikacji, a lądują w jednej z trzech przegródek.</p></div>
<div class="cnt" id="cnt">odbić: 0</div>
<div class="tip">kliknij ikonę, żeby ją otworzyć · kliknij u góry, żeby puścić kulkę</div>
<script src="data.js"></script><script src="ui.js"></script>
<script>
const {projects}=IDEA;
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,dpr=Math.min(2,devicePixelRatio||1);
const imgs={};
projects.forEach(p=>{if(p.icon){const i=new Image();i.src=p.icon;imgs[p.id]=i}});
let pegs=[],bumps=[],bins=[],walls=[],balls=[],hits=0,flash={};
function layout(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
 pegs=[];bumps=[];bins=[];
 const L=W<700?10:W*.22,R=W-(W<700?10:W*.04),top=H*.22,bot=H*.74,rows=7;
 // pegs
 for(let r=0;r<rows;r++){const y=top+(bot-top)*r/(rows-1);const n=Math.round((R-L)/70);for(let i=0;i<=n;i++){const x=L+(R-L)*(i+(r%2?.5:0))/n;if(x>L&&x<R)pegs.push({x,y,r:5})}}
 // bumpers (apps) on a zig-zag over pegs
 const br=Math.max(26,Math.min(38,(R-L)/22));
 projects.forEach((p,i)=>{const t=(i+.5)/projects.length;const x=L+(R-L)*t;const y=top+(bot-top)*(.28+(i%2)*.34)+ (i%3)*8;bumps.push({x,y,r:br,p,i})});
 // bins
 const bw=(R-L)/3,by=H-96;['process','services','contact'].forEach((k,i)=>bins.push({x0:L+bw*i,x1:L+bw*(i+1),y:by,k,n:['Jak pracuję','Usługi','Kontakt'][i]}));
 walls=[L,R]}
addEventListener('resize',layout);layout();
const g=.32;
function drop(x){if(balls.length>8)balls.shift();balls.push({x,y:30,vx:(Math.random()-.5)*.6,vy:0,r:11,hue:Math.random()*360,t:0})}
cv.addEventListener('pointerdown',e=>{
 const b=bumps.find(b=>Math.hypot(e.clientX-b.x,e.clientY-b.y)<b.r+4);
 if(b){openApp(b.p);return}
 if(e.clientY<H*.2||true)drop(Math.max(walls[0]+14,Math.min(walls[1]-14,e.clientX)))});
let hover=null;cv.addEventListener('pointermove',e=>{const b=bumps.find(b=>Math.hypot(e.clientX-b.x,e.clientY-b.y)<b.r+4);hover=b;cv.style.cursor=b?'pointer':'crosshair'});
function openApp(p){document.documentElement.style.setProperty('--c',`color-mix(in srgb,${p.color} 55%,#0b0b12)`);document.body.style.setProperty('--c',`color-mix(in srgb,${p.color} 55%,#0b0b12)`);
 IDEA.ui.app(p,{onOpen:q=>{document.body.style.setProperty('--c',`color-mix(in srgb,${q.color} 55%,#0b0b12)`)},onClose:()=>document.body.style.setProperty('--c','#1b1d2e')})}
function step(){
 for(const b of balls){b.vy+=g;b.x+=b.vx;b.y+=b.vy;b.t++;
  if(b.x<walls[0]+b.r){b.x=walls[0]+b.r;b.vx=Math.abs(b.vx)*.7}if(b.x>walls[1]-b.r){b.x=walls[1]-b.r;b.vx=-Math.abs(b.vx)*.7}
  for(const p of pegs){const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy),m=b.r+p.r;if(d<m&&d>0){const nx=dx/d,ny=dy/d;b.x=p.x+nx*m;b.y=p.y+ny*m;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=(1+.62)*vn*nx;b.vy-=(1+.62)*vn*ny}}}
  for(const p of bumps){const dx=b.x-p.x,dy=b.y-p.y,d=Math.hypot(dx,dy),m=b.r+p.r;if(d<m&&d>0){const nx=dx/d,ny=dy/d;b.x=p.x+nx*m;b.y=p.y+ny*m;const vn=b.vx*nx+b.vy*ny;if(vn<0){b.vx-=(1+1.2)*vn*nx;b.vy-=(1+1.2)*vn*ny;flash[p.p.id]=14;hits++;document.getElementById('cnt').textContent='odbić: '+hits}}}
  // bins
  const by=bins[0].y;
  if(b.y>by-b.r){for(const w of [bins[0].x0,bins[1].x0,bins[2].x0,bins[2].x1]){if(Math.abs(b.x-w)<b.r+3&&b.y>by){b.vx=b.x>w?Math.abs(b.vx)+.5:-Math.abs(b.vx)-.5;b.x+=b.x>w?2:-2}}}
  if(b.y>H-40-b.r){b.done=true;const bin=bins.find(q=>b.x>=q.x0&&b.x<q.x1)||bins[1];flash['bin'+bin.k]=40;setTimeout(()=>IDEA.ui.panel(bin.k),250)}}
 balls=balls.filter(b=>!b.done);
}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function draw(){
 ctx.clearRect(0,0,W,H);
 // field
 const L=walls[0],R=walls[1];
 ctx.fillStyle='rgba(255,255,255,.05)';rr(L-6,40,R-L+12,H-40-40,22);ctx.fill();
 ctx.strokeStyle='rgba(255,255,255,.25)';ctx.lineWidth=2;ctx.stroke();
 for(const p of pegs){ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.fillStyle='rgba(255,255,255,.65)';ctx.fill()}
 for(const b of bumps){const f=flash[b.p.id]||0;if(f)flash[b.p.id]--;const s=1+f*.012+(hover===b?.1:0);
  ctx.save();ctx.translate(b.x,b.y);ctx.scale(s,s);
  ctx.shadowColor=f?'#fff':'rgba(0,0,0,.5)';ctx.shadowBlur=f?30:14;
  const r=b.r;ctx.beginPath();ctx.arc(0,0,r+4,0,7);ctx.fillStyle=f?'#fff':'rgba(255,255,255,.2)';ctx.fill();ctx.shadowBlur=0;
  ctx.save();rr(-r,-r,r*2,r*2,r*.46);ctx.clip();
  const im=imgs[b.p.id];if(im&&im.complete&&im.naturalWidth)ctx.drawImage(im,-r,-r,r*2,r*2);else{ctx.fillStyle=b.p.color;ctx.fillRect(-r,-r,r*2,r*2);ctx.fillStyle='#fff';ctx.font=`800 ${r}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(b.p.name[0],0,2)}
  ctx.restore();ctx.restore();
  if(hover===b||f){ctx.fillStyle='#fff';ctx.font='700 13px -apple-system,sans-serif';ctx.textAlign='center';ctx.fillText(b.p.name,b.x,b.y+b.r+20)}}
 // bins
 const by=bins[0].y;
 bins.forEach((q,i)=>{const f=flash['bin'+q.k]||0;if(f)flash['bin'+q.k]--;
  ctx.fillStyle=f?'#ffcf3a':'rgba(255,255,255,.1)';rr(q.x0+4,by,q.x1-q.x0-8,H-40-by-4,16);ctx.fill();
  ctx.fillStyle=f?'#16161c':'#fff';ctx.font='800 '+(W<700?13:17)+'px -apple-system,sans-serif';ctx.textAlign='center';ctx.fillText(q.n,(q.x0+q.x1)/2,by+ (H-40-by)/2+6)});
 ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=4;[bins[0].x0,bins[1].x0,bins[2].x0,bins[2].x1].forEach(x=>{ctx.beginPath();ctx.moveTo(x,by);ctx.lineTo(x,H-44);ctx.stroke()});
 // balls
 for(const b of balls){ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);const gr=ctx.createRadialGradient(b.x-3,b.y-3,2,b.x,b.y,b.r);gr.addColorStop(0,'#fff6c4');gr.addColorStop(1,'#ffb300');ctx.fillStyle=gr;ctx.shadowColor='rgba(255,190,0,.8)';ctx.shadowBlur=14;ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#5a3a00';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('💡',b.x,b.y+4)}
}
(function loop(){step();draw();requestAnimationFrame(loop)})();
setTimeout(()=>drop(W*.6),600);
IDEA.ui.bar([['process','Jak pracuję'],['services','Usługi'],['about','O mnie'],['contact','Kontakt','p']]);
</script>
</body>
</html>
