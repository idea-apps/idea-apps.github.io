<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Wipe (wariant 68)</title>
<style>
:root{--c:#2d3a8c}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:18px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display",Helvetica,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;background:var(--c)}
#wipe{position:fixed;inset:0;z-index:2;clip-path:circle(0 at 50% 50%);pointer-events:none}
.grain{position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.1;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>")}
.bgs{position:fixed;inset:0;z-index:1;background:radial-gradient(70% 90% at 78% 40%,rgba(255,255,255,.22),transparent 65%),radial-gradient(60% 60% at 10% 100%,rgba(0,0,0,.35),transparent 70%)}
.brand{position:fixed;left:4vw;top:24px;z-index:20;font-weight:800;font-size:20px;letter-spacing:-.03em}
.brand small{display:block;font-weight:500;font-size:13px;opacity:.75}
.stage{position:relative;z-index:5;height:100%;display:grid;grid-template-columns:1.2fr .8fr;align-items:center;padding:0 5vw 80px}
.cat{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.8;margin-bottom:6px;overflow:hidden}
.cat span,.nm span{display:inline-block;transform:translateY(110%);animation:rise .8s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(var(--i)*40ms + var(--d,0ms))}
@keyframes rise{to{transform:none}}
.nm{font-size:clamp(70px,13.5vw,230px);font-weight:900;letter-spacing:-.075em;line-height:.86;overflow:hidden;padding-bottom:.08em;margin-left:-.04em}
.tg{font-size:clamp(20px,2.4vw,34px);font-weight:700;letter-spacing:-.03em;line-height:1.15;max-width:18em;margin:18px 0 22px;opacity:0;animation:fi .8s .35s forwards}
@keyframes fi{to{opacity:1}}
.row{display:flex;gap:10px;opacity:0;animation:fi .8s .5s forwards;flex-wrap:wrap}
.btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:10px;background:#fff;color:#14141c;font-weight:800;padding:14px 26px;border-radius:99px;font-size:16px;transition:.25s}
.btn:hover{transform:translateY(-2px);box-shadow:0 16px 30px -12px rgba(0,0,0,.5)}
.btn.g{background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.4);text-decoration:none}
.vis{position:relative;height:100%;display:grid;place-items:center;perspective:1200px}
.ph{height:min(72vh,700px);aspect-ratio:9/19.5;border-radius:48px;overflow:hidden;background:#000;box-shadow:0 0 0 9px #0a0a0e,0 0 0 11px rgba(255,255,255,.2),0 60px 100px -20px rgba(0,0,0,.65);transform:rotateY(var(--ry,-12deg)) rotateX(var(--rx,4deg)) rotate(-2deg);transition:transform .25s ease-out;animation:phin 1s cubic-bezier(.2,.9,.2,1)}
@keyframes phin{from{opacity:0;translate:0 80px}}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top}
.ph .fb{width:100%;height:100%;display:grid;place-items:center;font:900 min(24vh,200px) sans-serif;color:#fff;background:linear-gradient(160deg,rgba(255,255,255,.25),rgba(0,0,0,.35))}
.nav{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:10;display:flex;gap:10px;padding:8px 12px;background:rgba(0,0,0,.22);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.22);border-radius:99px}
.nav button{all:unset;cursor:pointer;width:50px;height:50px;border-radius:23%;overflow:hidden;opacity:.6;transition:.3s cubic-bezier(.3,1.4,.5,1);position:relative}
.nav button:hover{opacity:1;transform:translateY(-6px) scale(1.12)}
.nav button.on{opacity:1;transform:translateY(-8px) scale(1.2);box-shadow:0 0 0 3px #fff}
.nav .ico,.nav .ico-fallback{width:100%;height:100%;object-fit:cover;display:grid;place-items:center;font:800 20px sans-serif;color:#fff}
.cnt{position:fixed;right:4vw;bottom:34px;z-index:10;font:700 14px "SF Mono",monospace;opacity:.8}
@media(max-width:860px){.stage{grid-template-columns:1fr;padding:90px 6vw 100px;align-content:center}.vis{display:none}.nm{font-size:22vw}}
</style>
</head>
<body>
<div id="wipe"></div><div class="bgs"></div><div class="grain"></div>
<div class="brand">ideaapps<small>Marcin Polak · iOS · tvOS · AI</small></div>
<main class="stage"><div><div class="cat" id="cat"></div><h1 class="nm" id="nm"></h1><p class="tg" id="tg"></p><div class="row" id="row"></div></div><div class="vis" id="vis"></div></main>
<div class="nav" id="nav"></div><div class="cnt" id="cnt"></div>
<script src="data.js"></script><script src="ui.js"></script>
<script>
const {projects}=IDEA;
const $=s=>document.querySelector(s);
const deep=c=>`color-mix(in srgb,${c} 78%,#0c0c14)`;
$('#nav').innerHTML=projects.map((p,i)=>`<button data-i="${i}" title="${p.name}">${IDEA.iconHTML(p,'')}</button>`).join('');
const split=(t,d)=>[...t].map((c,i)=>`<span style="--i:${i};--d:${d||0}ms">${c===' '?'&nbsp;':c}</span>`).join('');
let cur=-1,busy=false;
function fill(i){const p=projects[i];cur=i;
 $('#cat').innerHTML=split(`${p.cat} · ${p.platforms.split(' · ')[0]}`,100);
 $('#nm').innerHTML=split(p.name);
 const t=$('#tg');t.style.animation='none';t.offsetWidth;t.style.animation='';t.textContent=p.tag;
 const r=$('#row');r.style.animation='none';r.offsetWidth;r.style.animation='';r.innerHTML=`<button class="btn" id="more">Szczegóły →</button><a class="btn g" href="${p.url}" target="_blank" rel="noopener">App Store ↗</a>`;
 $('#more').onclick=()=>IDEA.ui.app(p);
 $('#vis').innerHTML=`<div class="ph">${p.shot&&p.id!=='boxes'?`<img src="${p.shot}" alt="">`:`<div class="fb">${p.name[0]}</div>`}</div>`;
 document.querySelectorAll('.nav button').forEach((b,k)=>b.classList.toggle('on',k===i));
 $('#cnt').textContent=`${String(i+1).padStart(2,'0')} / ${String(projects.length).padStart(2,'0')}`}
function go(i,x,y){if(busy||i===cur)return;busy=true;const p=projects[i];const w=$('#wipe');
 w.style.background=`radial-gradient(70% 90% at 78% 40%,rgba(255,255,255,.2),transparent 65%),${deep(p.color)}`;
 w.style.transition='none';w.style.clipPath=`circle(0px at ${x}px ${y}px)`;w.getBoundingClientRect();
 w.style.transition='clip-path .9s cubic-bezier(.65,0,.2,1)';w.style.clipPath=`circle(${Math.hypot(innerWidth,innerHeight)*1.05}px at ${x}px ${y}px)`;
 setTimeout(()=>fill(i),380);
 setTimeout(()=>{document.documentElement.style.setProperty('--c',deep(p.color));w.style.transition='none';w.style.clipPath=`circle(0px at ${x}px ${y}px)`;busy=false},950)}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const r=b.getBoundingClientRect();go(+b.dataset.i,r.left+r.width/2,r.top+r.height/2)});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go((cur+1)%projects.length,innerWidth,innerHeight/2);if(e.key==='ArrowLeft')go((cur-1+projects.length)%projects.length,0,innerHeight/2)});
addEventListener('pointermove',e=>{const ph=document.querySelector('.ph');if(!ph)return;ph.style.setProperty('--ry',(-12+(e.clientX/innerWidth-.5)*-14)+'deg');ph.style.setProperty('--rx',(4+(e.clientY/innerHeight-.5)*-10)+'deg')});
document.documentElement.style.setProperty('--c',deep(projects[0].color));fill(0);
IDEA.ui.bar(null,'top');
</script>
</body>
</html>
