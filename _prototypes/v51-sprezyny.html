<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Sprężyny (wariant 51)</title>
<style>
:root{--c:#1d2340}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:18px/1.5 -apple-system,"SF Pro Text",Helvetica,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;user-select:none;touch-action:none;background:var(--c);transition:background .8s;
 background-image:radial-gradient(70% 80% at 50% 50%,rgba(255,255,255,.1),transparent 75%)}
svg{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
svg line{stroke:rgba(255,255,255,.45);stroke-width:3;stroke-linecap:round}
.top{position:fixed;left:4vw;top:22px;z-index:5;pointer-events:none}
.top b{font-size:20px}.top span{display:block;font-size:14px;opacity:.7}
.hook{position:fixed;left:4vw;bottom:92px;z-index:5;max-width:min(430px,45vw);pointer-events:none}
.hook h1{font-size:clamp(34px,5vw,76px);line-height:.9;letter-spacing:-.06em;font-weight:800}
.hook p{margin-top:10px;font-size:16px;opacity:.82}
.nd{position:fixed;left:0;top:0;width:72px;height:72px;margin:-36px;border-radius:23%;overflow:hidden;display:grid;place-items:center;font:800 30px sans-serif;color:#fff;cursor:grab;will-change:transform;box-shadow:0 12px 28px rgba(0,0,0,.5);touch-action:none;transition:box-shadow .25s}
.nd img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.nd:active{cursor:grabbing}
.nd .nm{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);font-size:12.5px;font-weight:800;white-space:nowrap;text-shadow:0 2px 8px #000}
.nd.sel{box-shadow:0 0 0 4px #fff,0 0 50px 10px rgba(255,255,255,.55)}
.core{position:fixed;left:0;top:0;width:110px;height:110px;margin:-55px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ffe08a 40%,#ff9f3d);box-shadow:0 0 70px 20px rgba(255,170,70,.45);display:grid;place-items:center;text-align:center;font:800 15px/1.05 sans-serif;color:#4a2a00;cursor:grab;will-change:transform;touch-action:none}
.tip{position:fixed;left:50%;top:22px;transform:translateX(-50%);z-index:5;font-size:14px;opacity:.78;pointer-events:none;white-space:nowrap;background:rgba(0,0,0,.2);padding:6px 16px;border-radius:99px}
@media(max-width:800px){.hook{display:none}.tip{display:none}.nd{width:60px;height:60px;margin:-30px}}
</style>
</head>
<body>
<svg id="sv"></svg>
<div class="top"><b>ideaapps</b><span>Marcin Polak · iOS · tvOS · AI</span></div>
<div class="tip">chwyć dowolną ikonę i pociągnij · reszta idzie za nią na sprężynach</div>
<div class="hook"><h1>Wszystko jest ze sobą powiązane.</h1><p>Pociągnij ikonę, a sieć zadrży. Kliknij, żeby otworzyć aplikację.</p></div>
<script src="data.js"></script><script src="ui.js"></script>
<script>
const {projects}=IDEA;
const $=s=>document.querySelector(s);
let W=innerWidth,H=innerHeight;
const N=projects.length;
const nodes=[{id:'core',x:W/2,y:H/2,px:W/2,py:H/2,fixed:false,r:55,core:true}];
projects.forEach((p,i)=>{const a=i/N*6.283,R=Math.min(W,H)*.32;nodes.push({id:p.id,p,x:W/2+Math.cos(a)*R,y:H/2+Math.sin(a)*R,px:W/2+Math.cos(a)*R,py:H/2+Math.sin(a)*R,r:36})});
const links=[];
for(let i=1;i<=N;i++){links.push([0,i,Math.min(W,H)*.3]);links.push([i,i%N+1,Math.min(W,H)*.23])}
for(let i=1;i<=N;i++)links.push([i,((i+1)%N)+1,Math.min(W,H)*.4,.25]);
const els=nodes.map(n=>{const e=document.createElement('div');if(n.core){e.className='core';e.innerHTML='idea<br>apps'}else{e.className='nd';e.dataset.id=n.id;e.innerHTML=(n.p.icon?`<img src="${n.p.icon}" alt="">`:`<span style="position:absolute;inset:0;display:grid;place-items:center;background:${n.p.color}">${n.p.name[0]}</span>`)+`<span class="nm">${n.p.name}</span>`}document.body.appendChild(e);return e});
$('#sv').innerHTML=links.map((l,i)=>`<line id="l${i}" style="opacity:${l[3]?.35:1}"/>`).join('');
const lines=links.map((_,i)=>document.getElementById('l'+i));
addEventListener('resize',()=>{W=innerWidth;H=innerHeight});
let drag=null,moved=0,t0=0;
function find(x,y){for(let i=nodes.length-1;i>=0;i--){const n=nodes[i];if(Math.hypot(x-n.x,y-n.y)<n.r)return n}}
document.addEventListener('pointerdown',e=>{if(e.target.closest('.ix'))return;const n=find(e.clientX,e.clientY);if(n){drag={n,ox:e.clientX-n.x,oy:e.clientY-n.y};moved=0;t0=performance.now()}});
addEventListener('pointermove',e=>{if(!drag)return;const nx=e.clientX-drag.ox,ny=e.clientY-drag.oy;moved+=Math.abs(nx-drag.n.x)+Math.abs(ny-drag.n.y);drag.n.x=nx;drag.n.y=ny;drag.n.px=nx;drag.n.py=ny});
addEventListener('pointerup',()=>{if(!drag)return;const n=drag.n;drag=null;if(moved<8&&performance.now()-t0<400){if(n.core)IDEA.ui.panel('about');else pick(n)}});
let sel=null;
function pick(n){sel=n.id;els.forEach((e,i)=>e.classList.toggle('sel',nodes[i]===n));document.body.style.setProperty('--c',`color-mix(in srgb,${n.p.color} 55%,#0b0b16)`);
 IDEA.ui.app(n.p,{onOpen:q=>{document.body.style.setProperty('--c',`color-mix(in srgb,${q.color} 55%,#0b0b16)`);els.forEach((e,i)=>e.classList.toggle('sel',nodes[i].id===q.id))},onClose:()=>{sel=null;els.forEach(e=>e.classList.remove('sel'));document.body.style.setProperty('--c','#1d2340')}})}
// idle nudges
setInterval(()=>{if(drag)return;const n=nodes[1+Math.floor(Math.random()*N)];n.px-=(Math.random()-.5)*60;n.py-=(Math.random()-.5)*60},2600);
function step(){
 for(const n of nodes){if(drag&&drag.n===n)continue;const vx=(n.x-n.px)*.985,vy=(n.y-n.py)*.985;n.px=n.x;n.py=n.y;n.x+=vx;n.y+=vy;
  if(n.x<n.r){n.x=n.r}if(n.x>W-n.r){n.x=W-n.r}if(n.y<n.r+40){n.y=n.r+40}if(n.y>H-n.r-70){n.y=H-n.r-70}}
 // gentle pull of core to center
 const c=nodes[0];if(!drag||drag.n!==c){c.x+=(W*.55-c.x)*.002;c.y+=(H*.5-c.y)*.002}
 for(let k=0;k<4;k++){for(const [a,b,rest,soft] of links){const A=nodes[a],B=nodes[b];const dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1,diff=(d-rest)/d*(soft?.02:.07);
   const ma=drag&&drag.n===A?0:1,mb=drag&&drag.n===B?0:1,s=ma+mb||1;A.x+=dx*diff*ma/s;A.y+=dy*diff*ma/s;B.x-=dx*diff*mb/s;B.y-=dy*diff*mb/s}
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const A=nodes[i],B=nodes[j],dx=B.x-A.x,dy=B.y-A.y,d=Math.hypot(dx,dy)||1,m=A.r+B.r+10;if(d<m){const f=(m-d)/d*.5;const ma=drag&&drag.n===A?0:1,mb=drag&&drag.n===B?0:1;A.x-=dx*f*ma;A.y-=dy*f*ma;B.x+=dx*f*mb;B.y+=dy*f*mb}}}
 nodes.forEach((n,i)=>els[i].style.transform=`translate(${n.x}px,${n.y}px) scale(${sel===n.id?1.25:1})`);
 links.forEach((l,i)=>{const A=nodes[l[0]],B=nodes[l[1]];const e=lines[i];e.setAttribute('x1',A.x);e.setAttribute('y1',A.y);e.setAttribute('x2',B.x);e.setAttribute('y2',B.y)});
 requestAnimationFrame(step)}
step();
IDEA.ui.bar();
</script>
</body>
</html>
