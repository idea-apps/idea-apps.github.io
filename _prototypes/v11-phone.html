<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Telefon (wariant 11)</title>
<style>
:root{--ink:#14141a;--soft:#6b6b78;--tint:#eef0f5}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font:18px/1.55 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,sans-serif;color:var(--ink);background:var(--tint);transition:background .7s;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
nav{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:20px 36px;font-size:15px;font-weight:600}
nav .a a{margin-left:26px;opacity:.65}nav .a a:hover{opacity:1}
.stage{display:grid;grid-template-columns:1fr minmax(300px,420px);max-width:1280px;margin:0 auto;padding:0 36px}
.txt section{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:100px 40px 100px 0;max-width:600px}
.k{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--c,#555);margin-bottom:18px}
h1{font-size:clamp(46px,6.4vw,92px);line-height:.98;letter-spacing:-.05em;font-weight:800}
h2{font-size:clamp(40px,5vw,72px);line-height:1;letter-spacing:-.045em;font-weight:800;margin-bottom:16px}
.txt p{font-size:20px;color:#3d3d48;margin-bottom:14px;max-width:30em}
.hero p{margin-top:24px}
.pf{display:flex;gap:10px;font-size:14px;color:var(--soft);margin:2px 0 24px}
.pf span{padding:4px 12px;border-radius:99px;background:rgba(255,255,255,.7)}
.btn{display:inline-block;align-self:flex-start;background:var(--ink);color:#fff;padding:14px 26px;border-radius:99px;font-weight:600;font-size:16px;transition:.2s}
.btn:hover{transform:scale(1.04)}
.ph-col{position:relative}
.ph-wrap{position:sticky;top:0;height:100vh;display:grid;place-items:center}
.ph{width:min(300px,78vw);aspect-ratio:9/19.2;background:#0b0b0e;border-radius:54px;padding:11px;box-shadow:0 0 0 2px #2b2b33,0 50px 90px -20px rgba(20,20,40,.45),inset 0 0 0 2px #000;position:relative}
.ph::before{content:"";position:absolute;top:22px;left:50%;width:88px;height:26px;margin-left:-44px;background:#000;border-radius:20px;z-index:3}
.scr{position:absolute;inset:11px;border-radius:44px;overflow:hidden;background:#fff}
.scr>*{position:absolute;inset:0;width:100%;height:100%;opacity:0;transition:opacity .5s,transform .6s;transform:scale(1.04)}
.scr>.on{opacity:1;transform:none}
.scr img{object-fit:cover;object-position:top}
.scr .fb{display:grid;place-items:center;align-content:center;gap:16px;color:#fff;font-weight:800}
.scr .fb b{font-size:110px;letter-spacing:-.06em;line-height:1}
.scr .fb span{font-size:18px;opacity:.85;font-weight:600}
.scr .intro{background:#14141a;color:#fff;display:grid;place-items:center;font-size:38px;font-weight:800;letter-spacing:-.04em;text-align:center;line-height:1}
.scr .intro small{display:block;font-size:14px;font-weight:500;opacity:.6;letter-spacing:0;margin-top:10px}
.svc{display:grid;gap:14px;margin-top:18px}
.svc div{background:rgba(255,255,255,.75);border-radius:20px;padding:18px 22px}
.svc b{display:block;font-size:19px;margin-bottom:2px}.svc span{font-size:16px;color:#4a4a55}
footer{padding:30px 36px;color:var(--soft);font-size:14px;text-align:center}
@media(max-width:860px){.stage{grid-template-columns:1fr;padding:0 22px}.ph-col{display:none}.txt section{min-height:auto;padding:70px 0}nav .a{display:none}nav{padding:16px 22px}.m-shot{display:block!important}}
.m-shot{display:none;width:200px;border-radius:30px;box-shadow:0 20px 50px rgba(0,0,0,.25);margin-top:22px}
</style>
</head>
<body>
<nav><a href="#">ideaapps</a><span class="a"><a href="#apki">Aplikacje</a><a href="#uslugi">Usługi</a><a href="#kontakt">Kontakt</a></span></nav>
<div class="stage">
<div class="txt" id="txt">
<section class="hero" data-i="-1"><div class="k">Marcin Polak · iOS · tvOS · AI</div>
<h1>Zrobię Ci aplikację, którą ludzie otworzą jutro rano.</h1>
<p>Dziesięć lat natywnego kodu dla Apple. Osiem własnych aplikacji w App Store. Przewiń i zobacz, jak wyglądają.</p></section>
</div>
<div class="ph-col"><div class="ph-wrap"><div class="ph"><div class="scr" id="scr"></div></div></div></div>
</div>
<footer>© 2026 ideaapps</footer>
<script src="data.js"></script>
<script>
const {projects,services,email}=IDEA;
const txt=document.getElementById('txt'),scr=document.getElementById('scr');
const tints=p=>`color-mix(in srgb,${p.color} 16%,#fff)`;
scr.innerHTML=`<div class="intro on" data-s="-1"><div>ideaapps<small>przewiń w dół</small></div></div>`+projects.map((p,i)=>
 p.shot?`<img data-s="${i}" src="${p.shot}" alt="${p.name}">`:`<div class="fb" data-s="${i}" style="background:${p.color}"><b>${p.name[0]}</b><span>${p.name}</span></div>`).join('')
 +`<div class="intro" data-s="end"><div>Twoja<br>aplikacja?<small>${email}</small></div></div>`;
txt.insertAdjacentHTML('beforeend','<section id="apki" style="min-height:40vh;justify-content:flex-end"><div class="k">Portfolio</div><h2>Osiem apek. Wszystkie żyją w App Store.</h2></section>'
+projects.map((p,i)=>`<section data-i="${i}" style="--c:${p.color}"><div class="k">${p.cat}</div><h2>${p.name}</h2>
<div class="pf"><span>${p.platforms}</span></div><p><b>${p.tag}.</b> ${p.desc}</p>
${p.shot?`<img class="m-shot" src="${p.shot}" alt="">`:''}<br><a class="btn" href="${p.url}" target="_blank" rel="noopener">Zobacz w App Store</a></section>`).join('')
+`<section id="uslugi" data-i="end"><div class="k">Usługi</div><h2>Co mogę zbudować dla Ciebie</h2><div class="svc">${services.map(s=>`<div><b>${s.t}</b><span>${s.d}</span></div>`).join('')}</div></section>
<section id="kontakt" data-i="end"><div class="k">Kontakt</div><h2>Masz pomysł? Pogadajmy.</h2><p>Opisz w kilku zdaniach, co chcesz zbudować. Odpiszę i powiem szczerze, jak to widzę.</p><a class="btn" href="mailto:${email}">${email}</a></section>`);
const show=i=>{scr.querySelectorAll('[data-s]').forEach(e=>e.classList.toggle('on',e.dataset.s==i));
 document.body.style.background=(i>=0&&projects[i])?tints(projects[i]):'#eef0f5'};
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)show(e.target.dataset.i)}),{rootMargin:'-45% 0px -45% 0px'});
txt.querySelectorAll('section[data-i]').forEach(s=>io.observe(s));
</script>
</body>
</html>
