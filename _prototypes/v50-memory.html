<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Memory (wariant 50)</title>
<style>
:root{--c:#2a2540}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:18px/1.5 -apple-system,"SF Pro Text",Helvetica,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;user-select:none;background:var(--c);transition:background .8s;display:grid;place-items:center;
 background-image:radial-gradient(60% 70% at 50% 40%,rgba(255,255,255,.1),transparent 70%)}
.top{position:fixed;left:4vw;top:22px;z-index:5}
.top b{font-size:20px}.top span{display:block;font-size:14px;opacity:.7}
.hdr{position:fixed;right:4vw;top:22px;z-index:5;display:flex;gap:12px;align-items:center;font:700 14px "SF Mono",monospace}
.hdr button{all:unset;cursor:pointer;border:1.5px solid rgba(255,255,255,.5);padding:6px 16px;border-radius:99px;font-family:-apple-system,sans-serif}
.hdr button:hover{background:#fff;color:#111}
.game{display:grid;grid-template-columns:minmax(260px,430px) minmax(0,640px);gap:4vw;align-items:center;padding:70px 4vw 90px;width:100%;max-width:1200px}
.hk h1{font-size:clamp(36px,5.4vw,80px);line-height:.9;letter-spacing:-.06em;font-weight:800}
.hk p{margin-top:14px;font-size:17px;opacity:.85;max-width:24em}
.hk .sc{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap}
.hk .sc span{font:700 13px "SF Mono",monospace;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.16)}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,1.4vw,16px);perspective:1200px}
.cd{aspect-ratio:1;position:relative;cursor:pointer;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.8,.3,1)}
.cd.f{transform:rotateY(180deg)}
.cd .fc{position:absolute;inset:0;border-radius:22%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;overflow:hidden}
.cd .bk{background:linear-gradient(145deg,#4a4470,#2b2745);box-shadow:inset 0 0 0 3px rgba(255,255,255,.18),0 8px 18px rgba(0,0,0,.4);font:800 clamp(24px,5vw,44px) sans-serif;color:rgba(255,255,255,.4)}
.cd:hover:not(.f) .bk{transform:translateY(-4px) scale(1.03);transition:.2s}
.cd .fr{transform:rotateY(180deg);background:var(--cc);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.cd .fr img{width:100%;height:100%;object-fit:cover}
.cd .fr .l{font:800 clamp(28px,6vw,54px) sans-serif;color:#fff}
.cd.m .fr{box-shadow:0 0 0 4px #fff,0 0 36px 6px rgba(255,255,255,.55)}
.cd.shake{animation:sh .4s}
@keyframes sh{25%{transform:rotateY(180deg) translateX(-6px)}75%{transform:rotateY(180deg) translateX(6px)}}
.conf{position:fixed;width:10px;height:14px;z-index:9500;pointer-events:none}
@media(max-width:860px){.game{grid-template-columns:1fr;padding-top:80px}.hk p{display:none}.hk h1{font-size:36px}}
</style>
</head>
<body>
<div class="top"><b>ideaapps</b><span>Marcin Polak · iOS · tvOS · AI</span></div>
<div class="hdr"><span id="mv">ruchy: 0</span><button id="rs">↻ Od nowa</button></div>
<div class="game"><div class="hk"><h1>Znajdź pary. Poznaj aplikacje.</h1><p>Odkrywaj karty. Za każdą znalezioną parą otworzy się pełny opis aplikacji. Skompletujesz wszystkie osiem i dostaniesz niespodziankę.</p><div class="sc"><span id="pr">pary: 0 / 8</span></div></div>
<div class="board" id="bd"></div></div>
<script src="data.js"></script><script src="ui.js"></script>
<script>
const {projects}=IDEA;
const $=s=>document.querySelector(s);
let first=null,lock=false,moves=0,pairs=0;
function build(){const deck=[...projects,...projects].map((p,i)=>({p,k:i})).sort(()=>Math.random()-.5);
 $('#bd').innerHTML=deck.map(d=>`<div class="cd" data-id="${d.p.id}" style="--cc:${d.p.color}"><div class="fc bk">?</div><div class="fc fr">${d.p.icon?`<img src="${d.p.icon}" alt="">`:`<span class="l">${d.p.name[0]}</span>`}</div></div>`).join('');
 first=null;lock=false;moves=0;pairs=0;$('#mv').textContent='ruchy: 0';$('#pr').textContent='pary: 0 / 8';document.body.style.setProperty('--c','#2a2540')}
build();
$('#rs').onclick=build;
$('#bd').addEventListener('click',e=>{const c=e.target.closest('.cd');if(!c||lock||c.classList.contains('f'))return;
 c.classList.add('f');
 if(!first){first=c;return}
 moves++;$('#mv').textContent='ruchy: '+moves;
 const a=first,b=c;first=null;
 if(a.dataset.id===b.dataset.id){a.classList.add('m');b.classList.add('m');pairs++;$('#pr').textContent=`pary: ${pairs} / 8`;lock=true;
  const p=projects.find(x=>x.id===a.dataset.id);document.body.style.setProperty('--c',`color-mix(in srgb,${p.color} 55%,#0d0b18)`);
  setTimeout(()=>{lock=false;IDEA.ui.app(p,{onClose:()=>{if(pairs===8)win();else document.body.style.setProperty('--c','#2a2540')}})},650)}
 else{lock=true;setTimeout(()=>{a.classList.remove('f');b.classList.remove('f');lock=false},850)}});
function win(){for(let i=0;i<90;i++){const s=document.createElement('i');s.className='conf';s.style.background=['#ffcf3a','#ff6b6b','#4ecdc4','#a78bfa','#fff'][i%5];s.style.left=Math.random()*100+'vw';s.style.top='-20px';document.body.appendChild(s);
  s.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translateY(${innerHeight+40}px) translateX(${(Math.random()-.5)*300}px) rotate(${Math.random()*720}deg)`,opacity:1}],{duration:2200+Math.random()*1800,easing:'cubic-bezier(.3,.6,.4,1)'}).onfinish=()=>s.remove()}
 setTimeout(()=>IDEA.ui.panel('contact'),900)}
IDEA.ui.bar();
</script>
</body>
</html>
