<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Cząstki (wariant 70)</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:18px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display",Helvetica,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;background:#0b0b12}
canvas{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
.brand{position:fixed;left:4vw;top:24px;z-index:20;font-weight:800;font-size:20px;letter-spacing:-.03em}
.brand small{display:block;font-weight:500;font-size:13px;opacity:.7}
.stage{position:fixed;inset:0;z-index:5;display:grid;grid-template-rows:1fr auto;place-items:center;padding:70px 5vw 96px}
.mid{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:4vw;align-items:center;width:100%;max-width:1300px;height:100%;min-height:0}
.ph{position:relative;height:min(100%,640px);aspect-ratio:9/19.5;border-radius:44px;overflow:hidden;background:#000;box-shadow:0 0 0 8px #0a0a0e,0 0 0 10px rgba(255,255,255,.18),0 50px 90px -20px rgba(0,0,0,.65);animation:in .9s cubic-bezier(.2,.9,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(40px) scale(.95)}}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top}
.ph .fb{width:100%;height:100%;display:grid;place-items:center;font:900 min(24vh,200px) sans-serif;color:#fff}
.col{min-width:0}
.col.l{text-align:right}
.col small{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.col h1{font-size:clamp(44px,min(7.4vw,12vh),130px);line-height:.86;letter-spacing:-.07em;font-weight:900;margin:8px 0 10px}
.col .t{font-size:clamp(18px,1.9vw,26px);font-weight:700;letter-spacing:-.02em;line-height:1.25}
.col .f{list-style:none;padding:0;margin:0 0 18px;font-size:17px}
.col .f li{padding:6px 0 6px 26px;font-size:16px;border-bottom:1px solid rgba(255,255,255,.2);position:relative;line-height:1.35}
.col .f li::before{content:"✓";position:absolute;left:0;top:7px;font-weight:800}
.col .w{opacity:.8;margin-bottom:16px;font-size:16px}
.ani{animation:fu .7s cubic-bezier(.2,.9,.2,1) backwards}
@keyframes fu{from{opacity:0;transform:translateY(20px)}}
.btn{all:unset;cursor:pointer;display:inline-flex;gap:10px;background:#fff;color:#14141c;font-weight:800;padding:13px 24px;border-radius:99px;font-size:16px;transition:.25s}
.btn:hover{transform:translateY(-2px)}
.nav{display:flex;gap:8px;padding:7px;background:rgba(255,255,255,.1);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.22);border-radius:99px;z-index:6}
.nav button{all:unset;cursor:pointer;display:flex;align-items:center;height:46px;border-radius:99px;overflow:hidden;transition:.4s cubic-bezier(.3,.9,.3,1)}
.nav .ico,.nav .ico-fallback{width:46px;height:46px;border-radius:50%;object-fit:cover;display:grid;place-items:center;font:800 18px sans-serif;color:#fff;flex:none;opacity:.7}
.nav button span{max-width:0;overflow:hidden;white-space:nowrap;font-weight:700;font-size:15px;transition:.4s}
.nav button.on{background:#fff;color:#111}.nav button.on span{max-width:150px;padding:0 18px 0 6px}.nav button.on .ico,.nav button.on .ico-fallback{opacity:1}
.nav button:hover .ico,.nav button:hover .ico-fallback{opacity:1}
.mode{position:fixed;left:4vw;bottom:30px;font:600 13px "SF Mono",monospace;opacity:.7;z-index:6}
@media(max-width:900px){.mid{grid-template-columns:1fr;grid-template-rows:auto;overflow:auto}.ph{display:none}.col.l{text-align:left}.nav{max-width:96vw;overflow-x:auto}}
</style>
</head>
<body>
<div class="brand">ideaapps<small>Marcin Polak · iOS · tvOS · AI</small></div>
<canvas id="cv"></canvas>
<main class="stage"><div class="mid"><div class="col l" id="cl"></div><div id="ph"></div><div class="col" id="cr"></div></div><div class="nav" id="nav"></div></main>
<div class="mode" id="mode"></div>
<script src="data.js"></script><script src="fx.js"></script><script src="ui.js"></script>
<script>
const {projects}=IDEA;
const $=s=>document.querySelector(s);
const au=IDEA.fx.aurora();
const cv=$('#cv'),ctx=cv.getContext('2d');let W,H,dpr=Math.min(2,devicePixelRatio||1);
function rs(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}rs();addEventListener('resize',rs);
const kinds=['Klocki','Pył','Trójkąty','Kreski','Ramki','Fale','Konfetti','Bąbelki'];
$('#nav').innerHTML=projects.map((p,i)=>`<button data-i="${i}">${IDEA.iconHTML(p,'')}<span>${p.name}</span></button>`).join('');
let cur=-1,pal=null,parts=[],kind=0;
const rnd=(a,b)=>a+Math.random()*(b-a);
function spawn(k,fromTop){const c=[pal.b,pal.e,pal.a,'#fff'][Math.floor(Math.random()*4)];
 const p={k,c,x:rnd(0,W),y:rnd(0,H),a:0,life:0,rot:rnd(0,6.28),vr:rnd(-.02,.02),s:rnd(8,28),vx:0,vy:0,ph:rnd(0,6.28)};
 if(k===0){p.vy=rnd(.3,.9);p.s=rnd(14,40);if(fromTop)p.y=-50}
 if(k===1){p.s=rnd(1.5,4);p.vy=rnd(-.5,-.15);p.vx=rnd(-.15,.15);if(fromTop)p.y=H+10}
 if(k===2){p.s=rnd(14,36);p.vx=rnd(.2,.7);p.vy=rnd(.15,.5);p.vr=rnd(-.03,.03);if(fromTop){p.x=-40;p.y=rnd(0,H)}}
 if(k===3){p.s=rnd(40,140);p.vy=rnd(-1.6,-.6);if(fromTop)p.y=H+150}
 if(k===4){p.s=rnd(20,60);p.vy=rnd(-.4,-.1);p.vx=rnd(-.2,.2);p.vr=rnd(-.01,.01);if(fromTop)p.y=H+60}
 if(k===5){p.s=0;p.x=rnd(W*.1,W*.9);p.y=rnd(H*.2,H*.8);p.vx=rnd(.8,1.6)}
 if(k===6){p.s=rnd(7,14);p.vy=rnd(.8,2);p.vr=rnd(-.15,.15);if(fromTop)p.y=-20}
 if(k===7){p.s=rnd(8,30);p.vy=rnd(-1.2,-.4);if(fromTop)p.y=H+40}
 return p}
function draw(p,al){ctx.save();ctx.globalAlpha=al;ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=ctx.strokeStyle=p.c;
 switch(p.k){
  case 0:ctx.globalAlpha=al*.55;ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s);break;
  case 1:ctx.beginPath();ctx.arc(0,0,p.s,0,7);ctx.fill();break;
  case 2:ctx.globalAlpha=al*.55;ctx.beginPath();ctx.moveTo(0,-p.s);ctx.lineTo(p.s*.9,p.s*.7);ctx.lineTo(-p.s*.9,p.s*.7);ctx.closePath();ctx.fill();break;
  case 3:ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(0,p.s);ctx.stroke();break;
  case 4:ctx.lineWidth=2;ctx.strokeRect(-p.s/2,-p.s/2,p.s,p.s);break;
  case 5:ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,p.s,0,7);ctx.stroke();break;
  case 6:ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);break;
  case 7:ctx.lineWidth=1.8;ctx.beginPath();ctx.arc(0,0,p.s,0,7);ctx.stroke();ctx.globalAlpha=al*.18;ctx.fill();break}
 ctx.restore()}
function step(){ctx.clearRect(0,0,W,H);
 const target=kind;
 // spawn up to count
 const live=parts.filter(p=>p.k===target&&!p.dead).length;
 if(live<(target===5?9:target===1?120:70)&&Math.random()<.5)parts.push(spawn(target,true));
 for(const p of parts){p.life++;
  const wrongKind=p.k!==target;if(wrongKind)p.fade=(p.fade||1)-.02;
  p.a=Math.min(1,p.life/40)*(wrongKind?Math.max(0,p.fade):1);
  p.ph+=.02;
  if(p.k===5){p.s+=1.5;p.a*=Math.max(0,1-p.s/300)}
  p.x+=p.vx+(p.k===0||p.k===6||p.k===7?Math.sin(p.ph)*.6:0);p.y+=p.vy;p.rot+=p.vr;
  if(p.k===5&&p.s>300)p.dead=true;
  if((p.y>H+80&&p.vy>0)||(p.y<-160&&p.vy<0)||p.x>W+60||p.x<-80)p.dead=true;
  if(wrongKind&&p.fade<=0)p.dead=true;
  if(!p.dead)draw(p,p.a)}
 parts=parts.filter(p=>!p.dead);
 requestAnimationFrame(step)}
step();
// init particles prefill
function select(i){if(i===cur)return;cur=i;const p=projects[i];pal=IDEA.fx.pal(p.color);au.set(p.color);kind=i%kinds.length;
 // recolor existing right kind
 parts.forEach(q=>{if(q.k===kind)q.c=[pal.b,pal.e,pal.a,'#fff'][Math.floor(Math.random()*4)]});
 for(let k=0;k<30;k++)parts.push(spawn(kind,false));
 document.querySelectorAll('.nav button').forEach((b,k)=>b.classList.toggle('on',k===i));
 $('#ph').innerHTML=`<div class="ph">${p.shot&&p.id!=='boxes'?`<img src="${p.shot}" alt="">`:`<div class="fb" style="background:linear-gradient(160deg,${p.color},color-mix(in srgb,${p.color} 50%,#000))">${p.name[0]}</div>`}</div>`;
 $('#cl').innerHTML=`<div class="ani"><small>${p.cat}</small><h1>${p.name}</h1><div class="t">${p.tag}</div></div>`;
 $('#cr').innerHTML=`<div class="ani" style="animation-delay:.1s"><small>Co potrafi</small><ul class="f" style="margin-top:8px">${(p.feats||[]).slice(0,3).map(f=>`<li>${f.split(/[,.]/)[0]}</li>`).join('')}</ul><div class="w">Dla: ${p.who}</div><button class="btn" id="more">Szczegóły →</button></div>`;
 $('#more').onclick=()=>IDEA.ui.app(p);
 $('#mode').textContent=`tło: ${kinds[kind].toLowerCase()} · ${String(i+1).padStart(2,'0')}/${String(projects.length).padStart(2,'0')}`}
$('#nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)select(+b.dataset.i)});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')select((cur+1)%projects.length);if(e.key==='ArrowLeft')select((cur-1+projects.length)%projects.length)});
IDEA.ui.bar(null,'top');select(0);
</script>
</body>
</html>
