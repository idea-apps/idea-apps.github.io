<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Pastel (koncept 88)</title>
<link rel="stylesheet" href="l.css">
<style>
html,body{height:100%}
body{overflow:hidden}
#wash{position:fixed;inset:0;z-index:0;clip-path:circle(150% at 50% 50%)}
.lay{position:fixed;inset:0;z-index:0}
.stage{position:fixed;inset:0;z-index:5;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);align-items:center;padding:90px 4vw 130px}
.nm{font:400 clamp(90px,17vw,300px)/.84 var(--serif);letter-spacing:-.05em;position:relative;margin-left:-.03em}
.nm span{display:inline-block;transform:translateY(40px);opacity:0;animation:up .8s cubic-bezier(.2,.9,.2,1) forwards;animation-delay:calc(var(--i)*45ms)}
@keyframes up{to{transform:none;opacity:1}}
.cat{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tg{font:400 clamp(24px,2.8vw,42px)/1.12 var(--serif);letter-spacing:-.015em;max-width:15em;margin:12px 0 20px}
.fts{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.vis{position:relative;height:100%;display:grid;place-items:center}
.vis .shot{height:min(66vh,640px);aspect-ratio:9/19.5;object-fit:cover;object-position:top;transform:rotate(var(--r,3deg)) translate(var(--px,0),var(--py,0));transition:transform .4s ease-out;animation:sin .9s cubic-bezier(.2,.9,.2,1)}
@keyframes sin{from{opacity:0;translate:0 60px}}
.vis .blob{position:absolute;width:62%;aspect-ratio:1;border-radius:46% 54% 58% 42%/48% 42% 58% 52%;background:var(--b);opacity:.9;animation:mo 14s ease-in-out infinite alternate;z-index:-1}
@keyframes mo{to{border-radius:60% 40% 38% 62%/44% 58% 42% 56%;transform:rotate(40deg) scale(1.08)}}
.vis .ic{position:absolute;right:6%;bottom:12%;width:92px;height:92px;border-radius:24%;object-fit:cover;display:grid;place-items:center;font:800 40px sans-serif;color:#fff;box-shadow:0 22px 40px -12px rgba(0,0,0,.4);rotate:-8deg}
.dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;display:flex;gap:6px;padding:7px;background:rgba(255,255,255,.85);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:99px;box-shadow:0 20px 40px -20px rgba(0,0,0,.3);max-width:94vw;overflow-x:auto}
.dock button{all:unset;cursor:pointer;display:flex;align-items:center;height:46px;border-radius:99px;overflow:hidden;transition:.4s cubic-bezier(.3,.9,.3,1)}
.dock .ico,.dock .ico-fallback{width:46px;height:46px;border-radius:50%;object-fit:cover;display:grid;place-items:center;font:800 18px sans-serif;color:#fff;flex:none}
.dock button span{max-width:0;overflow:hidden;white-space:nowrap;font-weight:700;font-size:15px;transition:.4s}
.dock button.on{background:var(--ink);color:#fff}.dock button.on span{max-width:150px;padding:0 18px 0 8px}
.dock button:not(.on){opacity:.75}.dock button:hover{opacity:1}
.cnt{position:fixed;right:4vw;bottom:36px;z-index:10;font:600 14px "SF Mono",monospace;color:var(--mute)}
@media(max-width:900px){.stage{grid-template-columns:1fr;padding:90px 6vw 120px;align-content:center;overflow:auto}.vis{display:none}.nm{font-size:22vw}.cnt{display:none}}
</style></head><body>
<div class="lay"><div id="wash"></div></div>
<div id="base" class="lay" style="background:#fbfaf7"></div>
<main class="stage"><div><div class="cat" id="cat"></div><h1 class="nm" id="nm"></h1><p class="tg" id="tg"></p><div class="fts" id="fts"></div><div class="row" id="row"></div></div><div class="vis" id="vis"></div></main>
<div class="dock" id="dock"></div><div class="cnt" id="cnt"></div>
<script src="data.js"></script><script src="flow.js"></script><script src="ui.js"></script><script src="l.js"></script>
<script>
const {projects,L}=IDEA,$=s=>document.querySelector(s);
const bg=p=>L.tint(p.color,24),bl=p=>L.tint(p.color,55);
$('#dock').innerHTML=projects.map((p,i)=>`<button data-i="${i}">${IDEA.iconHTML(p,'')}<span>${p.name}</span></button>`).join('');
let cur=-1,busy=false;
const w=$('#wash'),base=$('#base');
function fill(i){const p=projects[i];cur=i;
 $('#cat').innerHTML=`<span class="chip" style="--c:${p.color}"><i></i>${p.cat}</span><span class="chip">${p.platforms}</span>`;
 $('#nm').innerHTML=[...p.name].map((c,k)=>`<span style="--i:${k}">${c===' '?'&nbsp;':c}</span>`).join('');
 $('#tg').textContent=p.tag+'.';
 $('#fts').innerHTML=(p.feats||[]).slice(0,3).map(f=>`<span class="chip">${f.split(/[,.]/)[0]}</span>`).join('');
 $('#row').innerHTML=`<button class="btn" id="more">Szczegóły →</button><a class="btn o" href="${p.url}" target="_blank" rel="noopener">App Store ↗</a>`;
 $('#more').onclick=()=>IDEA.ui.app(p);
 $('#vis').innerHTML=`<div class="blob" style="--b:${bl(p)}"></div>${p.shot?`<img class="shot" src="${p.shot}" alt="">`:`<div class="shot" style="background:${p.color};display:grid;place-items:center;font:400 160px var(--serif);color:#fff;height:min(66vh,640px);aspect-ratio:9/19.5">${p.name[0]}</div>`}<div class="ic" style="background:${p.icon?'transparent':p.color}">${p.icon?`<img src="${p.icon}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:24%">`:p.name[0]}</div>`;
 document.querySelectorAll('.dock button').forEach((b,k)=>b.classList.toggle('on',k===i));
 $('#cnt').textContent=`${String(i+1).padStart(2,'0')} / ${String(projects.length).padStart(2,'0')}`}
function go(i,x,y){if(busy||i===cur)return;busy=true;const p=projects[i];
 w.style.transition='none';w.style.background=bg(p);w.style.clipPath=`circle(0px at ${x}px ${y}px)`;w.getBoundingClientRect();
 w.style.transition='clip-path 1s cubic-bezier(.65,0,.2,1)';w.style.clipPath=`circle(${Math.hypot(innerWidth,innerHeight)*1.1}px at ${x}px ${y}px)`;
 setTimeout(()=>fill(i),420);
 setTimeout(()=>{base.style.background=bg(p);w.style.transition='none';w.style.clipPath='circle(0px at 50% 50%)';busy=false},1050)}
$('#dock').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const r=b.getBoundingClientRect();go(+b.dataset.i,r.left+r.width/2,r.top+r.height/2)});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go((cur+1)%projects.length,innerWidth,innerHeight/2);if(e.key==='ArrowLeft')go((cur-1+projects.length)%projects.length,0,innerHeight/2)});
addEventListener('pointermove',e=>{const s=document.querySelector('.vis .shot');if(!s)return;s.style.setProperty('--px',((e.clientX/innerWidth-.5)*-26)+'px');s.style.setProperty('--py',((e.clientY/innerHeight-.5)*-18)+'px')});
base.style.background=bg(projects[0]);fill(0);
</script></body></html>
