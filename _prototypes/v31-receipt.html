<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Paragon (wariant 31)</title>
<style>
:root{--paper:#fdfcf8;--ink:#1d1d1b}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;background:#cfd2d6;background-image:radial-gradient(#c3c6cb 1px,transparent 1.5px);background-size:14px 14px;color:var(--ink);font:15px/1.5 "Courier New","SF Mono",ui-monospace,monospace;display:flex;flex-direction:column;align-items:center;padding:0 12px 80px;-webkit-font-smoothing:antialiased}
a{color:inherit}
.printer{width:min(520px,100%);height:46px;background:linear-gradient(#4a4d55,#2c2e34);border-radius:0 0 14px 14px;position:relative;z-index:3;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:space-between;padding:0 20px;color:#9aa0ab;font:600 11px "SF Mono",monospace;letter-spacing:.14em}
.printer i{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80;display:inline-block;margin-right:8px}
.slot{width:min(500px,calc(100% - 20px));height:8px;background:#0e0f12;border-radius:0 0 6px 6px;position:relative;z-index:2}
.rc{width:min(440px,calc(100% - 40px));background:var(--paper);position:relative;margin-top:-2px;padding:30px 28px 46px;box-shadow:0 20px 40px -20px rgba(0,0,0,.4);
 -webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%;
 background-image:repeating-linear-gradient(0deg,transparent 0 3px,rgba(0,0,0,.015) 3px 4px)}
.ln{opacity:0;transform:translateY(-6px);transition:.25s}
.ln.in{opacity:1;transform:none}
.c{text-align:center}.r{text-align:right}
.big{font-size:30px;font-weight:700;letter-spacing:.04em;line-height:1}
.sm{font-size:12.5px;color:#58564f}
.dash{border-top:2px dashed var(--ink);margin:12px 0}
.it{display:flex;gap:8px;align-items:baseline;padding:3px 0;text-decoration:none}
.it .n{flex:none;font-weight:700}
.it .dots{flex:1;border-bottom:2px dotted #8b8982;transform:translateY(-4px);min-width:12px}
.it .v{flex:none;font-size:13px}
a.it:hover{background:var(--ink);color:var(--paper);margin:0 -6px;padding:3px 6px}
a.it:hover .dots{border-color:#888}
.sub{font-size:12px;color:#6a6860;margin:-2px 0 6px 0;padding-left:0}
a.it:hover + .sub{color:#555}
.h{font-weight:700;letter-spacing:.1em;margin:6px 0 4px}
.tot{display:flex;justify-content:space-between;font-size:21px;font-weight:700;margin:4px 0}
.bar{height:62px;margin:16px auto 6px;width:80%;background:repeating-linear-gradient(90deg,#111 0 2px,transparent 2px 4px,#111 4px 5px,transparent 5px 8px,#111 8px 11px,transparent 11px 12px,#111 12px 13px,transparent 13px 17px)}
.mail{display:block;font-weight:700;font-size:16px;word-break:break-all;border:2px solid var(--ink);padding:8px;text-align:center;text-decoration:none;margin:8px 0}
.mail:hover{background:var(--ink);color:var(--paper)}
.stamp{position:absolute;right:20px;top:230px;border:3px solid #c0392b;color:#c0392b;font:700 20px "Courier New";padding:4px 12px;transform:rotate(-12deg);opacity:0;letter-spacing:.08em}
.stamp.in{opacity:.85;animation:st .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes st{from{transform:rotate(-12deg) scale(2.2);opacity:0}}
.skip{margin-top:26px;font:13px "SF Mono",monospace;color:#555}
.skip button{all:unset;cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<div class="printer"><span><i></i>IDEAAPPS PRINT</span><span>MODEL 10+</span></div><div class="slot"></div>
<div class="rc" id="rc"></div>
<div class="skip"><button id="skip">pomiń animację ↓</button> · <button id="again">drukuj ponownie ↻</button></div>
<script src="data.js"></script>
<script>
const {projects,services,email}=IDEA;
const now=new Date();
const dt=now.toLocaleDateString('pl',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+now.toLocaleTimeString('pl',{hour:'2-digit',minute:'2-digit'});
const L=[];
const add=(h,cls='')=>L.push(`<div class="ln ${cls}">${h}</div>`);
add('<div class="c big">IDEAAPPS</div>');
add('<div class="c sm">Marcin Polak<br>iOS · tvOS · AI developer<br>Dziesięć lat doświadczenia</div>');
add('<div class="dash"></div>');
add(`<div class="sm">PARAGON NR 0001<br>${dt}<br>Kasjer: Marcin</div>`);
add('<div class="dash"></div>');
add('<div class="h">APLIKACJE W APP STORE</div>');
projects.forEach((p,i)=>{add(`<a class="it" href="${p.url}" target="_blank" rel="noopener"><span class="n">${(i+1)}x ${p.name.toUpperCase()}</span><span class="dots"></span><span class="v">POBIERZ ↗</span></a><div class="sub">${p.tag}</div>`)});
add('<div class="dash"></div>');
add('<div class="h">USŁUGI</div>');
services.forEach(s=>add(`<div class="it"><span class="n">${s.t.toUpperCase()}</span><span class="dots"></span><span class="v">DO WYCENY</span></div><div class="sub">${s.d}</div>`));
add('<div class="dash"></div>');
add('<div class="tot"><span>RAZEM</span><span>8 APEK</span></div>');
add('<div class="tot" style="font-size:16px"><span>DO ZAPŁATY</span><span>TWÓJ POMYSŁ</span></div>');
add('<div class="dash"></div>');
add('<div class="sm">Forma płatności: rozmowa.<br>Gwarancja: dobra współpraca.<br>Paragon nie zastępuje umowy. :)</div>');
add('<div class="bar"></div>');
add('<div class="c sm">* * * DZIĘKUJĘ ZA ZAKUPY * * *<br>Zapraszam ponownie z nowym pomysłem</div>');
add(`<a class="mail" href="mailto:${email}">${email}</a>`);
add('<div class="c sm">www.ideaapps.io</div>');
const rc=document.getElementById('rc');
rc.innerHTML=L.join('')+'<div class="stamp" id="stamp">ZAPŁACONO</div>';
const lines=[...rc.querySelectorAll('.ln')];let timer=null;
function print(fast){clearTimeout(timer);lines.forEach(l=>l.classList.remove('in'));document.getElementById('stamp').classList.remove('in');
 let i=0;const step=()=>{if(i<lines.length){lines[i].classList.add('in');if(i>2)lines[i].scrollIntoView({block:'center',behavior:'smooth'});i++;timer=setTimeout(step,fast?0:(i<6?260:170))}else{document.getElementById('stamp').classList.add('in')}};step()}
document.getElementById('skip').onclick=()=>{clearTimeout(timer);lines.forEach(l=>l.classList.add('in'));document.getElementById('stamp').classList.add('in');scrollTo({top:0,behavior:'smooth'})};
document.getElementById('again').onclick=()=>{scrollTo(0,0);print()};
print();
</script>
</body>
</html>
