<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Pytania (koncept 85)</title>
<link rel="stylesheet" href="c.css">
<style>
body{min-height:100vh;overflow-x:hidden}
.w{position:relative;z-index:5;max-width:1300px;margin:0 auto;padding:90px 5vw 70px;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:5vw;min-height:100vh;align-items:center}
.tag{color:#fff;opacity:.8}
h1{font-size:clamp(36px,5.2vw,76px);line-height:.92;letter-spacing:-.06em;font-weight:900;margin:8px 0 16px}
.qs{display:flex;flex-direction:column}
.q{all:unset;cursor:pointer;display:flex;gap:16px;align-items:baseline;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.2);font-size:clamp(19px,2vw,27px);font-weight:800;letter-spacing:-.03em;line-height:1.15;color:rgba(255,255,255,.55);transition:.35s}
.q i{font:600 13px "SF Mono",monospace;font-style:normal;opacity:.7;flex:none;width:26px}
.q:hover{color:#fff}.q.on{color:#fff;padding-left:14px}
.ans{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:30px;padding:30px 32px;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);min-height:380px;box-shadow:0 40px 80px -30px rgba(0,0,0,.5)}
.ans.sw{animation:in .6s cubic-bezier(.2,.9,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(18px)}}
.ans h2{font-size:clamp(26px,3.2vw,42px);letter-spacing:-.05em;line-height:1.02;font-weight:900;margin:6px 0 14px}
.ans p{font-size:18px;line-height:1.5;opacity:.95;margin-bottom:12px}
.ans .k{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.ans .k span{font-size:14px;font-weight:700;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3)}
.ans .nx{margin-top:22px}
.note{font-size:13px;opacity:.65;margin-top:14px}
@media(max-width:960px){.w{grid-template-columns:1fr;padding-top:80px}}
</style></head><body>
<div class="brand">ideaapps<small>Marcin Polak · iOS · tvOS · AI</small></div>
<main class="w"><div><span class="tag">Pytania, które słyszę</span><h1>Co z tym AI, naprawdę?</h1><div class="qs" id="qs"></div></div>
<div><div class="ans" id="ans"></div><div class="note">Szkic odpowiedzi do uzupełnienia przez autora.</div></div></main>
<script src="data.js"></script><script src="flow.js"></script><script src="fx.js"></script><script src="ui.js"></script>
<script>
const {flow}=IDEA,$=s=>document.querySelector(s);
const au=IDEA.fx.aurora();
const Q=[
 {q:'Czy AI napisze mi całą aplikację?',c:'#8a7bff',a:['AI przyspiesza, ale nie decyduje. Agent pisze ekrany, testy i warianty, a ja projektuję architekturę, czytam każdą zmianę i odpowiadam za efekt.','Dzięki temu dostajesz tempo AI i odpowiedzialność doświadczonego developera.'],k:['Szybciej','Pod nadzorem','Bez utraty jakości']},
 {q:'Kto odpowiada za jakość kodu?',c:'#4da3ff',a:['Ja. Każda zmiana przechodzi przeze mnie, zanim trafi do produktu. Agent to narzędzie, tak jak kompilator czy IDE.','Kod trzymam czysty i czytelny, żeby dało się go rozwijać także beze mnie.'],k:['Review każdej zmiany','Testy automatyczne','Czytelny kod']},
 {q:'Czy kod i pomysł będą moje?',c:'#34d17a',a:['Tak. Kod trafia do Twojego repozytorium, a prawa do aplikacji ustalamy w umowie na początku.','Nie zostajesz zależny ode mnie ani od narzędzi, których używam.'],k:['Twoje repozytorium','Jasna umowa','Bez uzależnienia']},
 {q:'Ile to trwa i kiedy zobaczę efekt?',c:'#f5a524',a:['Pierwszy działający prototyp pojawia się w kilka dni, a nie na końcu projektu. Kolejne wersje dostajesz co tydzień przez TestFlight.','Dokładny harmonogram zależy od zakresu i ustalamy go po rozmowie.'],k:['Prototyp w dni','Wersja co tydzień','Plan po rozmowie']},
 {q:'Jak będę widział postęp?',c:'#2dd4bf',a:['Na własnym telefonie. Każda iteracja to nowa wersja w TestFlight, którą możesz wziąć do ręki i skomentować.','Zamiast raportów i slajdów dostajesz działający produkt.'],k:['TestFlight','Bez raportów','Zmiana kierunku w locie']},
 {q:'Co z bezpieczeństwem i prywatnością danych?',c:'#ff6b9a',a:['Dbam o to od początku: minimalne dane, jasna polityka prywatności, zgodność z wymogami Apple. Tam, gdzie się da, modele AI działają na urządzeniu, prywatnie i offline.','Do narzędzi AI nie wysyłam danych Twoich użytkowników.'],k:['Dane na urządzeniu','Polityka prywatności','Zgodność z Apple']},
 {q:'A jeśli mam już aplikację?',c:'#ffcf3a',a:['Zaczynam od przeglądu kodu: architektura, wydajność, dług techniczny, zgodność z nowymi wersjami iOS. Dostajesz uczciwą ocenę: poprawiać, przepisać fragment czy zostawić.','Pracuję także na cudzym kodzie.'],k:['Audyt','Plan zmian','Małe kroki']},
 {q:'Dlaczego jedna osoba, a nie agencja?',c:'#ff8a4d',a:['Rozmawiasz bezpośrednio z osobą, która pisze kod. Nie ma głuchego telefonu, narzutu zespołu ani przekazywania wiedzy między ludźmi.','Z AI jedna doświadczona osoba dostarcza tempo, które kiedyś wymagało zespołu.'],k:['Jeden kontakt','Brak narzutu','10+ lat iOS i tvOS']}];
$('#qs').innerHTML=Q.map((x,i)=>`<button class="q" data-i="${i}"><i>${String(i+1).padStart(2,'0')}</i>${x.q}</button>`).join('');
let cur=-1;
function pick(i){if(i===cur)return;cur=i;const x=Q[i];au.set(x.c);document.querySelectorAll('.q').forEach((b,k)=>b.classList.toggle('on',k===i));
 const a=$('#ans');a.classList.remove('sw');void a.offsetWidth;a.classList.add('sw');
 a.innerHTML=`<span class="tag">Pytanie ${i+1} z ${Q.length}</span><h2>${x.q}</h2>${x.a.map(t=>`<p>${t}</p>`).join('')}<div class="k">${x.k.map(k=>`<span>${k}</span>`).join('')}</div><div class="nx"><button class="btn" id="how">Zobacz, jak pracuję →</button></div>`;
 $('#how').onclick=()=>IDEA.ui.panel('process')}
$('#qs').onclick=e=>{const b=e.target.closest('.q');if(b)pick(+b.dataset.i)};
addEventListener('keydown',e=>{if(e.key==='ArrowDown')pick((cur+1)%Q.length);if(e.key==='ArrowUp')pick((cur-1+Q.length)%Q.length)});
IDEA.ui.bar(null,'top');pick(0);
</script></body></html>
