<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — tvOS (wariant 19)</title>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:#0a0a0c;color:#fff;font:400 20px/1.35 -apple-system,"SF Pro Display",Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
#bg{position:fixed;inset:-10%;z-index:0;background:radial-gradient(70% 80% at 70% 20%,var(--g,#3a3a52),transparent 70%),radial-gradient(60% 70% at 0% 100%,var(--g2,#222238),transparent 70%),#0a0a0c;transition:--g .6s;filter:blur(20px)}
#bg::after{content:"";position:absolute;inset:0;backdrop-filter:blur(30px)}
.ui{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;padding:34px 5vw 28px}
.bar{display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:22px;opacity:.9}
.bar nav{display:flex;gap:34px;font-size:20px}
.bar nav span{opacity:.55;cursor:pointer;padding-bottom:4px;border-bottom:3px solid transparent}
.bar nav span.on{opacity:1;border-color:#fff}
.shelf{flex:1;display:grid;grid-template-columns:1.1fr 1fr;align-items:center;gap:4vw;min-height:0}
.shelf .t small{font-size:16px;letter-spacing:.14em;text-transform:uppercase;opacity:.7;display:block;margin-bottom:12px}
.shelf h1{font-size:clamp(52px,7.5vw,116px);line-height:.92;letter-spacing:-.05em;font-weight:800;margin-bottom:20px;transition:.3s}
.shelf p{max-width:26em;font-size:clamp(18px,1.6vw,26px);opacity:.82;margin-bottom:24px;min-height:3.9em}
.shelf .hint{display:inline-flex;gap:10px;align-items:center;font-size:17px;opacity:.9}
.shelf .hint b{border:2px solid #fff6;border-radius:8px;padding:2px 12px;font-size:15px}
.shelf .art{height:100%;max-height:48vh;display:grid;place-items:center;transition:.4s}
.shelf .art img.s{height:100%;max-height:48vh;aspect-ratio:9/19;object-fit:cover;object-position:top;border-radius:30px;box-shadow:0 40px 90px rgba(0,0,0,.6);transform:perspective(900px) rotateY(-14deg) rotateX(3deg)}
.shelf .art .big{font:900 clamp(120px,20vw,300px)/1 sans-serif;letter-spacing:-.08em;opacity:.9}
.rows{flex:none}
.row{margin-top:18px}
.row h3{font-size:20px;font-weight:600;opacity:.65;margin:0 0 12px 10px}
.rail{display:flex;gap:2.2vw;padding:26px 10px 34px;overflow-x:auto;overflow-y:visible;align-items:flex-start;scrollbar-width:none}
.tile{flex:none;width:clamp(150px,15.5vw,270px);perspective:700px}
.tile .face{aspect-ratio:16/10;border-radius:18px;background:var(--c);position:relative;overflow:hidden;display:grid;place-items:center;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;transform-style:preserve-3d;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.tile .face .ico,.tile .face .ico-fallback{width:46%;aspect-ratio:1;height:auto;border-radius:22%;object-fit:cover;display:grid;place-items:center;font:800 54px sans-serif;color:#fff;box-shadow:0 12px 24px rgba(0,0,0,.35);transition:.25s}
.tile .face::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.35),transparent 45%);opacity:0;transition:.25s}
.tile.f .face{transform:scale(1.14) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));box-shadow:0 40px 60px -10px rgba(0,0,0,.65),0 0 0 4px rgba(255,255,255,.0)}
.tile.f .face::after{opacity:1}
.tile.f .face .ico,.tile.f .face .ico-fallback{transform:translateZ(40px) scale(1.06)}
.tile .nm{text-align:center;font-size:17px;margin-top:20px;opacity:0;transform:translateY(-6px);transition:.25s;font-weight:600}
.tile.f .nm{opacity:1;transform:none}
.tile.txt .face{background:rgba(255,255,255,.12);backdrop-filter:blur(20px);padding:14px 16px;place-items:center start;align-content:center;text-align:left;font-weight:700;font-size:clamp(14px,1.4vw,22px);line-height:1.15}
.tile.cta .face{background:#fff;color:#111;font-weight:800;font-size:clamp(14px,1.5vw,24px);text-align:center;padding:10px}
@media(max-width:800px){.shelf{grid-template-columns:1fr}.shelf .art{display:none}.bar nav{display:none}.tile{width:132px}}
</style>
</head>
<body>
<div id="bg"></div>
<div class="ui">
<div class="bar"><span>ideaapps</span><nav id="tabs"></nav><span id="clk"></span></div>
<div class="shelf"><div class="t"><small id="cat"></small><h1 id="h"></h1><p id="p"></p><div class="hint" id="hint"></div></div><div class="art" id="art"></div></div>
<div class="rows" id="rows"></div>
</div>
<script src="data.js"></script>
<script>
const {projects,services,email}=IDEA;
const rowsDef=[
 {n:'Moje aplikacje',items:projects.map(p=>({k:'app',p,name:p.name,color:p.color,cat:p.cat+' · '+p.platforms,title:p.name,text:p.tag+'. '+p.desc,url:p.url,hint:'Otwórz w App Store'}))},
 {n:'Usługi',items:services.map((s,i)=>({k:'txt',name:s.t,color:['#4d7cfe','#9b5cff','#ff6a9c','#2fbf8f'][i],cat:'Usługa 0'+(i+1),title:s.t,text:s.d,hint:''}))},
 {n:'Kontakt',items:[{k:'cta',name:'Napisz do mnie',color:'#ffb347',cat:'Kontakt',title:'Masz pomysł?',text:'Opisz w kilku zdaniach, co chcesz zbudować. Odpowiem i powiem uczciwie, jak to widzę. '+email,url:'mailto:'+email,hint:'Wyślij wiadomość'}]},
 {n:'O mnie',items:[{k:'txt',name:'10+ lat iOS i tvOS',color:'#44506a',cat:'Doświadczenie',title:'Marcin Polak',text:'Natywne aplikacje Apple od ponad dziesięciu lat. Wcześniej Android. Teraz też AI.',hint:''}]}
];
const rowsEl=document.getElementById('rows');
rowsEl.innerHTML=rowsDef.map((r,ri)=>`<div class="row" data-r="${ri}" ${ri>0&&ri<3?'':''}><h3>${r.n}</h3><div class="rail">${r.items.map((it,ci)=>`<div class="tile ${it.k==='app'?'':it.k}" data-r="${ri}" data-c="${ci}" style="--c:${it.color}"><div class="face">${it.k==='app'?IDEA.iconHTML(it.p,'ico'):it.name}</div><div class="nm">${it.name}</div></div>`).join('')}</div></div>`).join('');
document.getElementById('tabs').innerHTML=rowsDef.map((r,i)=>`<span data-r="${i}">${r.n}</span>`).join('');
let R=0,C=0;
const clamp=()=>{C=Math.max(0,Math.min(rowsDef[R].items.length-1,C))};
function render(){clamp();const it=rowsDef[R].items[C];
 document.querySelectorAll('.tile').forEach(t=>t.classList.toggle('f',+t.dataset.r===R&&+t.dataset.c===C));
 document.querySelectorAll('#tabs span').forEach(s=>s.classList.toggle('on',+s.dataset.r===R));
 const bg=document.getElementById('bg');bg.style.setProperty('--g',it.color+'cc');bg.style.setProperty('--g2',it.color+'55');
 bg.style.background=`radial-gradient(70% 80% at 70% 20%,${it.color}cc,transparent 70%),radial-gradient(60% 70% at 0% 100%,${it.color}55,transparent 70%),#0a0a0c`;
 document.getElementById('cat').textContent=it.cat;document.getElementById('h').textContent=it.title;document.getElementById('p').textContent=it.text;
 document.getElementById('hint').innerHTML=it.hint?`<b>Enter</b> ${it.hint}`:'';
 const p=it.p;document.getElementById('art').innerHTML=p&&p.shot&&p.id!=='boxes'?`<img class="s" src="${p.shot}" alt="">`:`<div class="big" style="color:${it.color}">${(p?p.name:it.name)[0]}</div>`;
 // hide rows above current
 document.querySelectorAll('.row').forEach(r=>r.style.display=(+r.dataset.r===R)?'':'none');
 const f=document.querySelector('.tile.f');f&&f.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'})}
addEventListener('keydown',e=>{const k=e.key;
 if(k==='ArrowRight')C++;else if(k==='ArrowLeft')C--;else if(k==='ArrowDown')R=Math.min(rowsDef.length-1,R+1);else if(k==='ArrowUp')R=Math.max(0,R-1);
 else if(k==='Enter'){act();return}else return;e.preventDefault();render()});
function act(){const it=rowsDef[R].items[C];if(it.url)window.open(it.url,it.url.startsWith('mailto')?'_self':'_blank')}
rowsEl.addEventListener('mouseover',e=>{const t=e.target.closest('.tile');if(!t)return;R=+t.dataset.r;C=+t.dataset.c;render()});
rowsEl.addEventListener('mousemove',e=>{const t=e.target.closest('.tile');if(!t)return;const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.querySelector('.face').style.setProperty('--ry',x*14+'deg');t.querySelector('.face').style.setProperty('--rx',-y*14+'deg')});
rowsEl.addEventListener('click',e=>{const t=e.target.closest('.tile');if(t){R=+t.dataset.r;C=+t.dataset.c;render();act()}});
document.getElementById('tabs').onclick=e=>{const s=e.target.closest('span');if(s){R=+s.dataset.r;C=0;render()}};
const tick=()=>document.getElementById('clk').textContent=new Date().toLocaleTimeString('pl',{hour:'2-digit',minute:'2-digit'});tick();setInterval(tick,20000);
render();
</script>
</body>
</html>
