<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ideaapps — Ekran główny (wariant 26)</title>
<style>
:root{--ink:#14151a;--soft:#6b6e78}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,sans-serif;background:#e9e7e1;color:var(--ink);min-height:100vh;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:40px;padding:30px;-webkit-font-smoothing:antialiased;overflow:hidden}
.intro{justify-self:end;max-width:400px;text-align:right}
.intro small{font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);font-size:12px}
.intro h1{font-size:clamp(34px,4vw,58px);line-height:.98;letter-spacing:-.05em;font-weight:800;margin:10px 0 16px}
.intro p{color:#4a4c55}
.hint{justify-self:start;max-width:260px;color:var(--soft);font-size:15px}
.hint b{display:block;color:var(--ink);font-size:20px;letter-spacing:-.02em;margin-bottom:6px}
.phone{--w:min(390px,calc((100vh - 60px)*.462));width:var(--w);aspect-ratio:390/844;border-radius:calc(var(--w)*.14);background:#0a0a0c;padding:calc(var(--w)*.028);box-shadow:0 0 0 2px #2a2a30,0 50px 100px -30px rgba(20,20,40,.55);position:relative;font-size:calc(var(--w)/390*16px)}
.scr{position:absolute;inset:calc(var(--w)*.028);border-radius:calc(var(--w)*.115);overflow:hidden;background:linear-gradient(170deg,#1b2b4b 0%,#3a2d6b 38%,#d4607a 78%,#ffb36b 100%);color:#fff}
.scr::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 40% at 80% 10%,rgba(255,255,255,.25),transparent 70%),radial-gradient(50% 40% at 10% 90%,rgba(255,200,120,.35),transparent 70%)}
.isl{position:absolute;top:2.2%;left:50%;width:27%;height:4.1%;margin-left:-13.5%;background:#000;border-radius:99px;z-index:50}
.sb{position:absolute;top:2.6%;left:0;right:0;display:flex;justify-content:space-between;padding:0 9%;font-weight:700;font-size:.82em;z-index:49}
.home{position:absolute;inset:0;padding:15% 6.5% 0;z-index:2;transition:transform .45s cubic-bezier(.3,.9,.3,1),filter .45s;transform-origin:50% 50%}
.home.back{transform:scale(.92);filter:blur(6px) brightness(.8)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1.55em .5em}
.ap{display:flex;flex-direction:column;align-items:center;gap:.4em;cursor:pointer;font-size:.74em;font-weight:500;text-shadow:0 1px 4px rgba(0,0,0,.4);transition:transform .15s}
.ap:active{transform:scale(.9)}
.ap .ico,.ap .ico-fallback,.ap .sys{width:4.3em;aspect-ratio:1;border-radius:23%;object-fit:cover;display:grid;place-items:center;font:700 2em sans-serif;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.ap .sys{font-size:1.8em}
.widget{grid-column:1/-1;background:rgba(255,255,255,.22);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-radius:1.7em;padding:1em 1.2em;margin-bottom:.3em;border:1px solid rgba(255,255,255,.3)}
.widget small{font-size:.74em;font-weight:700;opacity:.8;text-transform:uppercase;letter-spacing:.06em}
.widget b{display:block;font-size:1.6em;letter-spacing:-.03em;line-height:1.1;margin:.15em 0}
.widget span{font-size:.85em;opacity:.9}
.dock{position:absolute;left:4%;right:4%;bottom:3.2%;height:12.5%;background:rgba(255,255,255,.22);backdrop-filter:blur(26px);-webkit-backdrop-filter:blur(26px);border-radius:2.2em;display:flex;justify-content:space-around;align-items:center;padding:0 3%;z-index:3;border:1px solid rgba(255,255,255,.25);transition:.45s}
.dock.back{transform:translateY(40%);opacity:0}
.dock .ap{font-size:1em}
.dock .ap .sys{width:3.4em;font-size:1.5em}
.dots{position:absolute;bottom:17.5%;left:0;right:0;display:flex;justify-content:center;gap:.5em;z-index:3}
.dots i{width:.5em;height:.5em;border-radius:50%;background:rgba(255,255,255,.4)}.dots i:first-child{background:#fff}
.app{position:absolute;inset:0;z-index:20;background:#fff;color:var(--ink);transform:scale(.12);opacity:0;pointer-events:none;border-radius:3em;transition:transform .5s cubic-bezier(.3,.85,.25,1),opacity .25s,border-radius .5s;overflow:hidden;display:flex;flex-direction:column}
.app.on{transform:none;opacity:1;pointer-events:auto;border-radius:0}
.app .hd{padding:13% 7% 6%;background:var(--c);color:#fff;position:relative}
.app .hd .ico,.app .hd .ico-fallback{width:4.6em;aspect-ratio:1;border-radius:23%;object-fit:cover;display:grid;place-items:center;font:700 2.2em sans-serif;box-shadow:0 8px 20px rgba(0,0,0,.25);margin-bottom:.7em}
.app .hd h2{font-size:2.1em;letter-spacing:-.04em;line-height:1}
.app .hd p{opacity:.92;margin-top:.25em;font-size:.95em}
.app .bd{flex:1;overflow:auto;padding:5% 7% 20%}
.app .bd p{margin-bottom:.8em;font-size:.95em;color:#3a3c44}
.shots{display:flex;gap:.7em;overflow-x:auto;margin:0 -7% .9em;padding:0 7%;scrollbar-width:none}
.shots img{height:20em;border-radius:1.4em;box-shadow:0 0 0 1px rgba(0,0,0,.12);flex:none}
.meta{display:flex;gap:1.4em;font-size:.82em;color:var(--soft);margin-bottom:1em}.meta b{display:block;color:var(--ink);font-size:1.15em}
.get{display:block;text-align:center;background:var(--c);color:#fff;padding:.85em;border-radius:99px;font-weight:700;text-decoration:none;margin-top:.6em}
.hb{position:absolute;bottom:1.3%;left:50%;width:34%;height:.4em;margin-left:-17%;border-radius:9px;background:rgba(255,255,255,.85);z-index:60;cursor:pointer;padding:0}
.hb.dk{background:#111}
.svl div{padding:.9em 0;border-bottom:1px solid #eee}.svl b{display:block;font-size:1.05em}.svl span{color:var(--soft);font-size:.9em}
@media(max-width:900px){body{display:block;padding:0}.intro,.hint{display:none}.phone{--w:100vw;width:100vw;height:100dvh;aspect-ratio:auto;border-radius:0;padding:0;box-shadow:none;font-size:calc(min(100vw,460px)/390*16px)}.scr{inset:0;border-radius:0}}
</style>
</head>
<body>
<div class="intro"><small>ideaapps · Marcin Polak</small><h1>Mój ekran główny.</h1><p>Osiem aplikacji, które zrobiłem sam. Ponad 10 lat iOS i tvOS. Dotknij ikony i zobacz, jak działa.</p></div>
<div class="phone"><div class="scr" id="scr"><div class="isl"></div><div class="sb"><span id="clk">9:41</span><span>●●● 5G ▮</span></div>
<div class="home" id="home"><div class="grid" id="grid"></div></div>
<div class="dots"><i></i><i></i></div>
<div class="dock" id="dock"></div>
<div id="apps"></div>
<button class="hb" id="hb" aria-label="Ekran główny"></button></div></div>
<div class="hint"><b>Zbuduję taką aplikację dla Ciebie.</b>Kliknij Mail na dole, żeby napisać do mnie.</div>
<script src="data.js"></script>
<script>
const {projects,services,email}=IDEA;
const $=s=>document.querySelector(s);
const sys=(id,bg,glyph,name)=>`<div class="ap" data-id="${id}"><div class="sys" style="background:${bg}">${glyph}</div><span>${name}</span></div>`;
$('#grid').innerHTML=`<div class="widget"><small>ideaapps</small><b>Aplikacje na iOS i tvOS</b><span>10+ lat · 8 apek w App Store</span></div>`
 +projects.map(p=>`<div class="ap" data-id="${p.id}">${IDEA.iconHTML(p,'')}<span>${p.name}</span></div>`).join('')
 +sys('about','linear-gradient(#ffe066,#f5b800)','✎','O mnie')+sys('uslugi','linear-gradient(#9aa0ab,#5d626d)','⚙','Usługi');
$('#dock').innerHTML=sys('kontakt','linear-gradient(#4aa8ff,#1478f0)','✉','Kontakt')+sys('about','linear-gradient(#5ee07a,#1fb04a)','☎','Zadzwoń')+sys('uslugi','linear-gradient(#ff7a7a,#e5383b)','♥','Usługi')+sys('about','linear-gradient(#ffd166,#f08a00)','☀','O mnie');
const views={};
projects.forEach(p=>views[p.id]={c:p.color,html:`<div class="hd" style="--c:${p.color}">${IDEA.iconHTML(p,'')}<h2>${p.name}</h2><p>${p.tag}</p></div><div class="bd"><div class="meta"><div><b>${p.cat}</b>Kategoria</div><div><b>${p.platforms.split(' · ')[0]}</b>Platforma</div></div>${p.shot?`<div class="shots"><img src="${p.shot}" alt="">${p.shot2?`<img src="${p.shot2}" alt="">`:''}</div>`:''}<p>${p.desc}</p><p style="font-size:.85em;color:#888">${p.platforms}</p><a class="get" style="--c:${p.color}" href="${p.url}" target="_blank" rel="noopener">Pobierz z App Store</a></div>`});
const plain=(id,c,t,sub,body)=>views[id]={c,html:`<div class="hd" style="--c:${c}"><h2 style="margin-top:.6em">${t}</h2><p>${sub}</p></div><div class="bd">${body}</div>`};
plain('about','#d79a00','O mnie','Marcin Polak',`<p><b>Ponad 10 lat</b> z iOS i tvOS, wcześniej kilka lat Androida.</p><p>Robię całe aplikacje sam: projekt, kod, publikacja. Teraz dokładam do tego AI, w produktach i w warsztacie.</p><p>Swift, SwiftUI, UIKit, tvOS, Core ML, Claude API.</p>`);
plain('uslugi','#4b505b','Usługi','Co mogę dla Ciebie zbudować',`<div class="svl">${services.map(s=>`<div><b>${s.t}</b><span>${s.d}</span></div>`).join('')}</div>`);
plain('kontakt','#1478f0','Kontakt','Masz pomysł na aplikację?',`<p>Napisz kilka zdań, co chcesz zbudować. Odpowiem i powiem szczerze, jak to widzę.</p><a class="get" style="--c:#1478f0" href="mailto:${email}">Napisz: ${email}</a>`);
$('#apps').innerHTML=Object.entries(views).map(([id,v])=>`<div class="app" id="app-${id}">${v.html}</div>`).join('');
let open=null;
function show(id,el){const a=$('#app-'+id);if(!a||!el)return;const s=$('#scr').getBoundingClientRect(),r=el.querySelector('div,img,span').getBoundingClientRect();
 a.style.transformOrigin=`${r.left+r.width/2-s.left}px ${r.top+r.height/2-s.top}px`;a.getBoundingClientRect();a.classList.add('on');open=a;
 $('#home').classList.add('back');$('#dock').classList.add('back');$('#hb').classList.add('dk');a.querySelector('.bd').scrollTop=0}
function close(){if(!open)return;open.classList.remove('on');open=null;$('#home').classList.remove('back');$('#dock').classList.remove('back');$('#hb').classList.remove('dk')}
$('#scr').addEventListener('click',e=>{const ap=e.target.closest('.ap');if(ap&&!open)show(ap.dataset.id,ap)});
$('#hb').onclick=close;addEventListener('keydown',e=>e.key==='Escape'&&close());
const t=()=>$('#clk').textContent=new Date().toLocaleTimeString('pl',{hour:'numeric',minute:'2-digit'});t();setInterval(t,20000);
</script>
</body>
</html>
