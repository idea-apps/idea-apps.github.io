<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Centrum kontroli lotu (koncept 77)</title>
<link rel="stylesheet" href="c.css">
<style>
body{background:radial-gradient(80% 70% at 50% 0,#14203f,#070913);min-height:100vh;padding:70px 3vw 90px}
.mono{font-family:"SF Mono",ui-monospace,Menlo,monospace}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin-bottom:20px}
.top h1{font-size:clamp(32px,4.6vw,62px);letter-spacing:-.05em;line-height:1;font-weight:900}
.clock{font-size:clamp(34px,5vw,64px);font-weight:700;letter-spacing:.02em;color:#6ee7a1;text-shadow:0 0 24px rgba(110,231,161,.5)}
.clock small{display:block;font-size:12px;letter-spacing:.14em;color:#9aa6c4;text-shadow:none}
.grid{display:grid;grid-template-columns:260px minmax(0,1fr) 300px;gap:16px}.grid>*{min-width:0}.trio{grid-template-columns:1fr}@media(min-width:1500px){.trio{grid-template-columns:repeat(3,1fr)}}
.pn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:18px}
.pn h6{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9aa6c4;margin-bottom:12px}
.chk button{all:unset;cursor:pointer;display:flex;gap:12px;align-items:center;width:100%;padding:11px 10px;border-radius:12px;font-weight:700;font-size:16px;transition:.25s}
.chk button:hover{background:rgba(255,255,255,.08)}.chk button.sel{background:rgba(255,255,255,.14)}
.chk i{width:14px;height:14px;border-radius:50%;background:#3a4262;flex:none;transition:.3s}
.chk button.run i{background:#ffb347;box-shadow:0 0 14px #ffb347;animation:bk 1s infinite}
.chk button.go i{background:#6ee7a1;box-shadow:0 0 12px #6ee7a1}
.chk small{margin-left:auto;font:600 11px "SF Mono",monospace;color:#9aa6c4}
.chk button.go small{color:#6ee7a1}.chk button.run small{color:#ffb347}
@keyframes bk{50%{opacity:.35}}
.mid h2{font-size:clamp(34px,4.4vw,60px);letter-spacing:-.05em;line-height:1;font-weight:900;margin:6px 0 10px}
.mid .d{font-size:17px;opacity:.9;margin-bottom:16px}
.mid .tag{color:var(--c);opacity:1}
.mid .big{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.mid .big span{font:700 13px "SF Mono",monospace;padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2)}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;margin:6px 0 16px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#6ee7a1,#4da3ff);transition:width .8s}
.crew div{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.1)}
.crew i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;color:#10142a;flex:none}
.crew b{display:block}.crew span{font-size:14px;color:#aab4d0}
.fl button{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;width:100%;padding:8px 6px;border-radius:12px;font-weight:700;font-size:15px}
.fl button:hover{background:rgba(255,255,255,.1)}
.fl .ico,.fl .ico-fallback{width:32px;height:32px;border-radius:23%;object-fit:cover;display:grid;place-items:center;font:800 14px sans-serif;color:#fff}
.fl em{margin-left:auto;font:700 10.5px "SF Mono",monospace;color:#6ee7a1;font-style:normal}
.ctl{display:flex;gap:10px;margin-top:6px}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div class="brand">ideaapps<small>Marcin Polak · iOS · tvOS · AI</small></div>
<div class="top"><div><span class="tag">Centrum kontroli lotu</span><h1>Misja: Twoja aplikacja.</h1></div><div class="clock mono" id="clk">T+00:00<small>CZAS MISJI</small></div></div>
<div class="grid"><div class="pn chk"><h6>Lista startowa</h6><div id="chk"></div><div class="ctl"><button class="btn" id="go" style="font-size:15px;padding:11px 20px">▶ Odpal misję</button></div></div>
<div class="pn mid" id="mid"></div>
<div style="display:grid;gap:16px;align-content:start"><div class="pn crew"><h6>Załoga</h6><div id="crew"></div></div><div class="pn fl"><h6>Wcześniejsze loty</h6><div id="fl"></div></div></div></div>
<script src="data.js"></script><script src="flow.js"></script><script src="ui.js"></script>
<script>
const {flow,projects,who}=IDEA,$=s=>document.querySelector(s),N=flow.length;
$('#chk').innerHTML=flow.map((f,i)=>`<button data-i="${i}"><i></i>${f.t}<small>OCZEKUJE</small></button>`).join('');
$('#crew').innerHTML=Object.values(who).map((w,i)=>`<div><i style="background:${w.c}">${w.n[0]}</i><div><b>${w.n}</b><span>${['Pomysł, cele, decyzje','Architektura, review, jakość','Rutyna: ekrany, testy, warianty'][i]}</span></div></div>`).join('');
$('#fl').innerHTML=projects.map((p,i)=>`<button data-i="${i}">${IDEA.iconHTML(p,'')}${p.name}<em>NA ORBICIE</em></button>`).join('');
$('#fl').onclick=e=>{const b=e.target.closest('button');if(b)IDEA.ui.app(projects[+b.dataset.i])};
let sel=0,done=-1,timer=null,t0=0,clk=null;
function draw(){document.querySelectorAll('#chk button').forEach((b,i)=>{b.classList.toggle('sel',i===sel);b.classList.toggle('go',i<=done);b.classList.toggle('run',timer&&i===done+1);b.querySelector('small').textContent=i<=done?'GO':(timer&&i===done+1)?'W TOKU':'OCZEKUJE'});
 const f=flow[sel];const m=$('#mid');m.style.setProperty('--c',f.c);
 m.innerHTML=`<span class="tag">Etap ${sel+1} z ${N} · ${f.sub}</span><h2>${f.t}</h2><div class="big"><span>CZAS: ${f.time}</span><span>STATUS: ${sel<=done?'ZAKOŃCZONY':(timer&&sel===done+1)?'W TOKU':'OCZEKUJE'}</span></div><div class="d">${f.d}</div>${IDEA.trio(f)}<div class="get"><b>Efekt:</b> ${f.get}</div><div class="bar"><i style="width:${(done+1)/N*100}%"></i></div>`}
function tick(){const s=Math.floor((performance.now()-t0)/1000);$('#clk').firstChild.textContent='T+'+String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function stop(){clearInterval(timer);clearInterval(clk);timer=null;$('#go').textContent='▶ Odpal misję'}
function run(){if(timer){stop();draw();return}
 if(done>=N-1){done=-1}t0=performance.now();clk=setInterval(tick,250);$('#go').textContent='❚❚ Pauza';
 const step=()=>{sel=done+1;draw()};step();
 timer=setInterval(()=>{done++;if(done>=N-1){stop();sel=N-1;draw();return}sel=done+1;draw()},2600)}
$('#go').onclick=run;
$('#chk').onclick=e=>{const b=e.target.closest('button[data-i]');if(b){sel=+b.dataset.i;draw()}};
IDEA.ui.bar(null,'top');draw();
</script></body></html>
