<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Kino (wariant 12)</title>
<style>
:root{--ink:#f4f1ea}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#0b0b0d}
body{font:18px/1.5 -apple-system,"Helvetica Neue",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
#rail{display:flex;height:100%;width:max-content;transition:transform 1s cubic-bezier(.7,0,.15,1)}
.sl{width:100vw;height:100vh;position:relative;overflow:hidden;flex:none;display:grid;grid-template-columns:1.05fr 1fr;align-items:center;align-content:center;padding:0 7vw;background:var(--bg,#111)}
.sl::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 80% at 75% 50%,var(--glow,transparent),transparent 70%);opacity:.55}
.sl>*{position:relative}
.num{position:absolute;left:5vw;bottom:-6vw;font:800 38vw/1 -apple-system,sans-serif;letter-spacing:-.08em;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.08);pointer-events:none}
.cat{font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.65;margin-bottom:20px}
h2{font-size:clamp(54px,9.5vw,150px);line-height:.88;letter-spacing:-.06em;font-weight:800;margin-bottom:26px}
.sl p{max-width:30em;font-size:clamp(17px,1.5vw,22px);opacity:.82;margin-bottom:28px}
.go{display:inline-flex;gap:10px;border-bottom:2px solid currentColor;padding-bottom:3px;font-weight:600}
.go:hover{gap:18px}.go{transition:gap .2s}
.shotw{justify-self:center;height:min(78vh,820px);aspect-ratio:9/19.5;position:relative}
.shotw .p{position:absolute;inset:0;border-radius:42px;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,.14),0 60px 120px rgba(0,0,0,.6);transform:rotate(5deg) translateY(var(--ty,0));transition:transform 1.2s cubic-bezier(.2,.7,.2,1) .2s}
.sl.act .shotw .p{transform:rotate(-3deg)}
.shotw img{width:100%;height:100%;object-fit:cover;object-position:top}
.shotw .fb{width:100%;height:100%;display:grid;place-items:center;font:800 clamp(100px,16vw,220px) sans-serif;letter-spacing:-.07em;color:rgba(255,255,255,.92)}
.shotw .p.b{opacity:.5;transform:rotate(10deg) translate(60px,20px) scale(.9);filter:blur(1px)}
.sl.act .shotw .p.b{transform:rotate(7deg) translate(80px,10px) scale(.92)}
.intro h1{font-size:clamp(50px,9vw,150px);line-height:.88;letter-spacing:-.065em;font-weight:800;grid-column:1/-1;max-width:11em}
.intro h1 i{font-style:normal;color:#ffb347}
.intro .sub{grid-column:1/-1;margin-top:36px;max-width:36em;font-size:clamp(17px,1.7vw,24px);opacity:.75}
.hint{position:absolute;right:7vw;bottom:8vh;font-size:14px;letter-spacing:.14em;text-transform:uppercase;opacity:.6;animation:nd 2s infinite}
@keyframes nd{50%{transform:translateX(10px)}}
.list{grid-column:1/-1}
.list h2{font-size:clamp(40px,6vw,90px)}
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:3vw;margin-top:40px}
.svc div{border-top:2px solid rgba(255,255,255,.3);padding-top:18px}
.svc b{display:block;font-size:22px;margin-bottom:8px}.svc span{opacity:.7;font-size:16px}
.mail{font-size:clamp(26px,5.4vw,84px);letter-spacing:-.05em;font-weight:800;border-bottom:3px solid #ffb347}
.mail:hover{color:#ffb347}
#bar{position:fixed;left:0;right:0;bottom:0;height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 7vw;z-index:10;font-size:13px;letter-spacing:.1em;text-transform:uppercase;mix-blend-mode:difference;color:#fff}
#dots{display:flex;gap:6px}
#dots button{all:unset;cursor:pointer;width:26px;height:26px;display:grid;place-items:center}
#dots button::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff;opacity:.35;transition:.3s}
#dots button.on::after{opacity:1;transform:scale(1.7)}
#top{position:fixed;top:0;left:0;right:0;padding:26px 7vw;display:flex;justify-content:space-between;z-index:10;font-weight:700;mix-blend-mode:difference;color:#fff}
@media(max-width:860px){.sl{grid-template-columns:1fr;padding:80px 28px 90px;align-content:center;gap:18px}.shotw{height:34vh;justify-self:start}.svc{grid-template-columns:1fr 1fr}.num{display:none}.hint{display:none}}
</style>
</head>
<body>
<div id="top"><span>ideaapps</span><span id="pos"></span></div>
<div id="rail"></div>
<div id="bar"><span>← → klawisze, kółko lub kropki</span><div id="dots"></div></div>
<script src="data.js"></script>
<script>
const {projects,services,email}=IDEA;
const dark=(c,a)=>`color-mix(in srgb,${c} ${a}%,#0b0b0d)`;
const slides=[];
slides.push(`<div class="sl intro" style="--bg:#0b0b0d;--glow:#ffb34755"><h1>Aplikacje na iOS i tvOS, <i>od A do Z</i>.</h1><p class="sub">Marcin Polak. Ponad 10 lat natywnego kodu dla Apple, od niedawna z AI. Poniżej osiem aplikacji, które sam zaprojektowałem, napisałem i wypuściłem.</p><span class="hint">Dalej →</span></div>`);
projects.forEach((p,i)=>slides.push(`<div class="sl" style="--bg:${dark(p.color,34)};--glow:${p.color}"><div class="num">${i+1}</div>
<div><div class="cat">${p.cat} · ${p.platforms}</div><h2>${p.name}</h2><p><b>${p.tag}.</b> ${p.desc}</p><a class="go" href="${p.url}" target="_blank" rel="noopener">App Store <span>→</span></a></div>
<div class="shotw">${p.shot?`<div class="p b"><img src="${p.shot2||p.shot}" alt=""></div><div class="p"><img src="${p.shot}" alt=""></div>`:`<div class="p" style="background:${p.color}"><div class="fb">${p.name[0]}</div></div>`}</div></div>`));
slides.push(`<div class="sl" style="--bg:#111114;--glow:#4d7cfe55"><div class="list"><div class="cat">Usługi</div><h2>Co zbuduję dla Ciebie</h2><div class="svc">${services.map(s=>`<div><b>${s.t}</b><span>${s.d}</span></div>`).join('')}</div></div></div>`);
slides.push(`<div class="sl" style="--bg:#0b0b0d;--glow:#ffb34744"><div class="list"><div class="cat">Kontakt</div><h2>Masz pomysł?</h2><p style="max-width:30em">Napisz kilka zdań, co chcesz zbudować. Odpowiem i powiem uczciwie, jak to widzę.</p><a class="mail" href="mailto:${email}">${email}</a></div></div>`);
const rail=document.getElementById('rail');rail.innerHTML=slides.join('');
const N=slides.length;let cur=0,lock=false;
document.getElementById('dots').innerHTML=slides.map((_,i)=>`<button data-i="${i}" aria-label="${i+1}"></button>`).join('');
const go=i=>{cur=Math.max(0,Math.min(N-1,i));rail.style.transform=`translateX(${-cur*100}vw)`;
 rail.children.length&&[...rail.children].forEach((s,k)=>s.classList.toggle('act',k===cur));
 document.querySelectorAll('#dots button').forEach((b,k)=>b.classList.toggle('on',k===cur));
 document.getElementById('pos').textContent=String(cur+1).padStart(2,'0')+' / '+String(N).padStart(2,'0')};
document.getElementById('dots').onclick=e=>{const b=e.target.closest('button');if(b)go(+b.dataset.i)};
addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}});
addEventListener('wheel',e=>{if(lock||Math.abs(e.deltaY)+Math.abs(e.deltaX)<18)return;lock=true;go(cur+((e.deltaY+e.deltaX)>0?1:-1));setTimeout(()=>lock=false,900)},{passive:true});
let sx=0;addEventListener('touchstart',e=>sx=e.touches[0].clientX);addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)go(cur+(d<0?1:-1))});
go(0);
</script>
</body>
</html>
