<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Prezentacja (wariant 62)</title>
<style>
:root{--ink:#14151a}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:16px/1.4 -apple-system,"SF Pro Text",Helvetica,sans-serif;color:var(--ink);background:#2b2c31;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}
.tb{height:44px;background:#38393f;color:#e9e9ee;display:flex;align-items:center;gap:14px;padding:0 14px;font-size:13px;border-bottom:1px solid #1f2024;flex:none}
.tb .tl{display:flex;gap:8px}.tb .tl i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.tb .tl i:nth-child(2){background:#febc2e}.tb .tl i:nth-child(3){background:#28c840}
.tb b{margin-left:6px}.tb .sp{flex:1}
.tb button,.tb a{all:unset;cursor:pointer;background:#4a4b52;padding:5px 14px;border-radius:6px;font-weight:600;color:#fff}
.tb button:hover,.tb a:hover{background:#5a5b63}.tb a.p{background:#0a7aff}
.main{flex:1;display:grid;grid-template-columns:200px minmax(0,1fr);min-height:0}
.sorter{background:#26272b;overflow:auto;padding:12px 14px;border-right:1px solid #1b1c1f}
.th{position:relative;margin-bottom:12px;cursor:pointer;display:flex;gap:8px;align-items:flex-start}
.th .no{color:#9a9ba3;font-size:11.5px;width:16px;text-align:right;padding-top:3px}
.th .fr{width:150px;height:84.4px;border-radius:5px;overflow:hidden;position:relative;border:2px solid transparent;box-shadow:0 0 0 1px #000}
.th.on .fr{border-color:#0a7aff}
.th .fr .sl{width:1600px;height:900px;transform:scale(.09375);transform-origin:0 0;pointer-events:none}
.stage{display:grid;place-items:center;padding:3vh 3vw;min-height:0;background:radial-gradient(60% 60% at 50% 40%,#3a3b41,#232428)}
.canvas{position:relative;width:min(100%,calc((100vh - 130px)*16/9));aspect-ratio:16/9;container-type:inline-size;box-shadow:0 30px 80px rgba(0,0,0,.6);border-radius:6px;overflow:hidden}
.sl{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;opacity:0;transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1);transform:translateX(3%);pointer-events:none;background:var(--bg,#fff);color:var(--fg,var(--ink))}
.canvas .sl.on{opacity:1;transform:none;pointer-events:auto}
.th .sl{opacity:1;transform:none;position:relative;width:1600px;height:900px;transition:none}
/* slide typography in container units (1600 base) */
.sl{--u:1cqw;font-size:1cqw}
.th .sl{font-size:16px;--u:16px}
.sl .pad{position:absolute;inset:0;padding:5% 6%;display:flex;flex-direction:column}
.sl small.k{font-size:1.5em;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.75}
.sl h1{font-size:7.6em;line-height:.92;letter-spacing:-.055em;font-weight:800;margin:.25em 0 .35em}
.sl h2{font-size:4.8em;line-height:.95;letter-spacing:-.05em;font-weight:800;margin:.15em 0 .25em}
.sl p{font-size:2.2em;line-height:1.3;max-width:26em}
.sl .two{display:grid;grid-template-columns:1.15fr 1fr;gap:4em;flex:1;min-height:0;align-items:center}
.sl ul{list-style:none;margin:0;padding:0}.sl li{font-size:2em;padding:.32em 0 .32em 1.5em;position:relative;border-bottom:1px solid rgba(255,255,255,.28)}
.sl li::before{content:"✓";position:absolute;left:0;top:.36em;font-weight:800}
.sl .shots{display:flex;gap:2em;justify-content:center;align-items:center;height:100%}
.sl .shots img{height:calc(var(--u)*42);width:auto;border-radius:3em;box-shadow:0 2em 5em rgba(0,0,0,.45);flex:none}
.sl .meta{font-size:1.6em;opacity:.9;margin-top:.7em}
.sl .icn{width:calc(var(--u)*11);height:calc(var(--u)*11);border-radius:23%;object-fit:cover;display:grid;place-items:center;font:800 calc(var(--u)*6) sans-serif;color:#fff;box-shadow:0 1.2em 3em rgba(0,0,0,.35)}
.sl .grid8{display:grid;grid-template-columns:repeat(4,1fr);gap:3em;margin-top:2em}
.sl .grid8 div{text-align:center;font-size:1.9em;font-weight:700}
.sl .grid8 .icn{width:calc(var(--u)*10);height:calc(var(--u)*10);margin:0 auto .5em;font-size:calc(var(--u)*5)}
.sl .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:2.4em;margin-top:1.4em}
.sl .steps div{background:rgba(255,255,255,.1);border-radius:1.6em;padding:1.6em}
.sl .steps b{display:block;font-size:2.6em;margin-bottom:.2em}.sl .steps span{font-size:1.9em;opacity:.9;line-height:1.3;display:block}
.sl .steps i{font-style:normal;font-size:3em;font-weight:800;color:#ffcf3a}
.sl .svg4{display:grid;grid-template-columns:1fr 1fr;gap:2em;margin-top:1.4em}
.sl .svg4 div{background:rgba(255,255,255,.1);border-radius:1.6em;padding:1.6em 2em}.sl .svg4 b{display:block;font-size:2.8em}.sl .svg4 span{font-size:2em;opacity:.9}
.sl .mailb{font-size:5.4em;font-weight:800;letter-spacing:-.04em;border-bottom:.08em solid #ffcf3a;display:inline-block;margin-top:.3em;overflow-wrap:anywhere}
.sl .cta{display:inline-block;margin-top:1em;background:#fff;color:#14151a;font-weight:800;font-size:2.2em;padding:.5em 1.2em;border-radius:99px;text-decoration:none}
.sl .num{position:absolute;right:3%;bottom:3%;font-size:1.8em;opacity:.6;font-weight:600}
.foot{height:34px;background:#38393f;color:#a8a9b1;display:flex;align-items:center;justify-content:space-between;padding:0 16px;font-size:12.5px;flex:none}
@media(max-width:800px){.main{grid-template-columns:1fr}.sorter{display:none}.tb .hide{display:none}}
</style>
</head>
<body>
<div class="tb"><div class="tl"><i></i><i></i><i></i></div><b>ideaapps — prezentacja.key</b><span class="sp"></span><button id="pv">‹</button><button id="nx">›</button><button id="fs" class="hide">▶ Pokaz (F)</button><a class="p" id="mail" href="#">Napisz do mnie</a></div>
<div class="main"><aside class="sorter" id="sorter"></aside><section class="stage"><div class="canvas" id="cv"></div></section></div>
<div class="foot"><span id="ct"></span><span>strzałki ← → · F: pełny ekran · Esc: wyjście</span></div>
<script src="data.js"></script><script src="render.js"></script>
<script>
const {projects,services,process,email,R}=IDEA;
const $=s=>document.querySelector(s);
$('#mail').href='mailto:'+email;
const deep=c=>`color-mix(in srgb,${c} 85%,#14151a)`;
const S=[];
S.push({bg:'#14151a',fg:'#fff',t:'Tytuł',h:`<div class="pad" style="justify-content:center"><small class="k">Marcin Polak · iOS · tvOS · AI</small><h1>Aplikacje Apple,<br>od A do Z.</h1><p>Niezależny developer z ponad 10-letnim doświadczeniem. Osiem własnych aplikacji w App Store.</p></div>`});
S.push({bg:'#f4f1ea',t:'O mnie',h:`<div class="pad"><small class="k" style="color:#e8561a">O mnie</small><h2>Jedna osoba. Cała droga.</h2><p>${IDEA.about}</p><div class="steps" style="grid-template-columns:repeat(4,1fr)"><div style="background:#fff"><i style="color:#e8561a">10+</i><span>lat iOS i tvOS</span></div><div style="background:#fff"><i style="color:#e8561a">8</i><span>aplikacji w App Store</span></div><div style="background:#fff"><i style="color:#e8561a">1</i><span>osoba odpowiada za całość</span></div><div style="background:#fff"><i style="color:#e8561a">AI</i><span>w produktach i warsztacie</span></div></div></div>`});
S.push({bg:'#2b3a8c',fg:'#fff',t:'Jak pracuję 1',h:`<div class="pad"><small class="k">Jak pracuję · 1 z 2</small><h2>Od rozmowy do prototypu.</h2><div class="steps">${process.slice(0,3).map((s,i)=>`<div><i>${i+1}</i><b>${s.t}</b><span>${s.d}</span></div>`).join('')}</div></div>`});
S.push({bg:'#2b3a8c',fg:'#fff',t:'Jak pracuję 2',h:`<div class="pad"><small class="k">Jak pracuję · 2 z 2</small><h2>Od budowy do sklepu.</h2><div class="steps">${process.slice(3).map((s,i)=>`<div><i>${i+4}</i><b>${s.t}</b><span>${s.d}</span></div>`).join('')}</div></div>`});
S.push({bg:'#f4f1ea',t:'Aplikacje',h:`<div class="pad"><small class="k" style="color:#e8561a">Portfolio</small><h2>Osiem aplikacji w App Store.</h2><div class="grid8">${projects.map(p=>`<div>${IDEA.iconHTML(p,'icn')}${p.name}</div>`).join('')}</div></div>`});
projects.forEach((p,i)=>S.push({bg:deep(p.color),fg:'#fff',t:p.name,h:`<div class="pad"><div class="two"><div><small class="k">${p.cat} · ${i+1} z 8</small><h2>${p.name}</h2><p style="margin-bottom:.8em"><b>${p.tag}.</b></p><ul>${(p.feats||[]).slice(0,4).map(f=>`<li>${f}</li>`).join('')}</ul><div class="meta">Dla: ${p.who} · ${p.platforms}</div></div><div>${p.shot?`<div class="shots"><img src="${p.shot}" alt="">${p.shot2?`<img src="${p.shot2}" alt="">`:''}</div>`:`<div class="shots">${IDEA.iconHTML(p,'icn')}</div>`}</div></div></div>`}));
S.push({bg:'#16161c',fg:'#fff',t:'AI',h:`<div class="pad" style="justify-content:center"><small class="k" style="color:#ffcf3a">AI</small><h2>${IDEA.ai.t}</h2><p>${IDEA.ai.d}</p></div>`});
S.push({bg:'#0f7a52',fg:'#fff',t:'Usługi',h:`<div class="pad"><small class="k">Usługi</small><h2>Co mogę zbudować.</h2><div class="svg4">${services.map(s=>`<div><b>${s.t}</b><span>${s.d}</span></div>`).join('')}</div></div>`});
S.push({bg:'#14151a',fg:'#fff',t:'Kontakt',h:`<div class="pad" style="justify-content:center"><small class="k" style="color:#ffcf3a">Kontakt</small><h2>Masz pomysł?<br>Napisz.</h2><a class="mailb" href="mailto:${email}" style="color:#fff">${email}</a><p style="margin-top:1em">Opisz w kilku zdaniach, co chcesz zbudować. Odpowiem i powiem szczerze, jak to widzę.</p></div>`});
const mk=(s,i,cls)=>`<div class="sl ${cls||''}" style="--bg:${s.bg};--fg:${s.fg||'#14151a'}">${s.h}<span class="num">${i+1}</span></div>`;
$('#cv').innerHTML=S.map((s,i)=>mk(s,i)).join('');
$('#sorter').innerHTML=S.map((s,i)=>`<div class="th" data-i="${i}"><span class="no">${i+1}</span><div class="fr">${mk(s,i)}</div></div>`).join('');
const slides=[...document.querySelectorAll('#cv .sl')],ths=[...document.querySelectorAll('.th')];
let cur=0;
function go(i){cur=Math.max(0,Math.min(S.length-1,i));slides.forEach((s,k)=>s.classList.toggle('on',k===cur));ths.forEach((t,k)=>t.classList.toggle('on',k===cur));
 ths[cur].scrollIntoView({block:'nearest'});$('#ct').textContent=`Slajd ${cur+1} z ${S.length} · ${S[cur].t}`;history.replaceState(null,'','#'+(cur+1))}
$('#sorter').addEventListener('click',e=>{const t=e.target.closest('.th');if(t)go(+t.dataset.i)});
$('#nx').onclick=()=>go(cur+1);$('#pv').onclick=()=>go(cur-1);
$('#fs').onclick=()=>document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown','PageDown',' '].includes(e.key)){e.preventDefault();go(cur+1)}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}if(e.key==='f'||e.key==='F')$('#fs').click();if(e.key==='Home')go(0);if(e.key==='End')go(S.length-1)});
let sx=0;$('#cv').addEventListener('touchstart',e=>sx=e.touches[0].clientX);$('#cv').addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>50)go(cur+(d<0?1:-1))});
go(Math.max(0,(+location.hash.slice(1)||1)-1));
</script>
</body>
</html>
