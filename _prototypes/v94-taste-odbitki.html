<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Odbitki</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#a8a8aa;--surface:#b4b4b6;--ink:#0e0e0e;--muted:#3a3a3c;--accent:#1f5c49;--dark:#0b0c0d;--light:#ededed;--m:clamp(18px,2.4vw,34px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 18px/1.45 "STIX Two Text",Georgia,serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
.hero{background:var(--dark);color:var(--light);min-height:100svh;position:relative}
.nav{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:var(--m);font-size:16px;z-index:5;align-items:center}
.nav nav{display:flex;gap:22px;align-items:center}
.nav a.b{background:var(--light);color:var(--dark);padding:8px 16px;text-decoration:none}
.hero .big{position:absolute;left:calc(100%*4/12);top:11%;width:40%;aspect-ratio:4/5;overflow:hidden}
.hero .sm{position:absolute;left:calc(100%*1/12);top:52%;width:12%;aspect-ratio:1;overflow:hidden;filter:brightness(.7)}
.hero img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.hero h1{position:absolute;left:var(--m);bottom:var(--m);font-weight:400;font-size:clamp(34px,3.4vw,56px);letter-spacing:-.026em;line-height:1.1;max-width:22ch}
.hero p{position:absolute;right:var(--m);bottom:var(--m);width:min(24ch,22vw);font-size:16px;color:#b9b9b9}
.intro{padding:16vh var(--m) 8vh;position:relative}
.intro h2{font-weight:400;font-size:clamp(34px,3.4vw,52px);letter-spacing:-.026em;line-height:1.1;max-width:30ch;position:relative;z-index:2}
.intro .ph{width:44%;margin-left:auto;margin-top:-4vh;aspect-ratio:16/10;overflow:hidden}
.intro .ph img{width:100%;height:100%;object-fit:cover;object-position:top}
.intro p{max-width:34ch;margin-top:3vh;font-size:19px}
.diag{padding:8vh var(--m) 10vh;display:grid;gap:12vh}
.diag .it{display:grid;grid-template-columns:repeat(12,1fr);gap:var(--m);align-items:end}
.diag .it img{display:block;width:100%;object-fit:cover;object-position:top}
.diag .it figure{grid-column:var(--c)}
.diag .it .tx{grid-column:var(--t);max-width:30ch;font-size:17px}
.diag h3{font-weight:600;font-size:22px;margin-bottom:.3em}
.diag .it:nth-child(odd) figure{--c:2/5}.diag .it:nth-child(odd) .tx{--t:6/10}
.diag .it:nth-child(even) figure{--c:8/12}.diag .it:nth-child(even) .tx{--t:3/7;order:-1}
.run{padding:10vh var(--m);}
.run h2{font-weight:400;font-size:clamp(32px,3.6vw,58px);letter-spacing:-.026em;margin-bottom:6vh;max-width:18ch}
.frames{display:flex;flex-wrap:wrap;gap:var(--m);align-items:flex-start;padding-bottom:20px}
.frames a{flex:none;text-decoration:none;display:block;width:var(--w)}
.frames img{display:block;width:100%;aspect-ratio:var(--ar);object-fit:cover;object-position:top}
.frames a.up{margin-top:-6vh}
.frames span{display:block;margin-top:10px;font-size:16px}.frames em{display:block;color:var(--muted);font-size:15px}
.faq{padding:12vh var(--m) 8vh}
.faq h2{font-weight:400;font-size:clamp(40px,6vw,104px);letter-spacing:-.03em;line-height:1;margin-bottom:10vh}
.faq .r{margin-left:25%;max-width:60ch;margin-bottom:8vh}
.faq h3{font-weight:600;font-size:22px;margin-bottom:.3em}
.cta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--m);padding:0 var(--m)}
.cta img{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;display:block}
.cta .f{background:var(--accent);color:#fff;margin:var(--m) var(--m) 0;padding:12vh var(--m);display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;grid-column:1/-1;margin-left:calc(-1*var(--m));margin-right:calc(-1*var(--m));text-decoration:none}
.cta .f span{font-size:clamp(34px,5vw,84px);letter-spacing:-.03em;line-height:1;max-width:22ch}
.cta .f b{font-weight:400;font-size:clamp(22px,2.4vw,36px);text-decoration:underline}
footer{display:grid;grid-template-columns:1fr 1fr;min-height:54svh;margin-top:var(--m)}
footer .p{overflow:hidden}footer .p img{width:100%;height:100%;object-fit:cover;object-position:center 12%;display:block;filter:brightness(.8)}
footer .t{background:var(--dark);color:var(--light);padding:var(--m);display:flex;flex-direction:column;justify-content:space-between;font-size:17px}
footer .t a{display:block;font-size:clamp(24px,2.4vw,34px);letter-spacing:-.02em;text-decoration:none}
@media(max-width:820px){.intro h2{font-size:6.4vw}.hero .big{left:22%;width:72%;top:12%}.hero .sm{left:var(--m);top:46%;width:30%}.hero p{display:none}.intro .ph{width:100%;margin-top:4vh}.diag .it{display:block}.diag .it figure{width:70%;margin-bottom:12px}.cta{grid-template-columns:1fr}.faq .r{margin-left:0}footer{grid-template-columns:1fr}}
</style></head><body>
<header class="hero"><div class="nav"><a href="#">ideaapps</a><nav><a href="#proces">Proces</a><a href="#przyklady">Przykłady</a><a class="b" id="mail" href="#">Napisz</a></nav></div>
<div class="big"><img id="hb" alt=""></div><div class="sm"><img id="hs" alt=""></div>
<h1>Pomysł trafia na ekran. Aplikacja zostaje.</h1><p>Natywne aplikacje na iOS, iPadOS i macOS.</p></header>
<section class="intro" id="proces"><h2>Prototypy i kod z AI. Każdą zmianę sprawdza developer.</h2><div class="ph"><img id="ib" alt=""></div><p id="i1"></p></section>
<section class="diag" id="diag"></section>
<section class="run" id="przyklady"><h2>Aplikacje, które już są w sklepie</h2><div class="frames" id="fr"></div></section>
<section class="faq"><h2>Pytania</h2><div id="fq"></div></section>
<section class="cta" id="cta"></section>
<footer><div class="p"><img id="fp" alt=""></div><div class="t"><div><a id="m2" href="#">Napisz</a><a href="#proces">Proces</a><a href="#przyklady">Przykłady</a></div><span>© 2026 ideaapps</span></div></footer>
<script src="data.js"></script><script src="flow.js"></script><script src="t.js"></script>
<script>
const {flow,projects,T,email}=IDEA,$=s=>document.querySelector(s);
const P=id=>projects.find(p=>p.id===id);
$('#mail').href=$('#m2').href=T.mail('');
$('#hb').src=P('kierbud').shot;$('#hb').alt='Zrzut ekranu aplikacji Kierbud';$('#hs').src=P('boxes').icon;$('#hs').alt='Ikona aplikacji Boxes';
$('#ib').src=P('mounda').shot;$('#ib').alt='Zrzut ekranu aplikacji Mounda';$('#i1').textContent=T.intro;
$('#fp').src=P('kajet').shot;$('#fp').alt='Zrzut ekranu aplikacji Kajet';
const sh=['kajet','stanlokalu','kierbud','mounda','boxes','kajet','kierbud'].map(P);
$('#diag').innerHTML=flow.map((f,i)=>{const p=sh[i],ar=['4/5','1/1','3/4','4/3','4/5','1/1','3/4'][i];return `<div class="it"><figure><img src="${p.shot}" style="aspect-ratio:${ar}" alt="Zrzut ekranu aplikacji ${p.name}" loading="lazy"></figure><div class="tx"><h3>${f.t}</h3>${f.d}</div></div>`}).join('');
const ar=['3/4','4/5','1/1','3/4','4/5'],w=['220px','320px','260px','300px','240px'];
$('#fr').innerHTML=T.withShot().map((p,i)=>`<a class="${i%2?'up':''}" href="${p.url}" target="_blank" rel="noopener" style="--w:${w[i%5]};--ar:${ar[i%5]}"><img src="${p.shot}" alt="Zrzut ekranu aplikacji ${p.name}" loading="lazy"><span>${p.name}</span><em>${p.tag}</em></a>`).join('');
$('#fq').innerHTML=T.faq.map(([q,a])=>`<div class="r"><h3>${q}</h3><p>${a}</p></div>`).join('');
$('#cta').innerHTML=['kierbud','mounda','stanlokalu'].map(id=>`<img src="${P(id).shot}" alt="Zrzut ekranu aplikacji ${P(id).name}" loading="lazy">`).join('')+`<a class="f" href="${T.mail('')}"><span>Opis pomysłu to dobry początek.</span><b>${email}</b></a>`;
</script></body></html>
