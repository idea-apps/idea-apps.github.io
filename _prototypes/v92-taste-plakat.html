<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Plakat</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f9f8;--surface:#ebf0ee;--ink:#06525c;--muted:#2f737d;--m:clamp(16px,2.2vw,32px);--say:clamp(40px,6vw,96px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 18px/1.45 "Hanken Grotesk",system-ui,sans-serif;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
a{color:inherit}
.say{font-weight:500;font-size:var(--say);letter-spacing:-.05em;line-height:.9}
.nav{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;padding:var(--m);font-size:15px;font-weight:500;background:var(--bg)}
.nav nav{display:flex;gap:22px;align-items:center}
.nav .b{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:0;text-decoration:none}
.reel{height:520svh;position:relative}
.stage{position:sticky;top:0;height:100svh;padding:0 var(--m)}
.line{position:absolute;left:var(--m);right:var(--m);top:50%;transform:translateY(-50%);display:flex;justify-content:space-between;align-items:center;gap:2vw}
.line .say{font-size:clamp(40px,3.6vw+14px,92px)}
.frame{width:min(35vw,640px);aspect-ratio:16/9;background:var(--surface);overflow:hidden;position:relative;flex:none}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;opacity:0;transition:opacity .6s}
.frame img.on{opacity:1}
.frame.up,.frame.dn{position:absolute;left:50%;width:min(35vw,640px);margin-left:calc(min(35vw,640px)/-2)}
.nb{position:absolute;left:50%;width:min(35vw,640px);margin-left:calc(min(35vw,640px)/-2);aspect-ratio:16/9;background:var(--surface);overflow:hidden}
.nb.t{top:-100%;margin-top:calc(100svh*0 + 76px);top:auto;bottom:auto;transform:translateY(calc(-100% - 16px)) translateY(60px);top:0}
.nb img{width:100%;height:100%;object-fit:cover;object-position:top;display:block}
.cap{position:absolute;left:var(--m);bottom:var(--m);max-width:34ch;font-size:18px;font-weight:500}
.cap span{display:block;color:var(--muted);font-weight:400}
.meta{position:absolute;right:var(--m);bottom:var(--m);text-align:right;color:var(--muted);font-size:15px}
.sec{padding:16vh var(--m) 0}
.sec h2{font-weight:500;font-size:var(--say);letter-spacing:-.05em;line-height:.92;max-width:12ch}
.sec p.l{max-width:44ch;margin-top:5vh;font-size:20px}
.verbs{height:520svh;position:relative}
.verbs .stage{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:var(--m)}
.verbs .v{font-weight:500;font-size:clamp(64px,11vw,200px);letter-spacing:-.055em;line-height:.9;position:relative;height:1.05em}
.verbs .v span{position:absolute;left:0;top:0;opacity:0;transform:translateY(24px);transition:.5s cubic-bezier(.2,.8,.2,1)}
.verbs .v span.on{opacity:1;transform:none}
.verbs .tx{font-size:clamp(20px,1.7vw,26px);max-width:34ch;position:relative;min-height:8em}
.verbs .tx div{position:absolute;left:0;top:0;opacity:0;transition:opacity .4s}
.verbs .tx div.on{opacity:1}
.verbs .tx b{display:block;font-weight:500;color:var(--muted);font-size:18px;margin-top:14px}
.faq{display:grid;grid-template-columns:5fr 7fr;gap:var(--m);padding:22vh var(--m) 10vh}
.faq .q{display:flex;flex-direction:column;gap:2px;position:sticky;top:90px;align-self:start}
.faq button{all:unset;cursor:pointer;font-weight:500;font-size:clamp(22px,2vw,30px);letter-spacing:-.03em;line-height:1.15;padding:8px 0;color:var(--muted);transition:color .2s}
.faq button.on,.faq button:hover{color:var(--ink)}
.faq .a{font-size:clamp(22px,2vw,32px);letter-spacing:-.02em;line-height:1.3;font-weight:500;min-height:6em;max-width:34ch}
.cta{display:block;background:var(--ink);color:var(--bg);text-decoration:none;padding:var(--m);min-height:62svh;position:relative;overflow:hidden}
.cta p{font-size:20px;max-width:26ch}
.cta .w{position:absolute;left:var(--m);bottom:10px;font-weight:500;font-size:clamp(90px,26vw,520px);letter-spacing:-.07em;line-height:.8}
.cta:hover{background:var(--bg);color:var(--ink)}
footer{padding:var(--m);display:flex;justify-content:space-between;font-size:15px;color:var(--muted)}
@media(max-width:820px){.sec h2{font-size:9vw;max-width:none}.line{flex-direction:column;align-items:flex-start;top:42%}.frame{width:calc(100vw - 32px)}.line .say{font-size:9vw}.verbs .stage{grid-template-columns:1fr;align-content:center}.faq{grid-template-columns:1fr}.faq .q{position:static}.nav nav a:not(.b){display:none}}
</style></head><body>
<div class="nav"><a href="#">ideaapps</a><nav><a href="#proces">Proces</a><a href="#faq">Pytania</a><a class="b" id="mail" href="#">Napisz</a></nav></div>
<section class="reel" id="reel"><div class="stage"><h1 class="line"><span class="say">Od pomysłu</span><div class="frame" id="fr"></div><span class="say">do aplikacji</span></h1>
<p class="cap" id="cap"></p><p class="meta" id="meta">Natywne aplikacje na iOS, iPadOS i macOS</p></div></section>
<section class="sec" id="proces" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--m);align-items:end"><div><h2>Jak powstaje aplikacja</h2><p class="l">Każdy etap ma własne słowo. Przewijanie zmienia je po kolei.</p></div><img id="pi" alt="Zrzut ekranu aplikacji Boxes" style="width:min(420px,70%);aspect-ratio:4/5;object-fit:cover;object-position:top;justify-self:end;display:block"></section>
<section class="verbs" id="verbs"><div class="stage"><div class="v" id="v"></div><div class="tx" id="tx"></div></div></section>
<section class="faq" id="faq"><div><h2 class="say" style="font-size:clamp(40px,5vw,80px);margin-bottom:5vh">Pytania</h2><div class="q" id="q"></div></div><div class="a" id="a"></div></section>
<a class="cta" id="cta" href="#"><p>Opis pomysłu w kilku zdaniach to dobry początek.</p><span class="w">Napisz</span></a>
<footer><span>© 2026 ideaapps</span><a href="mailto:">e-mail</a></footer>
<script src="data.js"></script><script src="flow.js"></script><script src="t.js"></script>
<script>
const {flow,projects,T,email}=IDEA,$=s=>document.querySelector(s);
$('#pi').src=IDEA.projects.find(p=>p.id==='boxes').shot;$('#mail').href=$('#cta').href=T.mail('');document.querySelector('footer a').href='mailto:'+email;document.querySelector('footer a').textContent=email;
const ps=T.withShot();
$('#fr').innerHTML=ps.map((p,i)=>`<img src="${p.shot}" alt="Zrzut ekranu aplikacji ${p.name}" class="${i?'':'on'}">`).join('');
const imgs=[...document.querySelectorAll('#fr img')];let ci=-1;
function app(i){if(i===ci)return;ci=i;imgs.forEach((m,k)=>m.classList.toggle('on',k===i));const p=ps[i];$('#cap').innerHTML=`${p.name}<span>${p.tag}</span>`;$('#meta').textContent=p.cat+' · '+p.platforms}
// reel: kroki
const reel=$('#reel');
function onScroll(){const r=reel.getBoundingClientRect(),t=Math.max(0,Math.min(.999,-r.top/(reel.offsetHeight-innerHeight)));app(Math.floor(t*ps.length));
 const v=$('#verbs').getBoundingClientRect(),tv=Math.max(0,Math.min(.999,-v.top/($('#verbs').offsetHeight-innerHeight)));vs(Math.floor(tv*flow.length))}
$('#v').innerHTML=flow.map((f,i)=>`<span>${T.verbs[i]}</span>`).join('');
$('#tx').innerHTML=flow.map(f=>`<div>${f.d}<b>${f.get}</b></div>`).join('');
const vsp=[...document.querySelectorAll('#v span')],vtx=[...document.querySelectorAll('#tx div')];let vi=-1;
function vs(i){if(i===vi)return;vi=i;vsp.forEach((s,k)=>s.classList.toggle('on',k===i));vtx.forEach((s,k)=>s.classList.toggle('on',k===i))}
addEventListener('scroll',()=>requestAnimationFrame(onScroll),{passive:true});
// faq
$('#q').innerHTML=T.faq.map(([q],i)=>`<button data-i="${i}">${q}</button>`).join('');
function fq(i){document.querySelectorAll('#q button').forEach((b,k)=>b.classList.toggle('on',k===i));$('#a').textContent=T.faq[i][1]}
$('#q').onclick=e=>{const b=e.target.closest('button');if(b)fq(+b.dataset.i)};
fq(0);app(0);vs(0);onScroll();
</script></body></html>
