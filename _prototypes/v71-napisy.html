<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Napisy (wariant 71)</title>
<style>
:root{--c:#2d3a8c;--l:#6f86ff}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{font:18px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Display",Helvetica,sans-serif;color:#fff;-webkit-font-smoothing:antialiased;background:var(--c);transition:background 1s cubic-bezier(.3,.7,.2,1)}
.brand{position:fixed;left:4vw;top:24px;z-index:30;font-weight:800;font-size:20px;letter-spacing:-.03em}
.brand small{display:block;font-weight:500;font-size:13px;opacity:.75}
.wall{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;justify-content:center;gap:0;overflow:hidden;background:radial-gradient(70% 70% at 50% 45%,rgba(255,255,255,.14),transparent 70%)}
.row{white-space:nowrap;font-size:clamp(110px,20vw,320px);font-weight:900;letter-spacing:-.07em;line-height:.88;color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.28);display:flex;width:max-content;animation:mq var(--sp,40s) linear infinite;transition:opacity .6s,transform .8s cubic-bezier(.2,.9,.2,1)}
.row.r2{animation-direction:reverse;-webkit-text-stroke-color:rgba(255,255,255,.18)}
.row.r2 span:nth-child(odd){color:rgba(255,255,255,.07);-webkit-text-stroke:0}
.row span{padding-right:.4em}
.row.fill span:nth-child(3n){color:rgba(255,255,255,.1);-webkit-text-stroke:0}
.row.out{opacity:0;transform:translateY(-30vh)}
.row.in{animation:mq var(--sp,40s) linear infinite,rin .9s cubic-bezier(.2,.9,.2,1)}
@keyframes mq{to{transform:translateX(-50%)}}
@keyframes rin{from{opacity:0;margin-top:30vh}}
.card{position:fixed;left:50%;top:50%;transform:translate(-50%,-52%);width:min(980px,92vw);z-index:10;display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:34px;align-items:center;background:rgba(255,255,255,.14);backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);border:1px solid rgba(255,255,255,.3);border-radius:38px;padding:34px 38px;box-shadow:0 40px 90px -20px rgba(0,0,0,.5);animation:ci .7s cubic-bezier(.2,.9,.2,1)}
@keyframes ci{from{opacity:0;transform:translate(-50%,-44%) scale(.97)}}
.hd{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.hd .ico,.hd .ico-fallback{width:72px;height:72px;border-radius:23%;object-fit:cover;display:grid;place-items:center;font:800 32px sans-serif;color:#fff;box-shadow:0 12px 26px rgba(0,0,0,.35)}
.hd small{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.8;display:block}
.hd h1{font-size:clamp(34px,4.6vw,60px);letter-spacing:-.05em;line-height:1;font-weight:900}
.card .t{font-size:clamp(19px,2vw,26px);font-weight:700;letter-spacing:-.025em;line-height:1.22;margin-bottom:14px}
.card .f{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.card .f span{font-size:14.5px;font-weight:600;padding:6px 14px;border-radius:99px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.28)}
.btn{all:unset;cursor:pointer;display:inline-flex;gap:10px;background:#fff;color:#14141c;font-weight:800;padding:13px 24px;border-radius:99px;font-size:16px;transition:.25s}
.btn:hover{transform:translateY(-2px)}
.btn.g{background:rgba(255,255,255,.16);color:#fff;border:1.5px solid rgba(255,255,255,.4);margin-left:8px}
.ph{height:min(56vh,480px);aspect-ratio:9/19.5;margin:0 auto;border-radius:36px;overflow:hidden;background:#000;box-shadow:0 0 0 7px #0a0a0e,0 0 0 9px rgba(255,255,255,.2),0 30px 60px -10px rgba(0,0,0,.6);rotate:3deg;margin-top:-2vh}
.ph img{width:100%;height:100%;object-fit:cover;object-position:top}
.ph .fb{width:100%;height:100%;display:grid;place-items:center;font:900 140px sans-serif;color:#fff}
.dock{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:20;display:flex;gap:10px;padding:9px 14px;background:rgba(255,255,255,.12);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.26);border-radius:28px}
.dock button{all:unset;cursor:pointer;width:52px;height:52px;border-radius:23%;overflow:hidden;opacity:.65;transition:.3s cubic-bezier(.3,1.4,.5,1);position:relative}
.dock button:hover{opacity:1;transform:translateY(-8px) scale(1.14)}
.dock button.on{opacity:1;transform:translateY(-6px) scale(1.15);box-shadow:0 0 0 3px #fff}
.dock .ico,.dock .ico-fallback{width:100%;height:100%;object-fit:cover;display:grid;place-items:center;font:800 20px sans-serif;color:#fff}
@media(max-width:860px){.card{grid-template-columns:1fr;padding:24px}.ph{display:none}.dock{max-width:96vw;overflow-x:auto}}
</style>
</head>
<body>
<div class="brand">ideaapps<small>Marcin Polak · iOS · tvOS · AI</small></div>
<div class="wall" id="wall"></div>
<div class="card" id="card"></div>
<div class="dock" id="dock"></div>
<script src="data.js"></script><script src="ui.js"></script>
<script>
const {projects}=IDEA;
const $=s=>document.querySelector(s);
const deep=c=>`color-mix(in srgb,${c} 78%,#0b0b12)`;
$('#dock').innerHTML=projects.map((p,i)=>`<button data-i="${i}" title="${p.name}">${IDEA.iconHTML(p,'')}</button>`).join('');
let cur=-1;
function rows(name){const w=$('#wall');const old=[...w.children];old.forEach((r,i)=>{r.classList.add('out');setTimeout(()=>r.remove(),700)});
 const txt=Array(8).fill(name.toUpperCase());
 const mk=(cls,sp)=>{const r=document.createElement('div');r.className='row '+cls+' in';r.style.setProperty('--sp',sp+'s');r.innerHTML=txt.map(t=>`<span>${t}</span>`).join('');return r};
 setTimeout(()=>{w.append(mk('r1',46),mk('r2 fill',60),mk('r1 fill',52))},old.length?250:0)}
function select(i){if(i===cur)return;cur=i;const p=projects[i];
 document.documentElement.style.setProperty('--c',deep(p.color));rows(p.name);
 document.querySelectorAll('.dock button').forEach((b,k)=>b.classList.toggle('on',k===i));
 const c=$('#card');c.style.animation='none';c.offsetWidth;c.style.animation='';
 c.innerHTML=`<div><div class="hd">${IDEA.iconHTML(p,'')}<div><small>${p.cat} · ${p.platforms.split(' · ')[0]}</small><h1>${p.name}</h1></div></div><div class="t">${p.tag}</div><div class="f">${(p.feats||[]).slice(0,3).map(f=>`<span>${f.split(/[,.]/)[0]}</span>`).join('')}</div><button class="btn" id="more">Szczegóły →</button><a class="btn g" href="${p.url}" target="_blank" rel="noopener" style="text-decoration:none">App Store ↗</a></div><div>${p.shot&&p.id!=='boxes'?`<div class="ph"><img src="${p.shot}" alt=""></div>`:`<div class="ph"><div class="fb" style="background:linear-gradient(160deg,${p.color},color-mix(in srgb,${p.color} 50%,#000))">${p.name[0]}</div></div>`}</div>`;
 $('#more').onclick=()=>IDEA.ui.app(p)}
$('#dock').addEventListener('click',e=>{const b=e.target.closest('button');if(b)select(+b.dataset.i)});
addEventListener('keydown',e=>{if(e.key==='ArrowRight')select((cur+1)%projects.length);if(e.key==='ArrowLeft')select((cur-1+projects.length)%projects.length)});
IDEA.ui.bar(null,'top');select(0);
</script>
</body>
</html>
