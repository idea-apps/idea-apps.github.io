<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ideaapps — Xcode (wariant 16)</title>
<style>
:root{--bg:#fff;--side:#f1f1f3;--bar:#e9e9ec;--line:#d9d9de;--ink:#1c1c1e;--soft:#8a8a8e;--kw:#ad3da4;--ty:#3e8087;--st:#d12f1b;--cm:#707f8c;--nm:#272ad8;--fn:#4b21b0;--sel:#0a60ff}
@media(prefers-color-scheme:dark){:root{--bg:#1f1f24;--side:#2a2a2e;--bar:#2f2f33;--line:#3d3d42;--ink:#e6e6ea;--soft:#8e8e93;--kw:#ff7ab2;--ty:#6bdfff;--st:#ff8170;--cm:#7f8c98;--nm:#d9c97c;--fn:#b281eb;--sel:#0a60ff}}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--side);color:var(--ink);font:13px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;display:flex;flex-direction:column;overflow:hidden}
a{color:inherit;text-decoration:none}
.tb{height:46px;background:var(--bar);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:14px;flex:none}
.tl{display:flex;gap:8px}.tl i{width:12px;height:12px;border-radius:50%;background:#ff5f57}.tl i:nth-child(2){background:#febc2e}.tl i:nth-child(3){background:#28c840}
.run{width:26px;height:26px;border-radius:50%;border:0;background:transparent;color:var(--soft);font-size:14px}
.sch{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:3px 12px;font-size:12px;display:flex;gap:8px;flex:1;max-width:560px;margin:0 auto;justify-content:space-between}
.sch b{font-weight:600}.sch span{color:var(--soft)}.ok{color:#28a745;font-weight:600}
.main{flex:1;display:grid;grid-template-columns:250px 1fr 340px;min-height:0}
.nav{background:var(--side);border-right:1px solid var(--line);padding:10px 8px;overflow:auto}
.nav h6{font-size:11px;color:var(--soft);font-weight:600;margin:12px 8px 4px;text-transform:uppercase}
.f{display:flex;align-items:center;gap:7px;padding:4px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.f:hover{background:rgba(128,128,128,.14)}.f.on{background:var(--sel);color:#fff}
.f .ic{width:16px;height:16px;border-radius:4px;background:#f05138;color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;flex:none}
.f .ic.md{background:#7a7a80}.f .ic.fo{background:#5aa7ff}
.ed{background:var(--bg);display:flex;flex-direction:column;min-width:0}
.tabs{height:32px;border-bottom:1px solid var(--line);background:var(--side);display:flex;align-items:center;padding:0 12px;font-size:12px;gap:6px;color:var(--soft)}
.tabs b{color:var(--ink);font-weight:500}
.code{flex:1;overflow:auto;padding:14px 0;font:13px/1.65 "SF Mono",Menlo,monospace;counter-reset:l}
.code div{padding:0 22px 0 66px;position:relative;white-space:pre-wrap;word-break:break-word}
.code div::before{counter-increment:l;content:counter(l);position:absolute;left:0;width:48px;text-align:right;color:var(--soft);opacity:.7}
.k{color:var(--kw);font-weight:600}.t{color:var(--ty)}.s{color:var(--st)}.c{color:var(--cm)}.n{color:var(--nm)}.fn{color:var(--fn)}
.code a.s{text-decoration:underline;text-decoration-style:dotted}
.cv{background:var(--side);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.cv .h{height:32px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;font-size:12px;color:var(--soft)}
.cv .b{flex:1;display:grid;place-items:center;padding:18px;overflow:auto;background:repeating-conic-gradient(rgba(128,128,128,.07) 0 25%,transparent 0 50%) 0 0/20px 20px}
.dev{width:230px;aspect-ratio:9/19.2;border-radius:40px;background:#000;padding:8px;box-shadow:0 18px 40px rgba(0,0,0,.35);position:relative}
.dev .sc{width:100%;height:100%;border-radius:32px;overflow:hidden;background:var(--c,#222);display:grid;place-items:center}
.dev img{width:100%;height:100%;object-fit:cover;object-position:top}
.dev .fb{color:#fff;font:800 90px/1 sans-serif;text-align:center}.dev .fb small{display:block;font:600 15px sans-serif;opacity:.8;margin-top:6px}
.sb{height:24px;background:var(--bar);border-top:1px solid var(--line);font-size:11.5px;color:var(--soft);display:flex;align-items:center;padding:0 12px;gap:18px;flex:none}
@media(max-width:1000px){.main{grid-template-columns:200px 1fr}.cv{display:none}}
@media(max-width:640px){.main{grid-template-columns:1fr;grid-template-rows:auto 1fr}.nav{max-height:150px;border-right:0;border-bottom:1px solid var(--line)}.sch{display:none}}
</style>
</head>
<body>
<div class="tb"><div class="tl"><i></i><i></i><i></i></div><button class="run">▶</button>
<div class="sch"><b>ideaapps › iPhone</b><span id="st"><span class="ok">Build Succeeded</span> · dzisiaj</span></div></div>
<div class="main">
<div class="nav" id="nav"></div>
<div class="ed"><div class="tabs" id="tabs"></div><div class="code" id="code"></div></div>
<div class="cv"><div class="h">Canvas · Preview</div><div class="b" id="pv"></div></div>
</div>
<div class="sb"><span>Swift</span><span>10+ lat</span><span>iOS · tvOS · AI</span><span style="margin-left:auto" id="ln"></span></div>
<script src="data.js"></script>
<script>
const {projects,services,email}=IDEA;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
const K=x=>`<span class="k">${x}</span>`,T=x=>`<span class="t">${x}</span>`,S=x=>`<span class="s">"${esc(x)}"</span>`,C=x=>`<span class="c">${esc(x)}</span>`,N=x=>`<span class="n">${x}</span>`,F=x=>`<span class="fn">${x}</span>`;
const files={};
files['ideaapps.swift']={ic:'sw',lines:[
 C('// ideaapps.swift'),C('// Marcin Polak, iOS / tvOS / AI developer'),'',
 K('import')+' SwiftUI','',
 K('struct')+' '+T('Developer')+' {',
 '    '+K('let')+' name = '+S('Marcin Polak'),
 '    '+K('let')+' company = '+S('ideaapps'),
 '    '+K('let')+' experience = '+N('10')+' '+C('// lat iOS i tvOS, wcześniej Android'),
 '    '+K('let')+' platforms: ['+T('Platform')+'] = [.iPhone, .iPad, .mac, .appleTV]',
 '    '+K('let')+' tools = ['+S('Swift')+', '+S('SwiftUI')+', '+S('Core ML')+', '+S('Claude API')+']','',
 '    '+K('var')+' pitch: '+T('String')+' {',
 '        '+S('Całe aplikacje od pomysłu po App Store. Sam, bez pośredników.'),
 '    }',
 '}','',
 C('// Otwórz pliki z lewej: Apps/, Services.swift, Contact.swift')]};
projects.forEach(p=>{const nm=p.name.replace(/\s/g,'');files[nm+'.swift']={ic:'sw',group:'Apps',p,lines:[
 C('// '+nm+'.swift'),'',K('import')+' SwiftUI','',
 K('struct')+' '+T(nm)+': '+T('PublishedApp')+' {',
 '    '+K('let')+' tagline = '+S(p.tag),
 '    '+K('let')+' category = '+S(p.cat),
 '    '+K('let')+' platforms = '+S(p.platforms),
 '    '+K('let')+' summary = '+S(p.desc),
 '    '+K('let')+' appStore = '+T('URL')+'(string: <a class="s" href="'+p.url+'" target="_blank" rel="noopener">"'+p.url+'"</a>)!',
 '    '+K('let')+' status: '+T('Status')+' = .live',
 '}']}});
files['Services.swift']={ic:'sw',lines:[C('// Services.swift'),'',K('enum')+' '+T('Service')+' {',...services.map((s,i)=>'    '+C('/// '+s.d)+'\n    '+K('case')+' '+F(['ios','tvOS','ai','mvp'][i])+' = '+S(s.t)),'}']};
files['Contact.swift']={ic:'sw',lines:[C('// Contact.swift'),'',K('let')+' idea = '+S('Twoja aplikacja'),'',K('func')+' '+F('letsTalk')+'() {','    '+T('Mail')+'.'+F('send')+'(to: <a class="s" href="mailto:'+email+'">"'+email+'"</a>)','}','',C('// odpowiadam zwykle tego samego dnia')]};
files['README.md']={ic:'md',lines:['# ideaapps','','Natywne aplikacje na iOS i tvOS, z AI w środku.','','- 8 aplikacji w App Store','- 10+ lat doświadczenia','- jedna osoba odpowiada za całość']};
const order=['ideaapps.swift',...projects.map(p=>p.name.replace(/\s/g,'')+'.swift'),'Services.swift','Contact.swift','README.md'];
const nav=document.getElementById('nav');
nav.innerHTML='<h6>ideaapps</h6>'+row('ideaapps.swift')+'<h6>Apps</h6>'+projects.map(p=>row(p.name.replace(/\s/g,'')+'.swift')).join('')+'<h6>Info</h6>'+row('Services.swift')+row('Contact.swift')+row('README.md');
function row(n){const f=files[n];return `<div class="f" data-f="${n}"><span class="ic ${f.ic}">${f.ic==='md'?'M':'S'}</span>${n}</div>`}
function open(n){const f=files[n];document.querySelectorAll('.f').forEach(e=>e.classList.toggle('on',e.dataset.f===n));
 document.getElementById('tabs').innerHTML=`ideaapps › ${f.group?f.group+' › ':''}<b>${n}</b>`;
 document.getElementById('code').innerHTML=f.lines.join('\n').split('\n').map(l=>`<div>${l||' '}</div>`).join('');
 document.getElementById('ln').textContent=f.lines.length+' linii';
 const p=f.p,pv=document.getElementById('pv');
 pv.innerHTML=p?`<div class="dev" style="--c:${p.color}"><div class="sc">${p.shot?`<img src="${p.shot}" alt="">`:`<div class="fb">${p.name[0]}<small>${p.name}</small></div>`}</div></div>`
  :`<div class="dev" style="--c:#1c1c1e"><div class="sc"><div class="fb" style="font-size:44px;padding:20px">Marcin<small>iOS · tvOS · AI</small></div></div></div>`}
nav.onclick=e=>{const f=e.target.closest('.f');if(f)open(f.dataset.f)};
open('ideaapps.swift');
</script>
</body>
</html>
