flow:
- t: Wymagania
  sub: Rozmowa i zakres
  d: 'Pierwszym krokiem jest rozmowa: co powstaje, dla kogo i po co. Pomysł jest przycinany
    do wersji, którą można szybko sprawdzić z prawdziwymi użytkownikami.'
  get: Zakres prac, lista ekranów i kryteria akceptacji.
- t: Prototyp
  sub: Design i prototyp z AI
  d: Zamiast makiet w PDF powstaje działający prototyp, który można wziąć do ręki
    na własnym iPhonie. AI generuje ekrany i warianty bardzo szybko, a developer wybiera
    to, co pasuje do wytycznych Apple i do użytkowników.
  get: Działający, klikalny prototyp zamiast statycznych makiet.
- t: Budowa
  sub: Kodowanie z agentami
  d: 'Kod powstaje natywnie w Swift i SwiftUI. Agenci kodujący przejmują rutynę: ekrany,
    testy, tłumaczenia. Każda zmiana jest czytana i zatwierdzana przez developera,
    więc odpowiedzialność za kod jest taka sama jak bez AI.'
  get: Natywna aplikacja w Swift i SwiftUI oraz czysty kod w repozytorium zamawiającego.
- t: Iteracje
  sub: Regularne wersje
  d: Kolejne wersje trafiają do zamawiającego regularnie przez TestFlight. Postęp
    widać na własnym telefonie, a kierunek można zmienić, zanim zrobi się drogo. Uwagi
    zamieniają się w zadania.
  get: Regularne wersje do wypróbowania i możliwość zmiany kierunku.
- t: Jakość
  sub: Testy i prywatność
  d: Testy na prawdziwych urządzeniach, dostępność, wydajność i prywatność danych.
    Automatyczne testy powstają z pomocą AI, a scenariusze kluczowe dla produktu są
    sprawdzane ręcznie.
  get: Stabilna wersja i lista sprawdzonych scenariuszy.
- t: Premiera
  sub: App Store
  d: Opis, zrzuty ekranu, polityka prywatności, zgodność z wymogami i recenzja Apple.
    Osiem własnych publikacji oznacza, że pułapki sklepu są znane i omijane od początku.
  get: Aplikacja opublikowana w App Store.
- t: Rozwój
  sub: Po premierze
  d: 'Aplikacja żyje po premierze: poprawki, nowe wersje systemu, reakcja na opinie
    i kolejne funkcje. Za całość odpowiada ta sama osoba, więc nie ma przekazywania
    wiedzy.'
  get: Aktualizacje i jeden stały kontakt.
faq:
- q: Czy AI napisze całą aplikację?
  a: AI przyspiesza pracę, ale nie podejmuje decyzji. Agenci kodujący piszą ekrany,
    testy i tłumaczenia, a developer projektuje architekturę, czyta każdą zmianę i
    odpowiada za efekt.
- q: Kto odpowiada za jakość kodu?
  a: Developer. Każda zmiana jest przeglądana, zanim trafi do produktu, a kod pozostaje
    czytelny i możliwy do rozwijania także przez innych.
- q: Czy kod i pomysł należą do zamawiającego?
  a: Tak. Kod trafia do repozytorium zamawiającego, a prawa do aplikacji są ustalane
    w umowie na początku.
- q: Jak wygląda widoczność postępu?
  a: Na własnym telefonie. Każda iteracja to nowa wersja w TestFlight, którą można
    wziąć do ręki i skomentować.
- q: Co z prywatnością danych?
  a: Projekt zaczyna się od minimum danych, jasnej polityki prywatności i zgodności
    z wymogami Apple. Tam, gdzie to możliwe, modele AI działają na urządzeniu.
- q: Czy można poprawić istniejącą aplikację?
  a: 'Tak. Pierwszym krokiem jest przegląd kodu: architektura, wydajność, zgodność
    z nowymi wersjami systemu. Potem plan zmian w małych krokach.'
